<li>No tapping, no rolling, no vibrating.</li></ol>
<p>[[red]] &nbsp; [[right]] &nbsp; [[very]] &nbsp; [[sorry]] &nbsp; [[library]] &nbsp; [[February]]</p>
<div class="box ca"><b>R after vowels is pronounced</b><p>Canadian English is “rhotic”: the R after a vowel is <b>always</b> said, unlike British English. [[car]] [[hard]] [[water]] [[teacher]] [[Thursday]] [[world]] — you hear the R clearly in each.</p></div>
<div class="box tip"><b>Trick for R</b><p>Start with a long “errr” sound (like a growl, or the vowel in <i>bird</i>). Hold it. Then add a vowel: “errr-ed” → <i>red</i>. Your tongue is now in the right place.</p></div>`,
ex:[
{type:'pairs',q:'R vs L (another common confusion)',pairs:[['right','light'],['read','lead'],['rock','lock'],['grass','glass'],['pray','play'],['correct','collect']]},
{type:'mc',q:'Which word has a silent H?',o:['house','hour','hello','behind'],a:1},
{type:'say',q:'Soft H, curled R (no rolling!).',lines:['Hello, how are you?','I’m sorry I’m late.','The library is on the right.','Her birthday is in February.']}
]},

{id:'p6',title:'Final Consonants: bag / back',
lede:'Many languages change or drop final consonants. English does not — and the difference changes the meaning.',
ru:'В русском звонкие согласные в конце слова оглушаются (дуб → [дуп]). В английском так делать нельзя: bag и back — разные слова.',
body:`
<p>In some languages (German, Russian, Polish, Turkish…) a voiced consonant at the end of a word becomes voiceless. In others (Mandarin, Spanish, Tagalog…) final consonants are often weak or dropped. English does <b>not</b> do this:</p>
<div class="tw"><table><tr><th>Voiced end</th><th>Voiceless end</th></tr>
<tr><td>[[bag]]</td><td>[[back]]</td></tr><tr><td>[[dog]]</td><td>[[dock]]</td></tr><tr><td>[[bed]]</td><td>[[bet]]</td></tr><tr><td>[[eyes]]</td><td>[[ice]]</td></tr><tr><td>[[prize]]</td><td>[[price]]</td></tr><tr><td>[[have]]</td><td>[[half]]</td></tr></table></div>
<div class="box rule"><b>The secret: the vowel length</b><p>English speakers actually hear the difference mostly in the <b>vowel</b>: before a voiced consonant, the vowel is <b>longer</b>. <i>bag</i> = “baaag”, <i>back</i> = “bak.” <i>eyes</i> = “aaayz”, <i>ice</i> = “ais.” So: lengthen the vowel, and keep a little buzz at the end.</p></div>
<h3>-s endings: s, z or iz</h3>
<p>Plurals, verbs (he plays) and possessives (Maria’s) end in three different sounds:</p>
<div class="tw"><table><tr><th>After…</th><th>Sound</th><th>Examples</th></tr>
<tr><td>voiceless sounds (p, t, k, f, θ)</td><td>/s/</td><td>[[cats]] [[books]] [[stops]]</td></tr>
<tr><td>voiced sounds and vowels</td><td>/z/</td><td>[[dogs]] [[plays]] [[friends]] [[Maria’s]]</td></tr>
<tr><td>s, z, sh, ch, j sounds</td><td>/ɪz/ (extra syllable)</td><td>[[buses]] [[watches]] [[changes]] [[boxes]]</td></tr></table></div>
<h3>-ed endings: t, d or id</h3>
<div class="tw"><table><tr><th>After…</th><th>Sound</th><th>Examples</th></tr>
<tr><td>voiceless sounds</td><td>/t/</td><td>[[worked]] [[stopped]] [[watched]] [[laughed]]</td></tr>
<tr><td>voiced sounds and vowels</td><td>/d/</td><td>[[played]] [[called]] [[lived]] [[studied]]</td></tr>
<tr><td>t or d</td><td>/ɪd/ (extra syllable)</td><td>[[wanted]] [[needed]] [[started]] [[decided]]</td></tr></table></div>
<div class="box tip"><b>Common mistake</b><p>Do <b>not</b> add an extra syllable to every -ed word: <i>worked</i> is ONE syllable (“workt”), not “work-ed.” Only after t or d do you add the extra “id.”</p></div>`,
ex:[
{type:'pairs',pairs:[['bag','back'],['dog','dock'],['bed','bet'],['eyes','ice'],['prize','price'],['card','cart'],['rise','rice'],['leave','leaf']]},
{type:'mc',q:'How many syllables in “watched”?',o:['1 (watcht)','2 (watch-ed)'],a:0},
{type:'mc',q:'Which word ends with an extra /ɪd/ syllable?',o:['played','jumped','needed','opened'],a:2},
{type:'mc',q:'How do you say the -s in “friends”?',o:['/s/','/z/','/ɪz/'],a:1}
]},

{id:'p7',title:'The Canadian Sound',
lede:'A few vowel features make Canadians sound Canadian. Learn to recognize them.',
ru:'Особенности канадского произношения: «канадское поднятие» (about, house), одинаковые гласные в cot и caught, «sore-ee».',
body:`
<h3>1. Canadian raising: about, house, out</h3>
<p>Before voiceless consonants (t, s, k, p, f), Canadians start the vowels in <i>out</i> and <i>ice</i> higher in the mouth:</p>
<div class="tw"><table><tr><th>Raised (before voiceless)</th><th>Normal (before voiced)</th></tr>
<tr><td>[[house]] (a home) &nbsp; [[out]] &nbsp; [[about]] &nbsp; [[mouth]]</td><td>[[to house]] (verb) &nbsp; [[loud]] &nbsp; [[town]] &nbsp; [[now]]</td></tr>
<tr><td>[[ice]] &nbsp; [[right]] &nbsp; [[price]] &nbsp; [[write]] &nbsp; [[life]]</td><td>[[eyes]] &nbsp; [[ride]] &nbsp; [[prize]] &nbsp; [[time]] &nbsp; [[lives]]</td></tr></table></div>
<p>Americans joke that Canadians say “aboot.” They don’t — it sounds more like “a-boat” said quickly, or “ab-uh-oot.” Your computer voice may or may not do this, depending on your device. Listen for it with real Canadians.</p>
<h3>2. cot = caught</h3>
<p>In most of Canada, <i>cot</i> and <i>caught</i>, <i>Don</i> and <i>Dawn</i>, <i>stock</i> and <i>stalk</i> sound <b>exactly the same</b>. Good news: one fewer vowel to learn!</p>
<h3>3. Sorry, tomorrow, borrow</h3>
<p>Canadians say [[sorry]] like “sore-ee,” and [[tomorrow]] and [[borrow]] with the same “or” sound.</p>
<h3>4. Words with Canadian pronunciation</h3>
<div class="tw"><table><tr><th>Word</th><th>Canadian</th><th>Note</th></tr>
<tr><td>Z (the letter)</td><td>[[zed]]</td><td>Americans say “zee.”</td></tr>
<tr><td>been</td><td>[[been]]</td><td>Often “bin” in casual speech.</td></tr>
<tr><td>pasta, drama</td><td>“pass-ta,” “dram-a”</td><td>Often the /æ/ of <i>cat</i>.</td></tr>
<tr><td>process, project</td><td>“PRO-cess,” “PRO-ject”</td><td>Long O, like British.</td></tr>
<tr><td>schedule</td><td>“SKED-jool” (most) or “SHED-jool”</td><td>Both are heard.</td></tr>
<tr><td>Toronto</td><td>“Tuh-RAH-no” or “Trawno”</td><td>Locals drop the second T!</td></tr></table></div>
<div class="box tip"><b>Do you need to copy this?</b><p>No. Your goal is to be <b>clear</b>, not to sound like you were born in Canada. But knowing these patterns makes Canadian speech much easier to understand.</p></div>`,
ex:[
{type:'mc',q:'How do Canadians say the letter Z?',o:['zee','zed','zet'],a:1},
{type:'mc',q:'In most of Canada, “cot” and “caught” sound…',o:['the same','different'],a:0},
{type:'mc',q:'Do Canadians really say “aboot”?',o:['Yes, exactly like that.','No — it is a raised vowel that sounds closer to “a-boat” said quickly.'],a:1}
]}
]});

/* ---------- UNIT 05: GRAMMAR FOR SPEAKING ---------- */
OLD.push({id:'u5',title:'Grammar for Speaking',desc:'Articles, tenses, questions and phrasal verbs — the grammar you use every time you talk.',ru:'Артикли, времена, вопросы и фразовые глаголы — грамматика для разговора.',lessons:[

{id:'g1',title:'Articles: a, an, the — or nothing',
lede:'Many languages have no articles, or use them differently — so this is one of the biggest grammar challenges for learners.',
ru:'В русском языке нет артиклей. a/an — «один из многих, какой-то»; the — «тот самый, известный обоим»; без артикля — вообще, в целом.',
body:`
<p>Articles are small, unstressed words — but English speakers notice immediately when they are missing. “I have test tomorrow” sounds strange, even though everyone understands it.</p>
<h3>A / AN — “one, any one, not specific”</h3>
<ul><li>First time you mention something: [[I saw a «MOOSE» today!]]</li>
<li>One of many: [[She’s a «TEACH»er.]] (jobs always need a/an)</li>
<li>Only with <b>singular countable</b> nouns: a book, a friend — <span class="wrong">a water</span>, <span class="wrong">a homework</span></li></ul>
<div class="box rule"><b>A or AN?</b><p>It depends on the first <b>sound</b>, not the letter: <b>an</b> before a vowel sound — [[an apple]], [[an hour]] (silent h), [[an MP3]] (“em”). <b>a</b> before a consonant sound — [[a book]], [[a university]] (“yoo”), [[a one-way ticket]] (“wun”).</p></div>
<h3>THE — “the specific one we both know”</h3>
<ul><li>Second mention: “I saw a moose. <b>The</b> moose was huge!”</li>
<li>We both know which one: [[Close the «DOOR».]] (the door of this room)</li>
<li>There is only one: [[the «SUN»]], [[the «IN»ternet]], [[the «PRIN»cipal]] (of our school)</li>
<li>Superlatives and ordinals: [[the «BEST»]], [[the «FIRST» day]]</li>
<li>Specific with a description: [[the «BOOK» on the «TA»ble]]</li></ul>
<h3>NO article — “in general”</h3>
<ul><li>General plurals: [[I like «DOGS».]] (dogs in general — not <span class="wrong">the dogs</span>)</li>
<li>Uncountable nouns in general: [[«MU»sic is im«POR»tant.]] [[I «NEED» «HELP».]]</li>
<li>Most names, cities, countries: Maria, Ottawa, Canada, Mexico (but: <b>the</b> United States, <b>the</b> UK)</li>
<li>Routine places: [[go to «SCHOOL»]], [[go to «BED»]], [[at «WORK»]], [[at «HOME»]]</li>
<li>Meals, days, months, languages, school subjects: [[after «LUNCH»]], [[on «MON»day]], [[I «LOVE» «MATH».]]</li></ul>
<div class="box tip"><b>If your language has no articles</b><p>Mandarin, Punjabi, Tagalog, Russian and many other languages have no a/an/the. Use this quick test: Could I say <b>“one / some / any”</b>? → use <i>a</i>. Could I say <b>“this one / that one we both know”</b>? → use <i>the</i>. Am I talking about <b>everything of this kind</b>? → no article.</p></div>
<h3>Pronunciation</h3>
<p><i>The</i> is “thə” before consonants ([[the «CAR»]]) and “thee” before vowels ([[the «END»]], [[the «A»pple]]). Both are weak and fast.</p>`,
ex:[
{type:'fill',q:'I need ___ umbrella. It’s raining.',a:['an'],show:'an (first sound is a vowel)'},
{type:'fill',q:'Can you open ___ window? It’s hot in here.',a:['the'],show:'the (we both know which window)'},
{type:'fill',q:'I don’t like ___ coffee. (coffee in general) — type “-” for no article',a:['∅'],show:'— no article (general, uncountable)'},
{type:'fill',q:'My brother is ___ nurse.',a:['a'],show:'a (jobs need a/an)'},
{type:'fill',q:'She’s ___ best student in ___ class. (two answers, separate with a space)',a:['the the','the, the','the/the'],show:'the best … the class'},
{type:'fill',q:'He goes to ___ school by bus. — type “-” for no article',a:['∅'],show:'— no article (routine place)'},
{type:'mc',q:'Choose the correct sentence.',o:['I want to study in the Canada.','I want to study in Canada.','I want to study in a Canada.'],a:1},
{type:'mc',q:'Choose the correct sentence.',o:['It took a hour.','It took an hour.'],a:1,why:'The H in hour is silent, so it starts with a vowel sound.'}
]},

{id:'g2',title:'Present Perfect vs Past Simple',
lede:'Many languages have one past tense. English has two common ones — and they are not the same.',
ru:'Past Simple — законченное время в прошлом (yesterday, in 2023). Present Perfect — связь с настоящим: опыт, результат, незаконченный период. «Я живу здесь два года» = I’ve lived here for two years.',
body:`
<h3>Past simple — finished time</h3>
<p>Use it when the time is <b>finished</b> and you say (or both people know) <b>when</b>:</p>
<p>[[I «CAME» to Canada in «JUNE».]] &nbsp; [[We «WATCHED» a movie «LAST» night.]] &nbsp; [[Did you «SEE» the game yesterday?]]</p>
<p>Time words: <i>yesterday, last week, in 2025, two days ago, when I was ten</i>.</p>
<h3>Present perfect — connected to now</h3>
<p>Form: <b>have / has + past participle</b> (been, done, seen, lived…). Contracted in speech: <i>I’ve, she’s, we’ve</i>.</p>
<h4>1. Life experience (no specific time)</h4>
<p>[[I’ve «BEEN» to «MOS»cow.]] &nbsp; [[Have you «EV»er tried «POU»tine?]] &nbsp; [[I’ve «NEV»er seen a «MOOSE».]]</p>
<h4>2. A past action with a result now</h4>
<p>[[I’ve «LOST» my «KEYS».]] (I can’t find them now) &nbsp; [[She’s «FIN»ished her «HOME»work.]] (she’s free now)</p>
<h4>3. Started in the past, still continuing</h4>
<p>[[I’ve «LIVED» here for two «MONTHS».]] &nbsp; [[We’ve «KNOWN» each other since «JUNE».]]</p>
<div class="box tip"><b>The biggest mistake</b><p>In many languages — French, Spanish, Arabic, Russian and others — you use the <b>present</b> tense for something that started in the past and is still true. In English this becomes <b>present perfect</b>:<br><span class="wrong">I live here since two months.</span><br><span class="wrong">I am living here for two months.</span><br><span class="right">I’ve lived here for two months.</span> / <span class="right">I’ve been living here for two months.</span></p></div>
<h3>for vs since</h3>
<p><b>for</b> + a length of time: <i>for two years, for a week, for ages</i>.<br><b>since</b> + a starting point: <i>since 2024, since Monday, since I was 15</i>.</p>
<h3>Don’t mix them</h3>
<p>Never use present perfect with a finished time word: <span class="wrong">I’ve seen him yesterday.</span> → <span class="right">I saw him yesterday.</span></p>
<p>A typical conversation starts with present perfect (experience), then moves to past simple (details):<br>— [[Have you «EV»er been to «OT»tawa?]]<br>— [[Yeah, I «WENT» there last «SUM»mer.]]<br>— [[Oh, «COOL»! What did you «DO»?]]</p>`,
ex:[
{type:'mc',q:'Choose: “I ___ in Canada since June.”',o:['am','was','have been'],a:2},
{type:'mc',q:'Choose: “I ___ my homework last night.”',o:['did','have done'],a:0,why:'“Last night” is a finished time → past simple.'},
{type:'mc',q:'Choose: “___ you ever ___ snowboarding?”',o:['Did … go','Have … been','Are … going'],a:1},
{type:'fill',q:'I’ve known him ___ three years.',a:['for'],show:'for (a length of time)'},
{type:'fill',q:'I’ve known him ___ 2023.',a:['since'],show:'since (a starting point)'},
{type:'reveal',q:'Fix the mistake: “I study English five years.”',a:'I’ve studied English for five years. / I’ve been studying English for five years.'}
]},

{id:'g3',title:'Asking Questions',
lede:'English questions need a helping verb before the subject.',
ru:'В английском вопрос строится с вспомогательным глаголом перед подлежащим: Where do you live? — а не Where you live?',
body:`
<p>In many languages, you can make a question with intonation only: “You live here?” In English, most questions need <b>word order change</b>:</p>
<div class="box rule"><b>Pattern</b><p>(Question word) + <b>helping verb</b> + <b>subject</b> + main verb…?</p></div>
<div class="tw"><table><tr><th>Question word</th><th>Helper</th><th>Subject</th><th>Rest</th></tr>
<tr><td>Where</td><td>do</td><td>you</td><td>live?</td></tr>
<tr><td>What</td><td>did</td><td>she</td><td>say?</td></tr>
<tr><td>—</td><td>Are</td><td>you</td><td>ready?</td></tr>
<tr><td>How long</td><td>have</td><td>you</td><td>been here?</td></tr>
<tr><td>When</td><td>does</td><td>the bus</td><td>come?</td></tr></table></div>
<p>Common mistakes: <span class="wrong">Where you live?</span> <span class="wrong">What she said?</span> <span class="wrong">Why you are late?</span></p>
<h3>do / does / did</h3>
<p>If there is no other helping verb, use <b>do</b> (I/you/we/they), <b>does</b> (he/she/it) or <b>did</b> (past). The main verb stays in the base form: <span class="right">What did you <b>eat</b>?</span> — not <span class="wrong">What did you ate?</span></p>
<h3>Questions about the subject — no “do”</h3>
<p>When <i>who</i> or <i>what</i> is the <b>subject</b>, there is no <i>do</i>: [[«WHO» called you?]] (someone called) vs [[«WHO» did you call?]] (you called someone). [[What «HAP»pened?]] — not <span class="wrong">What did happen?</span></p>
<h3>Indirect questions — more polite, normal order</h3>
<p>After <i>Do you know…</i>, <i>Can you tell me…</i>, <i>I wonder…</i> — use <b>statement order</b>, no do/does/did:</p>
<p>Where <b>is the office</b>? → [[Do you know where the «OF»fice is?]]<br>What time <b>does it start</b>? → [[Can you tell me what time it «STARTS»?]]</p>
<h3>Spoken shortcuts</h3>
<p>In casual speech, people often drop the start of the question: [[You «COM»ing?|you coming?]] (Are you coming?) &nbsp; [[«WANT» some?]] (Do you want some?) &nbsp; [[Any «QUES»tions?]] (Are there any questions?) &nbsp; [[«GOT» a sec?]] (Have you got a second?)</p>`,
ex:[
{type:'mc',q:'Choose the correct question.',o:['Where you are from?','Where are you from?','Where you from are?'],a:1},
{type:'mc',q:'Choose the correct question.',o:['What did you buy?','What you bought?','What did you bought?'],a:0},
{type:'mc',q:'Choose the correct question.',o:['Who did break the window?','Who broke the window?'],a:1,why:'<i>Who</i> is the subject — no <i>did</i>.'},
{type:'mc',q:'Choose the polite indirect question.',o:['Do you know where is the washroom?','Do you know where the washroom is?'],a:1},
{type:'reveal',q:'Make a question for the underlined part: “She lives <u>in Petawawa</u>.”',a:'Where does she live?'},
{type:'reveal',q:'Make a question for the underlined part: “The class starts <u>at 8:30</u>.”',a:'What time does the class start? / When does the class start?'}
]},

{id:'g4',title:'Present: Simple vs Continuous',
lede:'“I study” and “I’m studying” are not the same.',
ru:'Present Simple — привычки и факты (I play hockey). Present Continuous — то, что происходит сейчас или временно (I’m playing now). Глаголы состояния (know, like, want) обычно не используются в -ing.',
body:`
<div class="tw"><table><tr><th>Present simple</th><th>Present continuous (be + -ing)</th></tr>
<tr><td>Habits, routines, facts, schedules<br>[[I «PLAY» hockey on «WEEK»ends.]]<br>[[The bus «LEAVES» at «SEV»en.]]<br>[[Water «BOILS» at a «HUN»dred degrees.]]</td>
<td>Right now, around now, temporary situations<br>[[I’m «PLAY»ing hockey right «NOW».]]<br>[[I’m «STAY»ing with my «COUS»in this month.]]<br>[[She’s «STUD»ying for a «TEST».]]</td></tr></table></div>
<h3>he / she / it: don’t forget the -s</h3>
<p>[[She «WORKS» at the «BANK».]] — <span class="wrong">She work…</span> This small -s is the most common grammar mistake for all learners. Listen for it, say it.</p>
<h3>Stative verbs — usually NOT -ing</h3>
<p>Verbs for <b>states</b> (not actions) normally stay simple, even right now:</p>
<p><b>know, understand, believe, like, love, hate, want, need, prefer, mean, own, belong, seem</b></p>
<p><span class="wrong">I’m knowing the answer.</span> → <span class="right">I know the answer.</span><br><span class="wrong">I’m wanting a coffee.</span> → <span class="right">I want a coffee.</span><br><span class="wrong">Are you understanding?</span> → <span class="right">Do you understand?</span></p>
<div class="box tip"><b>But some can change meaning</b><p>[[I «THINK» it’s good.]] (opinion) vs [[I’m «THINK»ing about it.]] (using my brain right now). [[I «HAVE» a car.]] (own) vs [[I’m «HAV»ing lunch.]] (eating).</p></div>`,
ex:[
{type:'mc',q:'“Shh! The baby ___.”',o:['sleeps','is sleeping'],a:1},
{type:'mc',q:'“I usually ___ to school.”',o:['walk','am walking'],a:0},
{type:'mc',q:'“I ___ what you mean.”',o:['understand','am understanding'],a:0,why:'<i>Understand</i> is a stative verb.'},
{type:'fill',q:'My sister ___ (live) in Toronto.',a:['lives'],show:'lives'},
{type:'fill',q:'Look! It ___ (snow)! (use a contraction or full form)',a:['\'s snowing','is snowing','s snowing'],show:'’s snowing / is snowing'}
]},

{id:'g5',title:'Talking About the Future',
lede:'English has several ways to talk about the future. Each one has a job.',
ru:'Will — решение в момент речи, обещание, предсказание. Going to (gonna) — планы и очевидное будущее. Present Continuous — договорённости.',
body:`
<div class="tw"><table><tr><th>Form</th><th>Use</th><th>Example</th></tr>
<tr><td><b>will</b> (’ll)</td><td>A decision you make <b>now</b>, while speaking</td><td>“The phone’s ringing.” — [[I’ll «GET» it!]]</td></tr>
<tr><td></td><td>Offers and promises</td><td>[[I’ll «HELP» you.]] [[I’ll call you «LAT»er.]]</td></tr>
<tr><td></td><td>Predictions (opinions)</td><td>[[I think it’ll «SNOW» tomorrow.]]</td></tr>
<tr><td><b>going to</b> (gonna)</td><td>A plan you already made</td><td>[[I’m gonna «STUD»y computers at «COL»lege.]]</td></tr>
<tr><td></td><td>Prediction from what you see now</td><td>“Look at those clouds — [[it’s gonna «RAIN».]]”</td></tr>
<tr><td><b>present continuous</b></td><td>Fixed arrangements (with a time and other people)</td><td>[[I’m «MEET»ing Sam at «FOUR».]] [[We’re «FLY»ing on «FRI»day.]]</td></tr>
<tr><td><b>present simple</b></td><td>Timetables and schedules</td><td>[[The «MOV»ie starts at «EIGHT».]]</td></tr></table></div>
<div class="box tip"><b>Not always “will”</b><p>Many learners use <i>will</i> for every future, because their language has one future form. But for plans, Canadians almost always say <b>gonna</b>: “What are you gonna do this weekend?” — “I’m gonna sleep!” Using <i>will</i> for every future sounds formal.</p></div>
<h3>Time clauses: no “will”</h3>
<p>After <b>when, if, before, after, as soon as, until</b>, use the <b>present</b> for the future:</p>
<p><span class="right">I’ll call you <b>when I get</b> home.</span> — not <span class="wrong">when I will get</span><br><span class="right"><b>If it snows</b>, we’ll go skiing.</span> — not <span class="wrong">if it will snow</span></p>`,
ex:[
{type:'mc',q:'Your friend: “I’m so thirsty!” You: “___ get you some water.”',o:['I’m going to','I’ll'],a:1,why:'A decision made right now, an offer → will.'},
{type:'mc',q:'“What are your plans for next year?” — “I ___ study nursing at college.”',o:['’m gonna','’ll'],a:0,why:'A plan made before → going to / gonna.'},
{type:'mc',q:'Choose the correct sentence.',o:['I’ll text you when I will arrive.','I’ll text you when I arrive.'],a:1},
{type:'mc',q:'“I ___ my friends at the mall at 3.” (it’s arranged)',o:['meet','’m meeting','will meet'],a:1}
]},

{id:'g6',title:'Phrasal Verbs',
lede:'Verb + small word = a new meaning. Spoken English is full of them.',
ru:'Фразовые глаголы (get up, figure out, hang out) — основа разговорной речи. Значение часто нельзя угадать по частям.',
body:`
<p>A <b>phrasal verb</b> is a verb plus a small word (<i>up, out, on, off, in, down, over</i>…). The meaning is often different from the two words alone. In speech, people use phrasal verbs much more than the formal one-word verb:</p>
<div class="tw"><table><tr><th>Formal</th><th>Spoken (phrasal)</th></tr>
<tr><td>discover, solve</td><td>[[figure «OUT»|figure out]]</td></tr>
<tr><td>postpone</td><td>[[put «OFF»|put off]]</td></tr>
<tr><td>tolerate</td><td>[[put «UP» with|put up with]]</td></tr>
<tr><td>arrive (at a party)</td><td>[[show «UP»|show up]]</td></tr>
<tr><td>spend time with friends</td><td>[[hang «OUT»|hang out]]</td></tr>
<tr><td>register</td><td>[[sign «UP»|sign up]]</td></tr>
<tr><td>stop trying</td><td>[[give «UP»|give up]]</td></tr>
<tr><td>have none left</td><td>[[run «OUT» of|run out of]]</td></tr></table></div>
<h3>Phrasal verbs for daily life</h3>
<div class="tw"><table><tr><th>Verb</th><th>Meaning</th><th>Example</th></tr>
<tr><td>get up</td><td>leave your bed</td><td>[[I get «UP» at «SEV»en.]]</td></tr>
<tr><td>wake up</td><td>stop sleeping</td><td>[[«WAKE» up! You’re «LATE»!]]</td></tr>
<tr><td>put on / take off</td><td>clothes on / off</td><td>[[Put your «JACK»et on — it’s cold.]]</td></tr>
<tr><td>turn on / off</td><td>start / stop a machine</td><td>[[Turn the «LIGHTS» off.]]</td></tr>
<tr><td>turn up / down</td><td>louder / quieter</td><td>[[Can you turn it «DOWN»?]]</td></tr>
<tr><td>pick up</td><td>lift; collect someone</td><td>[[I’ll pick you «UP» at «FIVE».]]</td></tr>
<tr><td>drop off</td><td>take someone and leave them</td><td>[[Can you drop me «OFF» at school?]]</td></tr>
<tr><td>look for</td><td>try to find</td><td>[[I’m «LOOK»ing for my «PHONE».]]</td></tr>
<tr><td>look up</td><td>find information</td><td>[[«LOOK» it up online.]]</td></tr>
<tr><td>look after</td><td>take care of</td><td>[[Can you look «AF»ter the «DOG»?]]</td></tr>
<tr><td>find out</td><td>learn information</td><td>[[I «FOUND» out yesterday.]]</td></tr>
<tr><td>figure out</td><td>understand, solve</td><td>[[I can’t figure this «OUT».]]</td></tr>
<tr><td>hang out</td><td>spend free time</td><td>[[Wanna hang «OUT» after school?]]</td></tr>
<tr><td>come over</td><td>visit someone’s home</td><td>[[Come «O»ver on «SAT»urday.]]</td></tr>
<tr><td>show up</td><td>arrive, appear</td><td>[[He didn’t show «UP».]]</td></tr>
<tr><td>sign up (for)</td><td>register</td><td>[[I signed «UP» for «BAS»ketball.]]</td></tr>
<tr><td>hand in</td><td>give work to the teacher</td><td>[[Hand in your «ES»says on «FRI»day.]]</td></tr>
<tr><td>catch up</td><td>reach the same level</td><td>[[I need to catch «UP» on my «HOME»work.]]</td></tr>
<tr><td>give up</td><td>stop trying</td><td>[[«DON’T» give «UP»!]]</td></tr>
<tr><td>run out of</td><td>have none left</td><td>[[We ran «OUT» of «MILK».]]</td></tr>
<tr><td>get along (with)</td><td>have a good relationship</td><td>[[I get a«LONG» with my «COUS»ins.]]</td></tr>
<tr><td>work out</td><td>exercise; succeed</td><td>[[I work «OUT» at the «GYM».]] [[It’ll work «OUT».]]</td></tr>
<tr><td>log in / log out</td><td>enter / leave an account</td><td>[[Log «IN» with your student «ID».]]</td></tr>
<tr><td>back up</td><td>save a copy of data</td><td>[[«AL»ways back up your «FILES».]]</td></tr>
<tr><td>calm down</td><td>relax</td><td>[[«CALM» down, it’s «FINE».]]</td></tr>
<tr><td>go on</td><td>continue; happen</td><td>[[What’s going «ON»?]]</td></tr></table></div>
<h3>Separable phrasal verbs</h3>
<p>Many phrasal verbs can split: <i>turn off the light</i> = <i>turn the light off</i>. But with a <b>pronoun</b> (it, them, him…), you <b>must</b> split:</p>
<p><span class="right">Turn <b>it</b> off.</span> — never <span class="wrong">Turn off it.</span><br><span class="right">Pick <b>me</b> up at five.</span> — never <span class="wrong">Pick up me.</span></p>
<h3>Stress: the small word is strong</h3>
<p>In phrasal verbs, the particle is usually <b>stressed</b>: [[pick it «UP»]], [[log «IN»]], [[show «UP»]], [[turn it «OFF»]]. But the noun made from a phrasal verb stresses the <b>first</b> part: [[a «LOG»in]] (noun), [[a «BACK»up]] (noun), [[a «WORK»out]] (noun). Compare: “I need to back «UP» my files” / “Do you have a «BACK»up?”</p>`,
ex:[
{type:'mc',q:'“I can’t ___ how to fix this.”',o:['figure out','give up','show up'],a:0},
{type:'mc',q:'“We ___ bread. Can you buy some?”',o:['ran out of','put up with','looked after'],a:0},
{type:'mc',q:'Choose the correct sentence.',o:['Turn off it.','Turn it off.'],a:1},
{type:'fill',q:'Please ___ in your assignment by Friday. (give to the teacher)',a:['hand'],show:'hand'},
{type:'mc',q:'“Do you have a ___ of your files?” (noun) — where is the stress?',o:['a «BACK»up','a back «UP»'],a:0},
{type:'reveal',q:'Replace the formal verb with a phrasal verb: “The meeting was postponed.”',a:'The meeting was <b>put off</b>.'}
]},

{id:'g7',title:'Prepositions: at, on, in',
lede:'Three tiny words with clear patterns for time and place.',
ru:'Предлоги at / on / in для времени и места: at 3 pm, on Monday, in November; at school, on the bus, in the car.',
body:`
<h3>Time</h3>
<div class="tw"><table><tr><th>at — exact time</th><th>on — days and dates</th><th>in — longer periods</th></tr>
<tr><td>at 3 o’clock<br>at noon / midnight<br>at night<br>at lunch<br>at the moment</td>
<td>on Monday<br>on November 1st<br>on my birthday<br>on Canada Day<br>on the weekend <span class="ru">(канадский вариант)</span></td>
<td>in November<br>in 2027<br>in the winter<br>in the morning / afternoon / evening<br>in two weeks (= two weeks from now)</td></tr></table></div>
<div class="box ca"><b>Canadian note</b><p>Canadians and Americans say <b>on the weekend</b> (British: <i>at the weekend</i>). And <b>in the morning</b> but <b>at night</b> — this is just how it is!</p></div>
<h3>Place</h3>
<div class="tw"><table><tr><th>at — a point / location</th><th>on — a surface / line / transport you stand in</th><th>in — inside / an area</th></tr>
<tr><td>at school<br>at home<br>at work<br>at the bus stop<br>at Tim Hortons<br>at 104 Main Street</td>
<td>on the table<br>on the wall<br>on the bus / train / plane<br>on the second floor<br>on Main Street<br>on my phone / on the internet</td>
<td>in the car / a taxi<br>in the classroom<br>in my bag<br>in Halifax<br>in Ontario / in Canada<br>in the picture</td></tr></table></div>
<div class="box tip"><b>Transport rule</b><p>If you can <b>stand up and walk</b> inside it — <b>on</b> (on the bus, on the plane). If you can’t — <b>in</b> (in the car, in a taxi). Bikes: <b>on</b> a bike.</p></div>`,
ex:[
{type:'fill',q:'My birthday is ___ September.',a:['in'],show:'in'},
{type:'fill',q:'The test is ___ Friday.',a:['on'],show:'on'},
{type:'fill',q:'School starts ___ 8:30.',a:['at'],show:'at'},
{type:'fill',q:'I left my phone ___ the bus.',a:['on'],show:'on'},
{type:'fill',q:'We live ___ Calgary.',a:['in'],show:'in'},
{type:'fill',q:'What are you doing ___ the weekend? (Canadian)',a:['on'],show:'on'}
]}
]});

OLD.push({id:'u6',title:'Vocabulary',desc:'School in Ontario, Canadian everyday words, technology, and numbers.',ru:'Лексика: школа в Онтарио, канадские слова, IT, числа и деньги.',lessons:[

{id:'v1',title:'School in Ontario',
lede:'The words you will hear in your first week at a Canadian high school.',
ru:'Слова, которые вы услышите в первую неделю в канадской школе.',
body:`
<h3>People and places</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th><th class="ru">Русский</th></tr>
<tr><td>[[principal]] / [[vice-principal]]</td><td>head of the school / their assistant</td><td class="ru">директор / завуч</td></tr>
<tr><td>[[guidance counsellor]]</td><td>helps you choose courses and plan college</td><td class="ru">школьный консультант</td></tr>
<tr><td>[[main office]]</td><td>where you go for attendance, questions, late slips</td><td class="ru">канцелярия</td></tr>
<tr><td>[[cafeteria]] (caf)</td><td>where you eat lunch</td><td class="ru">столовая</td></tr>
<tr><td>[[gym]]</td><td>sports hall; also the class “phys. ed.”</td><td class="ru">спортзал</td></tr>
<tr><td>[[locker]]</td><td>a small metal cupboard for your things</td><td class="ru">шкафчик</td></tr>
<tr><td>[[washroom]]</td><td>toilet — Canadians say <b>washroom</b></td><td class="ru">туалет</td></tr>
<tr><td>[[hallway]] / [[the halls]]</td><td>corridor</td><td class="ru">коридор</td></tr></table></div>
<h3>The school system</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th><th class="ru">Русский</th></tr>
<tr><td>[[Grade 12]]</td><td>the last year of high school. Canadians say “Grade 12,” not “12th grade”</td><td class="ru">11-й класс (выпускной)</td></tr>
<tr><td>[[semester]]</td><td>half of the school year. In Ontario, you often take 4 courses per semester</td><td class="ru">семестр</td></tr>
<tr><td>[[period]]</td><td>one class block in the day (“I have math first period”)</td><td class="ru">урок (по расписанию)</td></tr>
<tr><td>[[spare]]</td><td>a free period with no class</td><td class="ru">«окно»</td></tr>
<tr><td>[[credit]]</td><td>you earn one credit for each course you pass</td><td class="ru">зачётная единица</td></tr>
<tr><td>[[OSSD]]</td><td>Ontario Secondary School Diploma — needs 30 credits and other requirements</td><td class="ru">аттестат</td></tr>
<tr><td>[[report card]]</td><td>your marks, sent home</td><td class="ru">табель</td></tr>
<tr><td>[[marks]]</td><td>grades, scores (Canadians say “What mark did you get?”)</td><td class="ru">оценки</td></tr>
<tr><td>[[assignment]]</td><td>a piece of work to do</td><td class="ru">задание</td></tr>
<tr><td>[[due date]]</td><td>the last day to hand it in</td><td class="ru">срок сдачи</td></tr>
<tr><td>[[quiz]] / [[test]] / [[exam]]</td><td>small / medium / big (end of semester)</td><td class="ru">тест / контрольная / экзамен</td></tr>
<tr><td>[[extension]]</td><td>extra time for an assignment</td><td class="ru">продление срока</td></tr></table></div>
<div class="box ca"><b>Marks in Ontario</b><p>Ontario uses <b>percentages</b>: 80–100% is level 4 (excellent), 70–79% level 3, 60–69% level 2, 50–59% level 1. Below 50% you do not get the credit. Teachers often say “you got an 85” — meaning 85%.</p></div>
<h3>Useful classroom phrases</h3>
<ul class="lines"><li>[[Sorry, could you repeat that?]]</li>
<li>[[What page are we on?]]</li>
<li>[[When is this due?]]</li>
<li>[[Is this going to be on the test?]]</li>
<li>[[Could I get an extension?]]</li>
<li>[[Can I go to the washroom?]]</li>
<li>[[I don’t understand the question. Could you explain it another way?]]</li>
<li>[[How do you spell that?]]</li></ul>
<div class="box tip"><b>Teachers’ names</b><p>Call teachers <b>Mr. / Ms. / Mrs. + family name</b>: “Ms. Campbell,” “Mr. Singh.” Not “teacher” and not their first name. <i>Ms.</i> sounds like “miz.”</p></div>`,
ex:[
{type:'mc',q:'You need help choosing courses for college. Who do you talk to?',o:['the principal','the guidance counsellor','the cafeteria'],a:1},
{type:'mc',q:'“I have a spare third period.” What does it mean?',o:['I have an extra test.','I have no class in third period.','I have gym.'],a:1},
{type:'mc',q:'How do Canadians usually ask for the toilet at school?',o:['Where is the WC?','Can I go to the washroom?','Where is the bathroom-room?'],a:1},
{type:'fill',q:'You need more time for an assignment. Ask: “Could I get an ___?”',a:['extension'],show:'extension'},
{type:'say',q:'Say each classroom phrase out loud, politely.',lines:['Sorry, could you repeat that?','When is this due?','How do you spell that?','Could I get an extension?']}
]},

{id:'v2',title:'Canadian Everyday Words',
lede:'Words you will not find in a British or American textbook.',
ru:'Канадские слова, которых нет в британских или американских учебниках.',
body:`
<div class="tw"><table><tr><th>Word</th><th>Meaning</th><th class="ru">Русский</th></tr>
<tr><td>[[toque]] (“tyook”)</td><td>a warm knitted winter hat</td><td class="ru">вязаная шапка</td></tr>
<tr><td>[[loonie]] / [[toonie]]</td><td>$1 coin (a loon bird on it) / $2 coin</td><td class="ru">монета 1$ / 2$</td></tr>
<tr><td>[[double-double]]</td><td>a coffee with two creams and two sugars</td><td class="ru">кофе: 2 сливок, 2 сахара</td></tr>
<tr><td>[[Timmies]] / [[Tim’s]]</td><td>Tim Hortons, the coffee and donut shop</td><td class="ru">кафе Tim Hortons</td></tr>
<tr><td>[[Timbits]]</td><td>small round donut balls from Tim Hortons</td><td class="ru">мини-пончики</td></tr>
<tr><td>[[poutine]] (“poo-TEEN”)</td><td>fries with cheese curds and gravy</td><td class="ru">картошка фри с сыром и соусом</td></tr>
<tr><td>[[hydro]]</td><td>electricity (the “hydro bill”)</td><td class="ru">электричество</td></tr>
<tr><td>[[pop]]</td><td>a soft drink, soda</td><td class="ru">газировка</td></tr>
<tr><td>[[cottage]] / [[camp]]</td><td>a summer house by a lake. In the Ottawa Valley many people say “camp”</td><td class="ru">дача у озера</td></tr>
<tr><td>[[chesterfield]]</td><td>(old-fashioned) a sofa / couch</td><td class="ru">диван</td></tr>
<tr><td>[[keener]]</td><td>a student who is very eager, always answers</td><td class="ru">«ботаник», старательный</td></tr>
<tr><td>[[runners]]</td><td>running shoes, sneakers</td><td class="ru">кроссовки</td></tr>
<tr><td>[[snowbank]]</td><td>a big pile of snow beside the road</td><td class="ru">сугроб</td></tr>
<tr><td>[[parka]]</td><td>a long, very warm winter coat</td><td class="ru">пуховик, парка</td></tr>
<tr><td>[[a two-four]]</td><td>a case of 24 beers (you will hear it — May 24 long weekend is “May Two-Four”)</td><td class="ru">ящик из 24 банок</td></tr>
<tr><td>[[Canadian Tire]]</td><td>a store for tools, car parts, sports, home things</td><td class="ru">магазин хозтоваров</td></tr>
<tr><td>[[a buck]] / [[five bucks]]</td><td>a dollar / five dollars</td><td class="ru">доллар</td></tr></table></div>
<p>More Canadian words: see the next lesson, <b>What Makes Canadian English Canadian</b>, and the <a href="#/glossary">Canadian English glossary</a>.</p>
<h3>Money and shopping</h3>
<ul><li>Prices on tags usually <b>do not include tax</b>. Sales tax is added at the cash register, and it depends on the province — from 5% (GST only, in Alberta and the territories) to about 15%. In Ontario the <b>HST</b> is 13%, so a $10 shirt costs $11.30.</li>
<li>In restaurants, people leave a <b>tip</b> of about 15–20%. Not at Tim Hortons or fast food counters.</li>
<li>Cashiers ask: [[Do you need a bag?]] (bags cost extra) and [[Debit or credit?]]</li>
<li>To pay with a card, you <b>tap</b> it: [[Can I just tap?]]</li></ul>
<h3>Measurement</h3>
<p>Canada officially uses <b>metric</b>: kilometres, litres, Celsius. But people often use <b>feet and pounds</b> for a person’s height and weight (“He’s six feet tall”), and some use Fahrenheit for ovens and pools.</p>
<div class="box ca"><b>Canadian spelling</b><p>Canada uses a mix: British <b>colour, favourite, centre, theatre, cheque, travelled</b> — but American <b>-ize</b> (organize, realize) and <b>tire, curb</b>. Your school will expect Canadian spelling.</p></div>`,
ex:[
{type:'mc',q:'It is −20°C. What do you put on your head?',o:['a toque','a loonie','a double-double'],a:0},
{type:'mc',q:'Your friend says, “Can you lend me a toonie?” How much do they want?',o:['$1','$2','$20'],a:1},
{type:'mc',q:'A sweater costs $20 on the tag. About how much will you pay in Ontario?',o:['$20.00','$22.60','$30.00'],a:1,why:'$20 + 13% HST ($2.60) = $22.60.'},
{type:'mc',q:'“Our hydro bill is high this month.” Hydro means…',o:['water','electricity','internet'],a:1}
]},

{id:'v3',title:'Small Talk & Greetings',
lede:'Short, friendly conversations — and why “How are you?” is not really a question.',
ru:'Small talk — короткий дружеский разговор. «How are you?» — это приветствие, а не настоящий вопрос.',
body:`
<h3>Greetings are not real questions</h3>
<p>In Canada, “How are you?” is mostly a <b>greeting</b>, like “hello.” The expected answer is short and positive, and then you ask back:</p>
<div class="tw"><table><tr><th>They say</th><th>You answer</th></tr>
<tr><td>[[Hey, how’s it going?]]</td><td>[[Good, you?]] / [[Not bad, how about you?]]</td></tr>
<tr><td>[[How are you?]]</td><td>[[I’m good, thanks. How are you?]]</td></tr>
<tr><td>[[What’s up?]]</td><td>[[Not much. You?]] (Not: “the sky”!)</td></tr>
<tr><td>[[How was your weekend?]]</td><td>[[Good! I went to Ottawa. How was yours?]]</td></tr></table></div>
<div class="box tip"><b>Culture difference</b><p>In many cultures, “How are you?” is a real question, and people may answer honestly with details. In Canada, a long answer about problems to a cashier or a coworker you just met will surprise them. Save real answers for friends and family.</p></div>
<h3>Safe small talk topics</h3>
<ul><li><b>Weather</b> — the national topic: [[Cold out today, eh?]] [[Did you see all that snow?]]</li>
<li><b>Weekend plans</b>: [[Got any plans for the weekend?]]</li>
<li><b>School</b>: [[What do you have next?]] [[How was the test?]]</li>
<li><b>Sports</b> (hockey!): [[Did you watch the game last night?]]</li>
<li><b>Food, shows, games</b>: [[Have you seen…?]] [[What are you playing these days?]]</li></ul>
<p>Topics to avoid with people you just met: money and salaries, religion, politics, weight and appearance, and age (with adults).</p>
<h3>Introducing yourself</h3>
<ul class="lines"><li>[[Hi, I’m Ana. I’m new here.]]</li>
<li>[[I just moved here from Colombia.]]</li>
<li>[[I’m living with my cousin for now.]]</li>
<li>[[Nice to meet you!]] — answer: [[Nice to meet you too.]]</li></ul>
<h3>Ending a conversation</h3>
<p>Canadians often use a reason to end politely: [[Well, I gotta get to class.]] [[Anyway, I’ll let you go.]] [[Talk to you later!]] [[See you around!]]</p>
<div class="box tip"><b>“See you later” is not a plan</b><p>“See you later” and “We should hang out sometime” are often just friendly goodbyes — not real plans. If you want a real plan, ask for a time: [[Are you free Saturday?]]</p></div>`,
ex:[
{type:'mc',q:'A cashier says, “Hi, how are you today?” Best answer?',o:['Not good. I slept badly and my back hurts.','Good, thanks! How are you?','Why do you ask?'],a:1},
{type:'mc',q:'A classmate says, “What’s up?” Best answer?',o:['The ceiling.','Not much. You?','I am up.'],a:1},
{type:'mc',q:'Which topic is safest with someone you just met?',o:['How much money their parents make','The weather','Their religion'],a:1},
{type:'say',q:'Practise a full small talk exchange.',lines:['Hey, how’s it going?','Good, you?','Pretty good. Cold out today, eh?','Yeah, it’s freezing! Anyway, I gotta get to class.','See you later!']}
]},

{id:'v4',title:'Technology & IT Vocabulary',
lede:'Words for computers, the internet — and how to say symbols out loud.',
ru:'Компьютерная лексика и как произносить символы — важно для будущей учёбы в IT.',
body:`
<h3>Core words</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning / example</th><th class="ru">Русский</th></tr>
<tr><td>[[hardware]] / [[software]]</td><td>physical parts / programs</td><td class="ru">железо / софт</td></tr>
<tr><td>[[operating system]] (OS)</td><td>Windows, macOS, Linux</td><td class="ru">операционная система</td></tr>
<tr><td>[[download]] / [[upload]]</td><td>get from / send to the internet</td><td class="ru">скачать / загрузить</td></tr>
<tr><td>[[install]] / [[uninstall]]</td><td>put a program on / take it off</td><td class="ru">установить / удалить</td></tr>
<tr><td>[[update]]</td><td>(verb up-«DATE», noun «UP»-date)</td><td class="ru">обновление</td></tr>
<tr><td>[[file]] / [[folder]] / [[drive]]</td><td>document / container / storage</td><td class="ru">файл / папка / диск</td></tr>
<tr><td>[[router]] (“ROW-ter” in Canada)</td><td>sends the internet around the house</td><td class="ru">роутер</td></tr>
<tr><td>[[Wi-Fi]] (“WHY-fye”)</td><td>wireless internet</td><td class="ru">вай-фай</td></tr>
<tr><td>[[password]] / [[username]]</td><td>secret word / your account name</td><td class="ru">пароль / логин</td></tr>
<tr><td>[[bug]] / [[debug]]</td><td>a mistake in code / find and fix it</td><td class="ru">баг / отладка</td></tr>
<tr><td>[[crash]] / [[freeze]]</td><td>stops suddenly / stops responding</td><td class="ru">вылет / зависание</td></tr>
<tr><td>[[restart]] / [[reboot]]</td><td>turn off and on again</td><td class="ru">перезагрузка</td></tr>
<tr><td>[[server]] / [[the cloud]]</td><td>a computer that provides services / online storage</td><td class="ru">сервер / облако</td></tr>
<tr><td>[[screenshot]]</td><td>a picture of the screen</td><td class="ru">скриншот</td></tr>
<tr><td>[[charger]]</td><td>cable to charge a phone or laptop</td><td class="ru">зарядка</td></tr></table></div>
<h3>Saying symbols out loud</h3>
<div class="tw"><table><tr><th>Symbol</th><th>Say</th><th>Symbol</th><th>Say</th></tr>
<tr><td><code>@</code></td><td>[[at]]</td><td><code>.</code></td><td>[[dot]] (in addresses) / [[period]]</td></tr>
<tr><td><code>/</code></td><td>[[slash]] (forward slash)</td><td><code>\\</code></td><td>[[backslash]]</td></tr>
<tr><td><code>_</code></td><td>[[underscore]]</td><td><code>-</code></td><td>[[dash]] / [[hyphen]]</td></tr>
<tr><td><code>#</code></td><td>[[hash]] / [[pound sign]] / [[hashtag]]</td><td><code>*</code></td><td>[[asterisk]] (“AS-ter-isk”) / [[star]]</td></tr>
<tr><td><code>&amp;</code></td><td>[[ampersand]] / [[and]]</td><td><code>~</code></td><td>[[tilde]] (“TIL-duh”)</td></tr>
<tr><td><code>( )</code></td><td>[[brackets]] / [[parentheses]]</td><td><code>[ ]</code></td><td>[[square brackets]]</td></tr>
<tr><td><code>{ }</code></td><td>[[curly braces]] / [[curly brackets]]</td><td><code>" "</code></td><td>[[quotation marks]] / [[quotes]]</td></tr>
<tr><td><code>!</code></td><td>[[exclamation mark]]</td><td><code>?</code></td><td>[[question mark]]</td></tr></table></div>
<h3>Reading addresses</h3>
<ul><li>Email <code>gleb_k07@gmail.com</code> → [[gleb underscore k zero seven at gmail dot com]]</li>
<li>Website <code>www.algonquincollege.com/pembroke</code> → [[algonquin college dot com slash pembroke]] (people usually skip “www”)</li>
<li>IP address <code>192.168.1.1</code> → [[one ninety-two dot one sixty-eight dot one dot one]]</li></ul>
<div class="box tip"><b>Spelling things out</b><p>When you spell a username, letters like <b>B / D / P / T / V</b> and <b>M / N</b> are easy to confuse on the phone. Say: [[B as in Bravo, D as in Delta]]. Learning the NATO alphabet (Alpha, Bravo, Charlie…) is very useful — it’s used every day in the military, police, aviation and customer service.</p></div>`,
ex:[
{type:'mc',q:'How do you say <code>_</code>?',o:['dash','underscore','slash'],a:1},
{type:'mc',q:'How do you say <code>{ }</code>?',o:['curly braces','square brackets','round brackets'],a:0},
{type:'mc',q:'Your computer stopped responding and you can’t click anything. It…',o:['crashed','froze','downloaded'],a:1,why:'Frozen = stops responding. Crashed = suddenly closed or shut down.'},
{type:'reveal',q:'Read this out loud, then check: <code>sam.lee@rcdsb.on.ca</code>',a:'“sam dot lee at r c d s b dot o n dot c a”'},
{type:'fill',q:'Before you upgrade the system, ___ up your files! (save a copy)',a:['back'],show:'back'}
]},

{id:'v5',title:'Numbers, Time, Dates & Money',
lede:'Numbers are hard to hear in a new language. Practise them a lot.',
ru:'Числа, время, даты и деньги на слух. Особое внимание — thirteen / thirty.',
body:`
<h3>Teen vs ty — listen to the stress</h3>
<div class="tw"><table><tr><th>-teen: stress at the END</th><th>-ty: stress at the START</th></tr>
<tr><td>[[thir«TEEN»|thirteen]] 13</td><td>[[«THIR»ty|thirty]] 30</td></tr>
<tr><td>[[four«TEEN»|fourteen]] 14</td><td>[[«FOR»ty|forty]] 40</td></tr>
<tr><td>[[fif«TEEN»|fifteen]] 15</td><td>[[«FIF»ty|fifty]] 50</td></tr>
<tr><td>[[six«TEEN»|sixteen]] 16</td><td>[[«SIX»ty|sixty]] 60</td></tr></table></div>
<p>Also: the T in <i>-teen</i> is clear, but in <i>-ty</i> it is a flap (“thirdy,” “fordy”). Note the spelling: <b>forty</b> (no u).</p>
<h3>Time</h3>
<div class="tw"><table><tr><th>Time</th><th>Common way</th><th>Other way</th></tr>
<tr><td>7:00</td><td>[[seven o’clock]]</td><td>[[seven]]</td></tr>
<tr><td>7:15</td><td>[[seven fifteen]]</td><td>[[quarter after seven]] (Canada)</td></tr>
<tr><td>7:30</td><td>[[seven thirty]]</td><td>[[half past seven]]</td></tr>
<tr><td>7:45</td><td>[[seven forty-five]]</td><td>[[quarter to eight]]</td></tr>
<tr><td>7:05</td><td>[[seven oh five]]</td><td>[[five after seven]]</td></tr></table></div>
<p>Canadians use the <b>12-hour clock</b> in speech, with <b>a.m.</b> (morning) and <b>p.m.</b> (afternoon/evening). “The 24-hour clock” is used mostly in the military and transport — you may hear “fourteen hundred” for 2 p.m.</p>
<h3>Dates</h3>
<p>Write <i>November 1</i>, say [[November first]] or [[the first of November]]. Years: [[2027|twenty twenty-seven]], [[1998|nineteen ninety-eight]], [[2005|two thousand five]].</p>
<div class="box ca"><b>Date format trap</b><p>In Canada, <code>03/04/2027</code> can mean March 4 (American style) <b>or</b> 3 April (British style). Many official forms use <code>2027-04-03</code> (year-month-day). When in doubt, write the month as a word.</p></div>
<h3>Money</h3>
<ul><li>$4.99 → [[four ninety-nine]] (or “four dollars and ninety-nine cents”)</li>
<li>$20 → [[twenty bucks]] (casual)</li>
<li>$1,250 → [[twelve hundred and fifty dollars]] or [[one thousand two hundred fifty dollars]]</li>
<li>¢ cents: 25¢ = a [[quarter]], 10¢ = a [[dime]], 5¢ = a [[nickel]]. (Canada has no 1¢ penny anymore — cash prices round to 5¢.)</li></ul>
<h3>Phone numbers</h3>
<p>Say each digit, in groups: 613-555-0142 → [[six one three, five five five, oh one four two]]. Zero is usually “oh.”</p>
<p>Go to the <b>Practice lab</b> for number listening drills.</p>`,
ex:[
{type:'mc',q:'Listen: [[fif«TEEN»|fifteen]]',o:['15','50'],a:0},
{type:'mc',q:'Listen: [[«FOR»ty|forty]]',o:['14','40'],a:1},
{type:'mc',q:'“Quarter to nine” is…',o:['8:45','9:15','9:45'],a:0},
{type:'fill',q:'How do you say 2:30 in two words? “two ___”',a:['thirty'],show:'two thirty'},
{type:'mc',q:'“It’s twenty bucks.” How much?',o:['$2','$20','$200'],a:1}
]},

{id:'v6',title:'Everyday Slang & Expressions',
lede:'Casual expressions that people use every day in Canada.',
ru:'Разговорные выражения и сленг, которые используют подростки и взрослые в Канаде.',
body:`
<div class="box tip"><b>A warning about slang</b><p>Slang changes very fast. These expressions are common and safe. New slang appears every year — learn it from the people around you, not from a book! If you’re not sure what a word means, it is fine to ask: [[Wait, what does that mean?]]</p></div>
<div class="tw"><table><tr><th>Expression</th><th>Meaning</th><th>Example</th></tr>
<tr><td>for sure</td><td>yes, definitely</td><td>[[“Wanna come?” “For sure!”]]</td></tr>
<tr><td>I’m down</td><td>I want to do it, I agree</td><td>[[Pizza tonight? I’m down.]]</td></tr>
<tr><td>no worries / no problem</td><td>you’re welcome; it’s okay</td><td>[[“Thanks!” “No worries.”]]</td></tr>
<tr><td>my bad</td><td>my mistake, sorry</td><td>[[Oh, my bad, that’s your seat.]]</td></tr>
<tr><td>no big deal</td><td>not important</td><td>[[I forgot my lunch, but it’s no big deal.]]</td></tr>
<tr><td>that sucks</td><td>that’s bad (casual, not for teachers)</td><td>[[You failed? That sucks.]]</td></tr>
<tr><td>it’s up to you</td><td>you decide</td><td>[[Movie or game? It’s up to you.]]</td></tr>
<tr><td>I’m good</td><td>(1) I’m fine; (2) <b>no thanks</b></td><td>[[“Want some chips?” “I’m good, thanks.”]]</td></tr>
<tr><td>hang on / hold on</td><td>wait a moment</td><td>[[Hang on, I’ll be right there.]]</td></tr>
<tr><td>sketchy</td><td>suspicious, not safe</td><td>[[That website looks sketchy.]]</td></tr>
<tr><td>legit</td><td>real, honest; really</td><td>[[Is that legit? I legit forgot.]]</td></tr>
<tr><td>chill</td><td>relaxed (adj); relax (verb)</td><td>[[He’s pretty chill. Just chill.]]</td></tr>
<tr><td>piece of cake</td><td>very easy</td><td>[[The quiz was a piece of cake.]]</td></tr>
<tr><td>I’m beat / I’m wiped</td><td>very tired</td><td>[[After practice I’m beat.]]</td></tr>
<tr><td>a ton of</td><td>a lot of</td><td>[[I have a ton of homework.]]</td></tr></table></div>
<div class="box rule"><b>“I’m good” = No, thanks</b><p>This one confuses many newcomers. When someone offers you something and you say “I’m good,” it means <b>no thank you</b>. If you want it, say “Sure, thanks!” or “Yes, please!”</p></div>
<h3>Swearing</h3>
<p>You will hear swear words at school. Learn to <b>recognize</b> them, but be careful using them: the rules about who, when and where are complicated even for native speakers. Swearing in front of teachers, parents or employers is a big mistake.</p>`,
ex:[
{type:'mc',q:'Your friend offers you a drink and you don’t want it. You say…',o:['I’m good, thanks.','I’m down.','For sure.'],a:0},
{type:'mc',q:'“We’re going for pizza after school. You in?” — you want to go. Answer:',o:['I’m good.','I’m down!','My bad.'],a:1},
{type:'mc',q:'You accidentally take someone’s seat. You say…',o:['No worries.','My bad!','That sucks.'],a:1},
{type:'mc',q:'“That link looks sketchy.” It means the link looks…',o:['interesting','unsafe','broken'],a:1}
]}
]});

/* ---------- UNIT 07: CONVERSATION SKILLS ---------- */
OLD.push({id:'u7',title:'Conversation Skills',desc:'Asking for help, keeping a conversation going, disagreeing politely, and real-life situations.',ru:'Как переспросить, поддержать разговор, вежливо не согласиться, и типичные жизненные ситуации.',lessons:[

{id:'c1',title:'When You Don’t Understand',
lede:'The most important skill for a language learner: asking for help without stress.',
ru:'Самый важный навык: спокойно переспросить, попросить объяснить или говорить медленнее.',
body:`
<p>Everyone learning a language misses things. Native speakers do too! The difference between a confident speaker and a nervous one is <b>knowing what to say</b> when you don’t understand.</p>
<h3>Ask them to repeat</h3>
<ul class="lines"><li>[[Sorry? ↗|Sorry?]] — the quickest, very Canadian</li><li>[[Sorry, could you say that again?]]</li><li>[[Sorry, I didn’t catch that.]]</li><li>[[Could you speak a little slower, please?]]</li></ul>
<h3>Ask about a word</h3>
<ul class="lines"><li>[[What does “sketchy” mean?]]</li><li>[[How do you say this in English?]]</li><li>[[How do you spell that?]]</li><li>[[What’s the word for… the thing you use to…]]</li></ul>
<h3>Check that you understood</h3>
<ul class="lines"><li>[[So you mean…?]]</li><li>[[Do you mean the test on Friday?]]</li><li>[[Just to make sure — the bus leaves at seven?]]</li></ul>
<h3>Tell people you’re learning</h3>
<p>[[I’m still learning English, so sometimes I need a bit more time.]] — People in Canada are usually very patient when you say this. Many Canadians are immigrants or children of immigrants.</p>
<div class="box tip"><b>Don’t nod and smile</b><p>Many learners pretend to understand to avoid embarrassment. This causes bigger problems later — a missed bus, a missed assignment. Asking is <b>normal and respected</b> in Canadian schools. Teachers want you to ask.</p></div>
<h3>When you can’t find a word: describe it</h3>
<p>Don’t stop talking. Describe the thing instead:</p>
<ul><li>[[It’s a kind of…]] / [[It’s like a…]]</li><li>[[It’s the thing you use for…]]</li><li>[[It’s the opposite of…]]</li><li>[[I forgot the word, but it’s…]]</li></ul>
<p>Example: You forgot “stapler” → [[It’s the thing you use to put papers together, with little metal pieces.]]</p>`,
ex:[
{type:'mc',q:'The teacher spoke very fast and you missed the instructions. Best response?',o:['Nod and copy your neighbour.','Sorry, could you repeat the instructions?','What?!'],a:1},
{type:'mc',q:'You forgot the word “ladder.” What do you say?',o:['Stop and say nothing.','It’s the thing you climb to reach high places.','Switch to your own language.'],a:1},
{type:'say',q:'Practise saying these until they are automatic.',lines:['Sorry, I didn’t catch that.','Could you speak a little slower, please?','What does that mean?','How do you spell that?','I’m still learning English.']}
]},

{id:'c2',title:'Keeping the Conversation Going',
lede:'Fillers, reactions and follow-up questions make you sound natural and interested.',
ru:'Слова-заполнители, реакции и встречные вопросы помогают поддерживать разговор и показывают интерес.',
body:`
<h3>Fillers — buying time to think</h3>
<p>Silence feels uncomfortable in English conversation. Instead of stopping, use a filler:</p>
<p>[[Um…]] &nbsp; [[Uh…]] &nbsp; [[Well…]] &nbsp; [[So…]] &nbsp; [[Let me think…]] &nbsp; [[That’s a good question.]] &nbsp; [[How do I say this…]]</p>
<div class="box tip"><b>Use English fillers</b><p>Every language has its own fillers — <i>eh, este, pues, ano, yaani, 嗯, 那个, euh, ну</i>. English listeners notice them right away. Train yourself to say <b>um</b>, <b>so</b> and <b>well</b> instead.</p></div>
<h3>Reactions — showing you’re listening</h3>
<div class="tw"><table><tr><th>When you hear…</th><th>React with…</th></tr>
<tr><td>good news</td><td>[[That’s awesome!]] [[No way! Congrats!]] [[Nice!]]</td></tr>
<tr><td>bad news</td><td>[[Oh no.]] [[That sucks.]] [[I’m sorry to hear that.]]</td></tr>
<tr><td>surprising news</td><td>[[Really?]] [[Seriously?]] [[No way!]]</td></tr>
<tr><td>something interesting</td><td>[[Oh, cool.]] [[Huh, interesting.]]</td></tr>
<tr><td>an opinion you agree with</td><td>[[Totally.]] [[Yeah, for sure.]] [[Exactly.]]</td></tr>
<tr><td>an explanation</td><td>[[Oh, okay.]] [[That makes sense.]] [[Gotcha.]]</td></tr></table></div>
<h3>Follow-up questions</h3>
<p>The best way to keep a conversation going is to <b>ask about the other person</b>:</p>
<p>“I went to the lake on the weekend.” →<br>[[Oh nice! Which lake?]] &nbsp; [[Did you go swimming?]] &nbsp; [[Who did you go with?]] &nbsp; [[Do you go there a lot?]]</p>
<h3>Give more than “yes” or “no”</h3>
<p>Short answers can end a conversation. Add <b>one extra detail</b>:</p>
<p>“Do you like it here?” — <span class="wrong">Yes.</span> → <span class="right">[[Yeah, I like it! It’s really quiet, and the river is beautiful.]]</span></p>
<p>“Do you play hockey?” — <span class="wrong">No.</span> → <span class="right">[[Not yet, but I want to learn. I can skate a bit.]]</span></p>`,
ex:[
{type:'mc',q:'A friend says, “I got 95 on the math test!” Best reaction?',o:['Okay.','No way! That’s awesome!','I’m sorry to hear that.'],a:1},
{type:'mc',q:'“My dog is sick.” Best reaction?',o:['Cool.','Oh no, I’m sorry to hear that.','Gotcha.'],a:1},
{type:'reveal',q:'Someone asks: “Do you have any brothers or sisters?” Give an answer with an extra detail and a follow-up question.',a:'Example: “No, I’m an only child, but I have lots of cousins. What about you?”'},
{type:'reveal',q:'Your classmate says: “I just got a new phone.” Write two follow-up questions.',a:'Examples: “Oh nice! Which one did you get?” / “Do you like it?” / “Was it expensive?”'}
]},

{id:'c3',title:'Opinions, Agreeing & Disagreeing',
lede:'How to say what you think — and how to disagree without sounding rude.',
ru:'Как высказать мнение и вежливо не согласиться. Канадцы смягчают несогласие.',
body:`
<h3>Giving your opinion</h3>
<p>[[I think…]] &nbsp; [[In my opinion…]] &nbsp; [[I feel like…]] &nbsp; [[For me…]] &nbsp; [[Personally, I’d say…]]</p>
<h3>Agreeing</h3>
<p>[[Yeah, totally.]] &nbsp; [[I agree.]] &nbsp; [[That’s true.]] &nbsp; [[Exactly!]] &nbsp; [[Me too.]] / [[Me neither.]] (to agree with a negative)</p>
<div class="box tip"><b>Me too / Me neither</b><p>“I love pizza.” → <b>Me too.</b><br>“I don’t like mornings.” → <b>Me neither.</b> (not “me too”)</p></div>
<h3>Disagreeing politely</h3>
<p>Canadians usually <b>soften</b> disagreement. A direct “No, you’re wrong” sounds aggressive:</p>
<div class="tw"><table><tr><th>Too direct</th><th>Natural Canadian</th></tr>
<tr><td><span class="wrong">No. That’s wrong.</span></td><td>[[Hmm, I’m not sure about that.]]</td></tr>
<tr><td><span class="wrong">You are wrong.</span></td><td>[[I see what you mean, but…]]</td></tr>
<tr><td><span class="wrong">This is a bad idea.</span></td><td>[[Maybe… but what if we tried…?]]</td></tr>
<tr><td><span class="wrong">I don’t agree.</span></td><td>[[I kind of see it differently.]]</td></tr></table></div>
<div class="box tip"><b>Directness</b><p>In many cultures, direct communication is normal and a sign of honesty. In Canada, the same directness can sound rude or angry — even when you don’t mean it that way. Adding a softener (“I think,” “maybe,” “kind of,” “I’m not sure”) costs nothing and helps a lot.</p></div>
<h3>Saying no politely</h3>
<p>“Wanna come to the party?” — [[Ah, thanks, but I can’t this time. Maybe next time!]]<br>“Can you help me move on Saturday?” — [[I’d like to, but I already have plans. Sorry!]]</p>`,
ex:[
{type:'mc',q:'“I don’t like horror movies.” You also don’t like them. You say…',o:['Me too.','Me neither.','Me also not.'],a:1},
{type:'mc',q:'Most natural way to disagree with a coworker in a meeting:',o:['That is wrong.','I see what you mean, but maybe we could try another way?','No.'],a:1},
{type:'say',q:'Soft, friendly disagreement.',lines:['Hmm, I’m not sure about that.','I see what you mean, but…','Thanks, but I can’t this time. Maybe next time!']}
]},

{id:'c4',title:'Real-Life Situations',
lede:'Short scripts for common places: ordering food, shopping, the phone, and the doctor.',
ru:'Готовые фразы для типичных ситуаций: кафе, магазин, телефонный звонок, врач.',
body:`
<h3>Ordering at Tim Hortons</h3>
<ul class="lines"><li>Staff: [[Hi there, what can I get for you?]]</li>
<li>You: [[Hi, can I get a medium hot chocolate and a bagel, please?]]</li>
<li>Staff: [[Toasted with butter?]]</li>
<li>You: [[Yes, please.]]</li>
<li>Staff: [[For here or to go?]]</li>
<li>You: [[To go, please.]]</li>
<li>Staff: [[That’ll be six fifty-four.]]</li>
<li>You: [[Can I just tap?]] … [[Thanks, have a good one!]]</li></ul>
<div class="box tip"><b>“Can I get…”</b><p>Canadians order with <b>Can I get…</b> or <b>Could I have…</b>, not “I want” or “Give me.” “For here or to go?” means: eat in the restaurant or take it away?</p></div>
<h3>In a store</h3>
<ul class="lines"><li>[[Excuse me, where can I find phone chargers?]]</li>
<li>[[Do you have this in a bigger size?]]</li>
<li>[[Can I try this on?]] — [[The fitting rooms are at the back.]]</li>
<li>Staff: [[Can I help you find anything?]] — You: [[I’m just looking, thanks.]]</li>
<li>[[Can I return this? I have the receipt.]]</li></ul>
<h3>On the phone</h3>
<ul class="lines"><li>[[Hi, this is Ana Silva. I’m calling about…]]</li>
<li>[[Could I speak to Ms. Campbell, please?]]</li>
<li>[[Could you spell that for me?]]</li>
<li>[[Sorry, you’re breaking up.]] (bad signal)</li>
<li>Voicemail: [[Hi, it’s Ana. Could you call me back at six one three… Thanks, bye!]]</li></ul>
<p>Phone calls are harder than face-to-face because you can’t see lips or gestures. It’s okay to ask people to repeat, and to say “Let me write that down.”</p>
<h3>At the doctor or walk-in clinic</h3>
<ul class="lines"><li>[[I have an appointment at two thirty.]]</li>
<li>Receptionist: [[Can I see your health card?]]</li>
<li>[[I’ve had a sore throat for three days.]]</li>
<li>[[It hurts here.]] / [[I feel dizzy.]] / [[I have a fever.]]</li>
<li>[[Do I need to take this with food?]]</li></ul>
<div class="box ca"><b>Health card</b><p>Each province and territory has its own public health insurance and its own <b>health card</b> (in Ontario it’s called OHIP). Some newcomers must wait before provincial coverage starts, or use private insurance first. A settlement worker can tell you what applies to you.</p></div>`,
ex:[
{type:'mc',q:'“For here or to go?” — you want to take your food home. You say…',o:['For here, please.','To go, please.','Go.'],a:1},
{type:'mc',q:'A store employee asks, “Can I help you find anything?” You are only browsing. You say…',o:['No.','I’m just looking, thanks.','Go away, please.'],a:1},
{type:'mc',q:'On the phone, the sound keeps cutting out. You say…',o:['You’re breaking up.','You’re breaking down.','You’re broken.'],a:0},
{type:'say',q:'Practise the Tim Hortons order.',lines:['Hi, can I get a medium hot chocolate, please?','To go, please.','Can I just tap?','Thanks, have a good one!']}
]}
]});

const L1_RU_OLD={
"s2": "<p>In Russian schools, students often learn English by reading and translating. That builds good grammar and vocabulary — you already have that. What is usually missing is <b>listening to real speech</b> and <b>speaking out loud a lot</b>. Focus your time there.</p>",
"r1": "<p>Russian also has free word stress, and it changes meaning: <i>му́ка</i> (torment) vs <i>мука́</i> (flour), <i>за́мок</i> vs <i>замо́к</i>. You already know the feeling. The difficulty is that you must <b>learn</b> the stress of each English word, just like in Russian.</p>",
"r2": "<p>Russian speakers often give every word the same weight: “I — WANT — TO — GO — TO — THE — STORE.” It sounds very careful and slow. Practise making the small words almost disappear.</p>",
"r3": "<p>In Russian, unstressed <i>о</i> is not pronounced as “o”: <i>молоко</i> sounds like [mə-la-KO], and <i>хорошо</i> like [khə-ra-SHO]. English does the same thing, just more often. Do not pronounce every vowel the way it is spelled.</p>",
"r4": "<p>Russian rhythm also reduces unstressed syllables, but English does it more strongly and more regularly. A common result is speech that sounds “staccato” — each word separate. Practise with a beat: clap, tap your foot, or use music.</p>",
"r5": "<p>Russian often shows focus by changing <b>word order</b>. English mostly keeps the word order and uses <b>voice stress</b> instead. If you do not use focus stress, people may miss your point — or think you are not interested.</p>",
"k3": "<p>Russian speakers often put a small stop (a glottal catch) before words that start with a vowel: “pick | it | up.” This makes speech sound choppy. Try to <b>slide</b> the last consonant into the next word. Practise slowly first: “pi... ki... tup.”</p>",
"k4": "<p>The flap T is almost the same as the Russian <b>р</b> tapped once, very quickly! Say <i>вода</i> fast, then try “wa-<b>t</b>er” with a single quick tap. But do not roll it.</p>",
"i1": "<p>Wh-questions are easy: Russian <i>Где ты живёшь?</i> also falls. The challenge is that English falls are often <b>bigger</b> — the voice starts higher before it drops. A small, flat fall can sound bored or tired to English listeners.</p>",
"i2": "<p>A Russian yes/no question has a sharp <b>rise-and-fall on the key word</b>: <i>Ты лю́бишь хоккей?</i> If you use that pattern in English, it can sound surprised, suspicious or annoyed — “<b>DO</b> you like hockey?!” In English, keep the voice going <b>up at the end</b> and stay up.</p>",
"i4": "<p>Neutral Russian intonation is flatter than English. Russians are sometimes described as “serious” or “cold” by Canadians — not because of what they say, but because of <b>how the voice moves</b>. This is not about personality; it is just a different melody. Try to use a bigger, warmer voice movement than feels natural at first.</p>",
"p1": "<p>Russian speakers often replace TH with <b>s / z</b> (“I sink so” for <i>I think so</i>), or with <b>t / d</b> (“tree” for <i>three</i>), or <b>f / v</b>. Each one can change the meaning. Look in a mirror: if you cannot see your tongue, it is not TH.</p>",
"p3": "<p>Russian <i>и</i> sits between these two English sounds. If you use <i>и</i> for both, “live” and “leave” sound the same. Make the short /ɪ/ <b>more relaxed and lower</b> — think of the vowel in Russian <i>был</i> or <i>мыло</i>, but with the tongue a bit more forward.</p>",
"p4": "<p>Russian speakers often say /æ/ as <i>э</i>, so <b>bad</b> sounds like <b>bed</b>, and <b>man</b> sounds like <b>men</b>. Open your jaw more for /æ/ — imagine you are about to bite a big apple.</p>",
"p5": "<p>Russian <i>х</i> scrapes in the back of the mouth. If you use it, “hello” sounds harsh: “khello.” Practise by sighing: “haaa.” Then say “ha-llo” with that same soft breath.</p>",
"g1": "<p>Ask: <b>could I say “какой-то / один” in Russian?</b> → use <i>a</i>. <b>Could I say “этот / тот самый”?</b> → use <i>the</i>. <b>Am I talking about everything of this kind?</b> → no article.</p>",
"g2": "<p>In Russian: <i>Я живу здесь два месяца</i> — present tense. In English this becomes <b>present perfect</b>:<br><span class=\"wrong\">I live here two months.</span><br><span class=\"wrong\">I am living here for two months.</span><br><span class=\"right\">I’ve lived here for two months.</span> / <span class=\"right\">I’ve been living here for two months.</span></p>",
"g5": "<p>Russian <i>Я буду…</i> is often translated as <i>will</i> every time. But for plans, Canadians almost always say <b>gonna</b>: “What are you gonna do this weekend?” — “I’m gonna sleep!” Using <i>will</i> for every future sounds formal.</p>",
"v3": "<p>In Russia, “Как дела?” is often a real question, and people may answer honestly with details. In Canada, a long answer about problems to a cashier or a classmate you just met will surprise them. Save real answers for friends and family.</p>",
"c2": "<p>Many Russian speakers fill silences with <i>э-э-э</i> or <i>ну…</i>. English listeners notice this immediately. Train yourself to say <b>um</b>, <b>so</b> and <b>well</b> instead.</p>",
"c3": "<p>Russian communication is often more direct, and that is a sign of honesty. In Canada, the same directness can sound rude or angry — even when you don’t mean it that way. Adding a softener (“I think,” “maybe,” “kind of,” “I’m not sure”) costs nothing and helps a lot.</p>"
};

NEW.s4={title:'How to Use This Course',
lede:'Levels, languages, audio, printing — everything you need to find your way around.',
body:`
<h3>Choose your level</h3>
<p>Every lesson has a level, from the international CEFR scale used by ESL and LINC programs in Canada:</p>
<div class="tw"><table><tr><th>Level</th><th>You can…</th></tr>
<tr><td><span class="lv" style="margin:0">A2</span> Elementary</td><td>…talk about yourself, your family and your day in simple sentences.</td></tr>
<tr><td><span class="lv" style="margin:0">B1</span> Intermediate</td><td>…handle most everyday situations, but fast speech is still hard.</td></tr>
<tr><td><span class="lv" style="margin:0">B2</span> Upper-intermediate</td><td>…talk easily with Canadians about many topics, with some mistakes.</td></tr></table></div>
<p>Press <b>A2</b>, <b>B1</b> or <b>B2</b> at the top of the menu to show only the lessons for your level. You can do the lessons in any order — but the sound and stress units (01–04) help with everything else.</p>
<h3>Choose your language</h3>
<p>Press the <b>&#127760;</b> button at the top and choose your first language. Each lesson will show a short summary in your language, and some lessons have special tips for speakers of your language. See all the tips on the <a href="#/lang">Tips for your language</a> page.</p>
<h3>Listen to everything</h3>
<p>Tap any highlighted phrase to hear it: [[Nice to meet you.]] Use <b>&#128034; Slow</b> at the top for slower audio. In <b>&#9881; Settings</b> you can choose a voice and the normal speed.</p>
<h3>Practise, then print</h3>
<ul><li>Each lesson ends with <b>practice exercises</b>. Your answers are saved on this device.</li>
<li><b>&#128424; Print worksheet</b> makes a paper copy of the lesson and its exercises.</li>
<li>The <a href="#/lab">Practice lab</a> has extra drills you can repeat many times.</li>
<li>Write words and questions in the <b>My notes</b> box at the end of each lesson.</li>
<li>On speaking exercises, press <b>&#127908; Record</b>, say the phrase, then press <b>&#9654; Compare</b> to hear the model and then your own voice.</li>
<li>Each unit ends with a <b>unit test</b>. Exercises you get wrong come back in <a href="#/review">Review</a> a few days later.</li>
<li>Not sure of your level? Take the <a href="#/placement">placement quiz</a>.</li>
<li>In <b>&#9881; Settings</b> you can choose a <b>light theme</b> and a <b>bigger text size</b>.</li></ul>
<h3>Your privacy</h3>
<p>There is no account and no login. Your progress, answers and notes are stored <b>only on this device</b>, in this browser. To move them to another device, use <b>Settings → Export progress</b>.</p>`,
ex:[
{type:'mc',q:'You can talk about your day in simple sentences, but you find most conversations hard. Which level should you start with?',o:['A2','B1','B2'],a:0},
{type:'mc',q:'Where is your progress saved?',o:['On a website','Only on this device, in this browser','In your email'],a:1}
]};
