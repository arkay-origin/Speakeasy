NEW.x1={title:'Spelling and Sound',
lede:'English spelling is not a guide to pronunciation. Learn to trust your ears.',
body:`
<p>English uses 26 letters to write about <b>40 sounds</b> — around 24 consonant sounds and 16 vowel sounds in Canadian English. There aren’t enough letters, so the same letter does many jobs, and the same sound is written many ways.</p>
<h3>One spelling, many sounds</h3>
<p>Look at <b>ough</b>:</p>
<p>[[though]] (/oʊ/) · [[through]] (/uː/) · [[tough]] (/ʌf/) · [[cough]] (/ɑf/) · [[thought]] (/ɑ/) · [[bough]] (/aʊ/)</p>
<p>Six words, six different sounds — and the spelling looks the same in all of them.</p>
<h3>One sound, many spellings</h3>
<p>The sound /iː/ (the vowel in <i>see</i>):</p>
<p>[[see]] · [[sea]] · [[piece]] · [[receive]] · [[key]] · [[people]] · [[machine]] · [[me]]</p>
<h3>Why?</h3>
<p>English spelling was fixed hundreds of years ago, when people still pronounced the <i>k</i> in <i>knife</i> and the <i>gh</i> in <i>night</i>. The pronunciation changed; the spelling didn’t. English also borrowed words from French, Latin, Greek, Dutch and many other languages — and often kept their spelling.</p>
<div class="box rule"><b>What this means for you</b><p><b>Hear a new word before you say it.</b> Don’t guess from the spelling. Use the audio in this course, a dictionary’s ▶ button, or ask someone: “How do you say this word?”</p></div>
<h3>Phonetic symbols</h3>
<p>Dictionaries use the <b>International Phonetic Alphabet (IPA)</b> to show sounds, written between slashes: /kæt/ = <i>cat</i>. This course uses the same symbols, so you can use any dictionary with it. You don’t need to memorize them all — they are here to help you when spelling can’t.</p>
<div class="box tip"><b>Good dictionaries</b><p>The free online <b>Cambridge</b>, <b>Oxford Learner’s</b> and <b>Merriam-Webster</b> dictionaries all show IPA and have a ▶ button to hear the word. Choose the North American (US) pronunciation if there is a choice — it is much closer to Canadian English than the British one.</p></div>`,
ex:[
{type:'mc',q:'How many sounds does English have, approximately?',o:['26','40','60'],a:1},
{type:'mc',q:'Which word does NOT have the same vowel sound as [[see]]?',o:['[[piece]]','[[key]]','[[head]]','[[people]]'],a:2,why:'<i>Head</i> has the vowel of <i>bed</i>, even though it is spelled with <i>ea</i> like <i>sea</i>.'},
{type:'mc',q:'You find a new word in an email. What is the best way to learn how to say it?',o:['Read it letter by letter.','Listen to it first — a dictionary’s ▶ button or ask someone.','Say it like a word in your language.'],a:1},
{type:'mc',q:'Which word rhymes with [[through]]?',o:['[[though]]','[[true]]','[[tough]]'],a:1}
]};

NEW.x2={title:'Consonant Sounds',
lede:'Most English consonants come in pairs. The difference is your voice.',
body:`
<h3>Voiced and voiceless pairs</h3>
<p>Put your fingers on your throat and say a long <b>sssss</b>, then a long <b>zzzzz</b>. Do you feel the buzz on <b>z</b>? That buzz is your voice. <b>/s/</b> is <b>voiceless</b> (air only); <b>/z/</b> is <b>voiced</b>. Your mouth is in exactly the same position for both.</p>
<div class="tw"><table><tr><th>Voiceless (air only)</th><th>Voiced (with buzz)</th><th>Mouth</th></tr>
<tr><td>/p/ [[pig]]</td><td>/b/ [[big]]</td><td>both lips</td></tr>
<tr><td>/t/ [[ten]]</td><td>/d/ [[den]]</td><td>tongue behind top teeth</td></tr>
<tr><td>/k/ [[coat]]</td><td>/g/ [[goat]]</td><td>back of the tongue</td></tr>
<tr><td>/f/ [[fan]]</td><td>/v/ [[van]]</td><td>top teeth on bottom lip</td></tr>
<tr><td>/θ/ [[think]]</td><td>/ð/ [[this]]</td><td>tongue between the teeth</td></tr>
<tr><td>/s/ [[sue]]</td><td>/z/ [[zoo]]</td><td>tongue near the top teeth</td></tr>
<tr><td>/ʃ/ [[shoe]], [[nation]]</td><td>/ʒ/ [[usual]], [[beige]]</td><td>lips forward, tongue further back</td></tr>
<tr><td>/tʃ/ [[cheap]], [[watch]]</td><td>/dʒ/ [[jeep]], [[age]]</td><td>t + sh / d + zh</td></tr></table></div>
<h3>The other consonants</h3>
<div class="tw"><table><tr><th>Sound</th><th>Examples</th></tr>
<tr><td>/m/ /n/</td><td>[[man]] [[nine]]</td></tr>
<tr><td>/ŋ/</td><td>[[sing]] [[long]] [[thinking]] — one sound, made at the back of the mouth. No /g/ at the end of <i>sing</i>!</td></tr>
<tr><td>/h/</td><td>[[hello]] [[house]] — just breath</td></tr>
<tr><td>/l/ /r/</td><td>[[light]] [[right]]</td></tr>
<tr><td>/w/ /j/</td><td>[[wet]] [[yet]] — the symbol /j/ is the sound of <i>y</i> in <i>yes</i></td></tr></table></div>
<h3>The puff of air</h3>
<p>At the start of a stressed syllable, <b>/p/, /t/, /k/</b> come with a small <b>puff of air</b>. Hold a piece of paper in front of your mouth and say <i>pin, ten, cat</i> — the paper should move. Then say <i>bin, den, gap</i> — it shouldn’t.</p>
<div class="box tip"><b>Why the puff matters</b><p>In many languages — French, Spanish, Tagalog, Russian and others — /p t k/ have no puff. English listeners use the puff to tell /p/ from /b/. Without it, your <i>pin</i> can sound like <i>bin</i> and your <i>Tim</i> like <i>dim</i>.</p></div>
<h3>Consonant groups</h3>
<p>English allows many consonants together: [[street]] (s-t-r), [[sixths]] (k-s-θ-s), [[texts]] (k-s-t-s), [[spring]], [[asked]]. Many languages don’t, so learners add a vowel: “e-street,” “si-pring,” “aske-d.” Practise slowly, with <b>no extra vowel</b>: [[school]] [[student]] [[Spanish]] [[strong]] [[splash]].</p>`,
ex:[
{type:'pairs',q:'Voiced and voiceless pairs. Learn them, then do the listening drill.',pairs:[['pin','bin'],['tie','die'],['coat','goat'],['fan','van'],['sue','zoo'],['cheap','jeep'],['pack','back'],['cap','cab']]},
{type:'mc',q:'What is the voiced partner of /f/?',o:['/p/','/v/','/θ/'],a:1},
{type:'mc',q:'Which word has the sound /ʒ/?',o:['[[usual]]','[[sugar]]','[[jump]]'],a:0,why:'<i>Usual</i> has /ʒ/. <i>Sugar</i> has /ʃ/, <i>jump</i> has /dʒ/.'},
{type:'mc',q:'How does [[morning]] end?',o:['/ŋ/ only — no g sound','/ŋ/ + /g/','/n/ + /k/'],a:0},
{type:'say',q:'No extra vowel at the start!',lines:['school','student','street','Spanish','I speak English.','She studies at a school in Stratford.']}
]};

NEW.x5={title:'Silent Letters',
lede:'Many English words have letters that you write but never say.',
body:`
<p>Silent letters are left over from old pronunciations, or from words borrowed from other languages. There’s no way to hear them — you have to learn them with the word.</p>
<div class="tw"><table><tr><th>Silent</th><th>Examples</th></tr>
<tr><td>k before n</td><td>[[know]] [[knee]] [[knife]] [[knock]] [[knowledge]]</td></tr>
<tr><td>w before r, and others</td><td>[[write]] [[wrong]] [[wrist]] [[answer]] [[two]] [[sword]]</td></tr>
<tr><td>b after m, before t</td><td>[[climb]] [[thumb]] [[plumber]] [[debt]] [[doubt]]</td></tr>
<tr><td>l</td><td>[[walk]] [[talk]] [[half]] [[calm]] [[could]] [[would]] [[should]] [[salmon]]</td></tr>
<tr><td>gh</td><td>[[night]] [[eight]] [[daughter]] [[though]] [[weigh]]</td></tr>
<tr><td>g before n</td><td>[[sign]] [[design]] [[foreign]] [[campaign]]</td></tr>
<tr><td>h</td><td>[[hour]] [[honest]] [[honour]] [[what]] [[ghost]] [[school]]</td></tr>
<tr><td>t</td><td>[[listen]] [[castle]] [[fasten]] [[Christmas]] [[mortgage]]</td></tr>
<tr><td>p</td><td>[[receipt]] [[cupboard]] [[psychology]]</td></tr>
<tr><td>s</td><td>[[island]] [[aisle]]</td></tr>
<tr><td>c after s</td><td>[[science]] [[muscle]] [[scissors]] [[scene]]</td></tr>
<tr><td>d</td><td>[[Wednesday]] [[handsome]] [[sandwich]] (often)</td></tr></table></div>
<div class="box ca"><b>Words you’ll need in Canada</b><p>[[receipt]] = “ri-SEET” — you’ll say this at every store. [[mortgage]] = “MOR-gij.” [[Wednesday]] = “WENZ-day.” [[salmon]] = “SAM-un.” [[Ottawa]] = “OT-uh-wuh.” [[Saskatchewan]] = “sas-KATCH-uh-wun.” [[Toronto]] = often “tuh-RON-oh” — many locals drop the second t.</p></div>
<h3>Double letters</h3>
<p>Two of the same consonant are usually said <b>once</b>: [[coffee]], [[dinner]], [[summer]], [[happy]], [[letter]], [[address]]. Don’t make them long.</p>
<p>One exception: <b>cc</b> before <i>e</i> or <i>i</i> is /ks/: [[accept]] [[access]] [[success]] [[accident]] [[vaccine]].</p>`,
ex:[
{type:'fill',q:'Which letter is silent in “knife”?',a:['k'],show:'k'},
{type:'fill',q:'Which letter is silent in “receipt”?',a:['p'],show:'p'},
{type:'fill',q:'Which letter is silent in “listen”?',a:['t'],show:'t'},
{type:'mc',q:'How do you say [[Wednesday]]?',o:['WED-nes-day','WENZ-day','wed-NES-day'],a:1},
{type:'mc',q:'Which word has a silent h?',o:['[[house]]','[[honest]]','[[behind]]'],a:1},
{type:'mc',q:'How many sounds does cc make in [[accept]]?',o:['One — /k/','Two — /k/ + /s/'],a:1}
]};

/* ---------- VOWELS ---------- */
NEW.x3={title:'The Vowel Chart',
lede:'Canadian English has 16 main vowel sounds. Learn one keyword for each.',
body:`
<p>English writes vowels with only five letters — a, e, i, o, u — but Canadian English has about <b>16 vowel sounds</b> in stressed syllables, plus the tiny unstressed /ə/. The letters don’t tell you which sound to use, so it helps to have a <b>keyword</b> for each sound.</p>
<div class="box rule"><b>The idea</b><p>Each vowel sound has a simple picture word. When you meet a new word, ask: <b>which keyword has the same vowel?</b> <i>Women</i> → ⦃ship⦄. <i>Said</i> → ⦃bed⦄. <i>Laugh</i> → ⦃cat⦄. The spelling doesn’t matter — only the sound.</p></div>
<h3>The chart</h3>
<p>Tap each keyword and each example. Say them out loud, slowly, then at normal speed.</p>
<div data-widget="vowelchart"></div>
<h3>Four groups</h3>
<ul><li><b>Short vowels</b> — quick and relaxed: ⦃ship⦄ ⦃bed⦄ ⦃cat⦄ ⦃cup⦄ ⦃book⦄</li>
<li><b>Long vowels</b> — you can hold them: ⦃sheep⦄ ⦃moon⦄ ⦃clock⦄</li>
<li><b>Gliding vowels</b> — the mouth moves from one position to another: ⦃cake⦄ ⦃boat⦄ ⦃pie⦄ ⦃cow⦄ ⦃coin⦄</li>
<li><b>R-vowels</b> — the vowel and the r blend together: ⦃bird⦄ ⦃star⦄ ⦃horse⦄</li></ul>
<div class="box ca"><b>A Canadian feature: one ⦃clock⦄ vowel</b><p>In most of Canada, <i>cot</i> and <i>caught</i>, <i>Don</i> and <i>Dawn</i>, <i>stock</i> and <i>stalk</i> sound <b>the same</b>. So <i>hot, father, coffee, law, walk</i> all have the ⦃clock⦄ vowel. Good news: one fewer vowel to learn than in British or some American English.</p></div>
<h3>How to use the keywords</h3>
<ul><li>When you write a new word in your notes, add its keyword: “<i>women</i> — WIM-in — SHIP.”</li>
<li>When you don’t know how a word sounds, ask a Canadian: “Does this rhyme with <i>sheep</i> or <i>ship</i>?”</li>
<li>Only the <b>stressed</b> syllable needs a keyword. Most unstressed vowels are /ə/ (Unit 03).</li></ul>`,
ex:[
{type:'colour',q:'Say each word, then choose the keyword with the same vowel.',o:['sheep','ship','bed','cat'],items:[['eat','sheep'],['busy','ship'],['said','bed'],['laugh','cat'],['piece','sheep'],['gym','ship']]},
{type:'colour',o:['cake','boat','pie','cow'],items:[['eight','cake'],['know','boat'],['buy','pie'],['hour','cow'],['great','cake'],['though','boat']]},
{type:'mc',q:'Which word has the ⦃clock⦄ vowel in Canadian English?',o:['[[coat]]','[[caught]]','[[cut]]'],a:1}
]};

NEW.x4={title:'Gliding Vowels and R-Vowels',
lede:'Some vowels move. Some vowels blend with r. Both are common sources of an accent.',
body:`
<h3>Gliding vowels (diphthongs)</h3>
<p>In a gliding vowel, your mouth <b>moves</b> during the sound — it starts in one place and slides to another:</p>
<div class="tw"><table><tr><th>Keyword</th><th>Movement</th><th>Examples</th></tr>
<tr><td>⦃cake⦄ /eɪ/</td><td>“e” → “i”</td><td>[[day]] [[name]] [[eight]] [[great]] [[they]]</td></tr>
<tr><td>⦃boat⦄ /oʊ/</td><td>“o” → “u”, lips get rounder</td><td>[[go]] [[home]] [[know]] [[phone]] [[road]]</td></tr>
<tr><td>⦃pie⦄ /aɪ/</td><td>“a” → “i”</td><td>[[my]] [[time]] [[five]] [[buy]] [[eye]]</td></tr>
<tr><td>⦃cow⦄ /aʊ/</td><td>“a” → “u”</td><td>[[now]] [[town]] [[down]] [[how]] [[loud]]</td></tr>
<tr><td>⦃coin⦄ /ɔɪ/</td><td>“o” → “i”</td><td>[[boy]] [[oil]] [[voice]] [[enjoy]] [[point]]</td></tr></table></div>
<div class="box tip"><b>The most common mistake</b><p>Many learners say ⦃cake⦄ and ⦃boat⦄ as one pure, short sound: <i>no</i> as a short “no,” <i>day</i> as “de.” Without the glide, <i>coat</i> can sound like <i>caught</i> and <i>late</i> like <i>let</i>. Let the sound <b>move</b>: “no-u,” “de-i.”</p></div>
<h3>R-vowels</h3>
<p>Canadian English pronounces every written <b>r</b> after a vowel (British English often doesn’t). The vowel and the r blend into one sound:</p>
<div class="tw"><table><tr><th>Keyword</th><th>Examples</th></tr>
<tr><td>⦃bird⦄ /ɝ/</td><td>[[her]] [[work]] [[first]] [[learn]] [[word]] [[nurse]] [[were]] [[journey]]</td></tr>
<tr><td>⦃star⦄ /ɑr/</td><td>[[car]] [[park]] [[heart]] [[are]] [[garden]]</td></tr>
<tr><td>⦃horse⦄ /ɔr/</td><td>[[more]] [[floor]] [[four]] [[store]] [[sorry]]</td></tr></table></div>
<h3>The ⦃bird⦄ vowel</h3>
<p>This sound doesn’t exist in most languages. Pull your tongue back and up — not touching anything — round your lips a little, and say a long “errr,” like a growl. All of these words have <b>exactly the same vowel</b>, whatever the spelling: <i>her, sir, fur, word, earn, journey</i>.</p>
<div class="box tip"><b>Don’t read the letters</b><p><i>Word</i> is not “ward” or “vord.” <i>Girl</i> is not “geerl” or “gyorl.” <i>Work</i> and <i>walk</i> are different: [[work]] has ⦃bird⦄, [[walk]] has ⦃clock⦄ (and a silent l).</p></div>
<h3>Other vowels before r</h3>
<p>You’ll also hear: [[here]] [[near]] [[beer]] (ear sound), [[hair]] [[there]] [[care]] (air sound), [[tour]] [[sure]] (often “shur”), [[fire]] [[hour]] (sometimes two syllables).</p>`,
ex:[
{type:'colour',o:['cake','boat','pie','cow','coin'],items:[['late','cake'],['road','boat'],['child','pie'],['mouth','cow'],['voice','coin'],['weight','cake'],['snow','boat'],['flower','cow']]},
{type:'colour',o:['bird','star','horse'],items:[['learn','bird'],['heart','star'],['four','horse'],['early','bird'],['large','star'],['board','horse'],['were','bird'],['sorry','horse']]},
{type:'pairs',q:'⦃bird⦄ vs ⦃clock⦄ — very different words!',pairs:[['work','walk'],['heard','hard'],['firm','farm'],['bird','board'],['were','war'],['shirt','short']]}
]};

/* ---------- WORD STRESS ---------- */
NEW.x6={title:'Stress in Longer Words',
lede:'Word endings and word families give you strong clues about where the stress goes.',
body:`
<p>You already know that every English word has <b>one main stressed syllable</b> (Lesson 1 of this unit). In long words, there may also be a weaker “secondary” stress — but only one syllable is really strong.</p>
<h3>Endings that take the stress</h3>
<p>These endings are almost always stressed themselves:</p>
<div class="tw"><table><tr><th>Ending</th><th>Examples</th></tr>
<tr><td>-ee</td><td>[[employ«EE»|employee]] [[refer«EE»|referee]] [[guaran«TEE»|guarantee]] — but [[com«MIT»tee|committee]] is an exception</td></tr>
<tr><td>-eer</td><td>[[engi«NEER»|engineer]] [[volun«TEER»|volunteer]] [[car«EER»|career]]</td></tr>
<tr><td>-ese</td><td>[[Chi«NESE»|Chinese]] [[Japa«NESE»|Japanese]] [[Vietna«MESE»|Vietnamese]]</td></tr>
<tr><td>-ique, -esque</td><td>[[u«NIQUE»|unique]] [[tech«NIQUE»|technique]] [[pictur«ESQUE»|picturesque]]</td></tr>
<tr><td>-ain (verbs)</td><td>[[main«TAIN»|maintain]] [[ex«PLAIN»|explain]] [[re«MAIN»|remain]]</td></tr></table></div>
<h3>Endings that push the stress back</h3>
<div class="tw"><table><tr><th>Ending</th><th>Stress on…</th><th>Examples</th></tr>
<tr><td>-tion, -sion, -ic, -ical, -ity, -ian</td><td>the syllable just <b>before</b> the ending</td><td>[[appli«CA»tion|application]] [[ter«RIF»ic|terrific]] [[elec«TRI»city|electricity]] [[Ca«NA»dian|Canadian]] [[mu«SI»cian|musician]]</td></tr>
<tr><td>-ate, -ize, -ify (in long verbs)</td><td><b>two</b> syllables before the ending</td><td>[[com«MU»nicate|communicate]] [[«OR»ganize|organize]] [[i«DEN»tify|identify]]</td></tr></table></div>
<h3>Word families: the stress moves</h3>
<p>Words from the same family can have different stress. Learn them together:</p>
<div class="tw"><table><tr><th></th><th></th><th></th></tr>
<tr><td>[[«PHO»tograph|photograph]]</td><td>[[pho«TOG»rapher|photographer]]</td><td>[[photo«GRAPH»ic|photographic]]</td></tr>
<tr><td>[[e«CON»omy|economy]]</td><td>[[eco«NOM»ic|economic]]</td><td>[[e«CON»omist|economist]]</td></tr>
<tr><td>[[«CAN»ada|Canada]]</td><td>[[Ca«NA»dian|Canadian]]</td><td></td></tr>
<tr><td>[[«POL»itics|politics]]</td><td>[[po«LIT»ical|political]]</td><td>[[poli«TI»cian|politician]]</td></tr>
<tr><td>[[«E»ducate|educate]]</td><td>[[edu«CA»tion|education]]</td><td></td></tr></table></div>
<h3>Numbers</h3>
<p>Counting “-teen” numbers stress the end: [[thir«TEEN»|thirteen]]. “-ty” numbers stress the start: [[«THIR»ty|thirty]]. This is important when you hear prices, ages and addresses (Unit 08 has more practice).</p>
<div class="box tip"><b>Keep a stress notebook</b><p>Each time you learn a new word, write it with the stressed syllable in CAPITALS: <i>em-ploy-EE, com-MU-ni-cate, ca-NA-di-an</i>. After a few weeks, you’ll start to feel the patterns.</p></div>`,
ex:[
{type:'stress',q:'Click the stressed syllable.',items:[['em','ploy','ee',2],['en','gi','neer',2],['Jap','a','nese',2],['ex','plain',1],['in','for','ma','tion',2],['mu','si','cian',1]]},
{type:'stress',q:'The stress moves inside these word families.',items:[['pho','to','graph',0],['pho','tog','ra','pher',1],['pol','i','tics',0],['po','lit','i','cal',1],['com','mu','ni','cate',1],['or','gan','ize',0]]},
{type:'mc',q:'Where is the stress in “volunteer”?',o:['«VOL»unteer','vol«UN»teer','volun«TEER»'],a:2}
]};

NEW.x7={title:'Short Cuts in Long Words',
lede:'In everyday speech, some unstressed syllables disappear completely.',
body:`
<p>Unstressed syllables are already short and weak (/ə/). In some common words, one of them <b>drops out</b>. Dictionaries often list the longer version, but this is what you will hear — and what sounds natural when you say it:</p>
<div class="tw"><table><tr><th>Word</th><th>Written syllables</th><th>Usual pronunciation</th></tr>
<tr><td>[[every]]</td><td>e-ve-ry (3)</td><td>EV-ree (2)</td></tr>
<tr><td>[[different]]</td><td>dif-fer-ent (3)</td><td>DIF-rent (2)</td></tr>
<tr><td>[[family]]</td><td>fam-i-ly (3)</td><td>FAM-lee (2)</td></tr>
<tr><td>[[business]]</td><td>bus-i-ness (3)</td><td>BIZ-ness (2)</td></tr>
<tr><td>[[evening]]</td><td>e-ven-ing (3)</td><td>EEV-ning (2)</td></tr>
<tr><td>[[several]]</td><td>sev-er-al (3)</td><td>SEV-rul (2)</td></tr>
<tr><td>[[general]]</td><td>gen-er-al (3)</td><td>JEN-rul (2)</td></tr>
<tr><td>[[average]]</td><td>av-er-age (3)</td><td>AV-rij (2)</td></tr>
<tr><td>[[interesting]]</td><td>in-ter-est-ing (4)</td><td>IN-trest-ing (3)</td></tr>
<tr><td>[[comfortable]]</td><td>com-fort-a-ble (4)</td><td>KUMF-ter-bul (3)</td></tr>
<tr><td>[[vegetable]]</td><td>veg-e-ta-ble (4)</td><td>VEJ-tuh-bul (3)</td></tr>
<tr><td>[[temperature]]</td><td>tem-per-a-ture (4)</td><td>TEM-pruh-chur (3)</td></tr>
<tr><td>[[restaurant]]</td><td>res-tau-rant (3)</td><td>REST-rahnt (2)</td></tr>
<tr><td>[[actually]]</td><td>ac-tu-al-ly (4)</td><td>AK-shuh-lee (3)</td></tr>
<tr><td>[[probably]]</td><td>prob-a-bly (3)</td><td>PROB-lee (2, casual)</td></tr></table></div>
<h3>Whole words get shorter too</h3>
<p>Many long words have a short everyday version: <i>refrigerator</i> → [[fridge]], <i>television</i> → [[TV]], <i>university</i> → often just “school” in Canada, <i>information</i> → [[info]], <i>laboratory</i> → [[lab]], <i>application</i> → [[app]], <i>photograph</i> → [[photo]].</p>
<div class="box tip"><b>Two skills</b><p><b>Listening:</b> if you only know the long pronunciation, you may not recognize “FAM-lee” or “KUMF-ter-bul.” <b>Speaking:</b> saying every syllable is still correct and clear — but the short versions sound more natural.</p></div>`,
ex:[
{type:'fill',q:'How many syllables do most people SAY in “family”? (type a number)',a:['2','two'],show:'2 — FAM-lee'},
{type:'fill',q:'How many syllables do most people SAY in “comfortable”? (type a number)',a:['3','three'],show:'3 — KUMF-ter-bul'},
{type:'mc',q:'Which is the usual pronunciation of [[different]]?',o:['dif-FER-ent','DIF-rent','di-fe-RENT'],a:1},
{type:'say',q:'Use the short versions.',lines:['Every family is different.','It’s an interesting restaurant.','What’s the temperature this evening?','Actually, I’m probably busy.']}
]};

/* ================= NEW LESSONS (public edition) · part 2 ================= */

NEW.x9={title:'Decoding Fast Speech',
lede:'When Canadians talk fast, short words melt together. Here is how to understand them.',
body:`
<p>You now know the pieces: weak forms (/ə/), contractions, <i>gonna/wanna</i>, linking and the flap T. In real conversation, they all happen <b>at the same time</b>. The start of a question often becomes one short blur:</p>
<div class="tw"><table><tr><th>You hear</th><th>Full form</th></tr>
<tr><td>[[«WHAD»dya «THINK»?|whaddaya think?]]</td><td>What do you think?</td></tr>
<tr><td>[[«WHAD»dya «DO»in’?|whaddaya doin?]]</td><td>What are you doing?</td></tr>
<tr><td>[[d’ya «WAN»na «COME»?|d'ya wanna come?]]</td><td>Do you want to come?</td></tr>
<tr><td>[[d’ya «HAF»ta «WORK»?|d'ya hafta work?]]</td><td>Do you have to work?</td></tr>
<tr><td>[[«DID»ja «EAT» yet?|didja eat yet?]]</td><td>Did you eat yet?</td></tr>
<tr><td>[[«WHERE»dja «PARK»?|wherdja park?]]</td><td>Where did you park?</td></tr>
<tr><td>[[«WOULD»ja «MIND»?|wouldja mind?]]</td><td>Would you mind?</td></tr>
<tr><td>[[«HOW»ya «DO»in’?|how ya doin?]]</td><td>How are you doing?</td></tr>
<tr><td>[[«WHAT»cha «GOT»?|whatcha got?]]</td><td>What have you got?</td></tr>
<tr><td>[[«GOT»ta «GO».|gotta go]]</td><td>I have got to go.</td></tr>
<tr><td>[[«LEM»me «KNOW».|lemme know]]</td><td>Let me know.</td></tr>
<tr><td>[[«C’MON».|come on]]</td><td>Come on.</td></tr>
<tr><td>[[You «SHOULD»a «TOLD» me.|you shoulda told me]]</td><td>You should have told me.</td></tr></table></div>
<p>Notice: <b>What do you…</b> and <b>What are you…</b> can sound exactly the same — “whaddaya.” The verb after it tells you which one: <i>whaddaya <b>think</b></i> = what do you think; <i>whaddaya <b>doing</b></i> = what are you doing.</p>
<h3>A strategy for listening</h3>
<ol><li><b>Catch the strong words.</b> Stressed words are clear even in fast speech: <i>…THINK? …EAT…YET? …PARK?</i></li>
<li><b>Guess the mush.</b> The weak blur in front is almost always one of a few question starts: <i>do you, did you, are you, have you, would you, what do you</i>.</li>
<li><b>Use the situation.</b> At lunchtime, “djeetyet?” can only be “Did you eat yet?”</li>
<li><b>Still lost?</b> Ask: [[Sorry, could you say that again?]] Nobody minds.</li></ol>
<div class="box tip"><b>Say it or not?</b><p>You don’t need to talk like this. Clear, careful English is always fine. But you <b>do</b> need to understand it, because you’ll hear it every day — at work, in stores, on the phone.</p></div>`,
ex:[
{type:'fill',q:'Write the full form: [[«DID»ja «EAT» yet?|didja eat yet?]] → ___ ___ eat yet?',a:['did you'],show:'Did you eat yet?'},
{type:'fill',q:'Write the full form: [[d’ya «HAF»ta «WORK» tomorrow?|d’ya hafta work tomorrow?]] → Do you ___ ___ work tomorrow?',a:['have to'],show:'have to'},
{type:'mc',q:'[[«WHAD»dya «DO»in’ this weekend?|whaddaya doin this weekend?]] What did they ask?',o:['What do you do this weekend?','What are you doing this weekend?','What did you do this weekend?'],a:1},
{type:'mc',q:'[[«WHAD»dya «WANT» for «LUNCH»?|whaddaya want for lunch?]] What did they ask?',o:['What do you want for lunch?','What are you want for lunch?','Why do you want lunch?'],a:0},
{type:'reveal',q:'Write as normal English: <br>1. Wouldja mind opening the window? <br>2. Whatcha gonna do? <br>3. I dunno, lemme check.',a:'1. Would you mind opening the window? <br>2. What are you going to do? <br>3. I don’t know, let me check.'}
]};

NEW.x10={title:'Your Voice Shows Your Feelings',
lede:'The same words can be friendly, bored, angry or sarcastic. Your voice decides.',
body:`
<p>English listeners hear your feelings in your <b>voice</b>: how high or low it is, how much it moves, how fast and loud you speak. Often the voice matters more than the words.</p>
<div class="tw"><table><tr><th>Voice</th><th>Usually sounds…</th></tr>
<tr><td>Higher, lots of up and down, a bit faster</td><td>friendly, interested, happy, excited</td></tr>
<tr><td>Medium, some movement</td><td>calm, polite, normal</td></tr>
<tr><td>Low, flat, slow</td><td>bored, tired, sad, annoyed — or unfriendly</td></tr>
<tr><td>Loud, short, hard</td><td>angry or impatient</td></tr></table></div>
<h3>Same words, different meaning</h3>
<ul><li>[[That’s great!]] — high and bright = really great.</li>
<li>“Oh… <b>that’s great</b>.” — low, flat and slow = <b>sarcasm</b>: it’s actually bad.</li>
<li>[[Thanks so much!]] — warm = grateful. “Thanks a lot.” — flat and low = annoyed.</li>
<li>[[Fine.]] — said quickly and low, without looking at you, often means “I’m <b>not</b> fine.”</li></ul>
<div class="box rule"><b>When the words and the voice don’t match, believe the voice</b><p>If a coworker says “No problem” in a tired, flat voice, maybe it <i>is</i> a problem. You could ask: [[Are you sure? I can ask someone else.]]</p></div>
<h3>Sarcasm in Canada</h3>
<p>Canadians use mild sarcasm a lot, usually as a joke. It is -30°C and someone says, “Lovely weather, eh?” They mean the opposite. The clues: the words are positive, the situation is negative, and the voice is flat or exaggerated. If you’re not sure, it’s fine to smile and ask: [[Are you joking?]]</p>
<div class="box tip"><b>Sound friendly on purpose</b><p>If your language’s normal melody is flatter than English, your “neutral” voice may sound unfriendly to Canadians. When you greet people, thank them or ask for something, make your voice a little <b>higher</b> and let it <b>move</b> more than feels natural. To Canadians, it will sound normal and warm.</p></div>`,
ex:[
{type:'mc',q:'You spill coffee on your shirt. Your coworker says, slowly and flat: “Oh, great.” They mean…',o:['Something good happened.','Something bad happened — it’s sarcasm.','They like your shirt.'],a:1},
{type:'mc',q:'Someone says “I’m fine” in a low, flat voice and doesn’t look at you. Best response?',o:['Good!','Are you sure? You seem a bit down.','Why are you lying?'],a:1},
{type:'say',q:'Say each one twice: first friendly (high, moving), then bored (low, flat). Hear the difference.',lines:['Thank you.','That’s great.','Good morning.','Sure, no problem.']}
]};

NEW.x11={title:'Body Language in Canada',
lede:'Smiles, eye contact, handshakes, personal space and silence — the unwritten rules.',
body:`
<h3>Smiling</h3>
<p>Canadians smile a lot — at cashiers, bus drivers, neighbours and strangers they pass on a quiet street. It doesn’t mean “let’s be friends”; it means “I’m friendly, everything is OK.” In some cultures, smiling at strangers seems strange or insincere. In Canada, a <b>serious face</b> can look unfriendly or annoyed, even when you feel fine. A small smile when you say hello, order or say thank you makes a big difference.</p>
<h3>Eye contact</h3>
<p>In Canada, looking someone in the eye shows that you are <b>honest, confident and listening</b>. Look at the person while they talk, glance away now and then, and look back. Never looking at someone — even out of respect, as in some cultures — can seem shy, bored or dishonest here. Staring without a break feels aggressive.</p>
<h3>Handshakes</h3>
<ul><li>Shake hands when you meet someone new, at job interviews and in business meetings.</li>
<li>Use a <b>firm</b> grip (not weak, not crushing), look at the person, smile, and shake two or three times.</li>
<li>Men and women shake hands with each other in the same way.</li>
<li>If someone doesn’t offer a hand — for health, religious or personal reasons — a smile and a nod are completely fine.</li></ul>
<h3>Personal space</h3>
<p>Canadians usually stand about <b>an arm’s length</b> apart when they talk. Closer can feel pushy. Touching (except a handshake, or a hug between friends) is uncommon with people you don’t know well. In a line-up, leave some space between you and the next person.</p>
<h3>Silence and fillers</h3>
<p>Canadians are not comfortable with long silences in conversation. If you need time to think, <b>fill the gap</b> with a sound or a phrase, so the other person knows you heard them:</p>
<p>[[Um…]] &nbsp; [[Let me think…]] &nbsp; [[Good question.]] &nbsp; [[Hmm, how do I say this…]]</p>
<h3>Common gestures</h3>
<div class="tw"><table><tr><th>Gesture</th><th>Meaning</th></tr>
<tr><td>👍 Thumbs up</td><td>Good / OK / yes</td></tr>
<tr><td>👋 Wave</td><td>Hi / bye</td></tr>
<tr><td>Nod / shake your head</td><td>Yes / no</td></tr>
<tr><td>Shrug (shoulders up, palms up)</td><td>I don’t know</td></tr>
<tr><td>Flat hand rocking side to side</td><td>So-so, more or less</td></tr>
<tr><td>🤞 Fingers crossed</td><td>Hoping for good luck</td></tr>
<tr><td>Hand up, palm out</td><td>Stop / wait</td></tr>
<tr><td>Hands in a T</td><td>Time out, wait a moment</td></tr></table></div>
<div class="box tip"><b>Point carefully</b><p>Pointing at things is fine; pointing a finger <b>at a person</b> can seem rude. Beckoning an adult with one curled finger (“come here”) can also seem rude — say “Excuse me, could you come here for a moment?” instead. And the raised middle finger is very offensive everywhere in Canada.</p></div>
<h3>Being on time</h3>
<p>For work, appointments, classes and interviews, Canadians expect you to be <b>on time</b> — or a few minutes early. If you will be late, call or text before. For a party at someone’s home, arriving 10–15 minutes after the start time is normal.</p>`,
ex:[
{type:'mc',q:'You meet a new coworker. What is most natural in Canada?',o:['Look down to show respect.','Smile, make eye contact, and shake hands.','Bow and say nothing.'],a:1},
{type:'mc',q:'Your manager asks you a question and you need a few seconds to think. Best response?',o:['Stay completely silent.','Say “Hmm, let me think…”','Walk away.'],a:1},
{type:'mc',q:'Your job interview is at 10:00. When should you arrive?',o:['At 10:15','At about 9:50','Any time before noon'],a:1},
{type:'mc',q:'Someone shrugs with palms up when you ask where the meeting is. They mean…',o:['It’s over there.','I don’t know.','Be quiet.'],a:1}
]};

/* ---------- EXPRESSIONS ---------- */
NEW.x16={title:'One Word, Many Meanings',
lede:'Most common English words have several meanings. The words around them tell you which one.',
body:`
<p>Look at the word <b>run</b>:</p>
<ul><li>[[I run every morning.]] — move fast on foot</li>
<li>[[She runs a small restaurant.]] — manages</li>
<li>[[The bus runs every twenty minutes.]] — operates</li>
<li>[[My nose is running.]] — liquid is coming out</li>
<li>[[We’re running late.]] — we will be late</li>
<li>[[We ran out of milk.]] — we have none left</li></ul>
<p>You understand each one from the <b>context</b>: the other words and the situation. This is how fluent speakers understand English — not word by word, but in groups.</p>
<h3>Guessing new words from context</h3>
<p>You can often understand a new word without a dictionary. What does <b>shovel</b> mean here?</p>
<p><i>“It snowed 30 centimetres last night, so I had to <b>shovel</b> the driveway before I could get the car out.”</i></p>
<p>You can guess: it means to move snow, probably with a tool. That guess is good enough to keep listening. Later, you can check.</p>
<h3>Same sound, different words</h3>
<p>Some words sound <b>exactly the same</b> but have different spelling and meaning. In speech, only context tells you which word it is:</p>
<div class="tw"><table><tr><th>Sound</th><th>Words</th></tr>
<tr><td>[[too]]</td><td>to · too · two</td></tr>
<tr><td>[[there]]</td><td>there · their · they’re</td></tr>
<tr><td>[[right]]</td><td>right · write</td></tr>
<tr><td>[[know]]</td><td>know · no</td></tr>
<tr><td>[[hour]]</td><td>hour · our</td></tr>
<tr><td>[[buy]]</td><td>buy · by · bye</td></tr>
<tr><td>[[weight]]</td><td>weight · wait</td></tr>
<tr><td>[[mail]]</td><td>mail · male</td></tr>
<tr><td>[[week]]</td><td>week · weak</td></tr>
<tr><td>[[fare]]</td><td>fare (bus ticket price) · fair</td></tr></table></div>
<h3>Same spelling, different sound</h3>
<p>And some words look the same but sound different: [[I read every day.|I reed every day.]] / [[I read it yesterday.|I red it yesterday.]] — [[Please close the door.|please cloze the door]] / [[We live close to work.|we live cloce to work]] — [[I live here.]] / [[a live concert|a lyve concert]].</p>`,
ex:[
{type:'mc',q:'“It’s ___ cold to walk.”',o:['to','two','too'],a:2},
{type:'mc',q:'“___ coming at six.”',o:['There','Their','They’re'],a:2},
{type:'mc',q:'“What’s the bus ___?” (the price)',o:['fair','fare'],a:1},
{type:'mc',q:'“Sorry, we’re running late.” This means…',o:['We are exercising.','We will be late.','We are leaving early.'],a:1},
{type:'mc',q:'“She runs the front desk.” This means…',o:['She manages the front desk.','She moves fast near the desk.','She is leaving the desk.'],a:0}
]};

NEW.x12={title:'Words That Go Together',
lede:'English has thousands of word partnerships. Learn the partners, not just the words.',
body:`
<p>Why do Canadians say <b>heavy traffic</b> but not “strong traffic”? <b>Strong coffee</b> but not “powerful coffee”? <b>Make a mistake</b> but <b>do homework</b>? There’s no rule. Some words simply <b>go together</b>, because that’s what people say. These partnerships are called <b>collocations</b>.</p>
<div class="tw"><table><tr><th>Natural</th><th>Understandable, but sounds wrong</th></tr>
<tr><td>heavy rain · heavy traffic</td><td><span class="wrong">strong rain · big traffic</span></td></tr>
<tr><td>strong coffee · strong wind</td><td><span class="wrong">powerful coffee · big wind</span></td></tr>
<tr><td>take a photo · take a bus</td><td><span class="wrong">make a photo · go with bus</span></td></tr>
<tr><td>ask a question</td><td><span class="wrong">make a question · put a question</span></td></tr>
<tr><td>make a decision · make a mistake</td><td><span class="wrong">do a decision · do a mistake</span></td></tr>
<tr><td>pay attention</td><td><span class="wrong">give attention · make attention</span></td></tr>
<tr><td>catch a cold · have a fever</td><td><span class="wrong">take a cold</span></td></tr>
<tr><td>on the internet · on the phone</td><td><span class="wrong">in the internet · in the phone</span></td></tr>
<tr><td>I’m 30 (years old)</td><td><span class="wrong">I have 30 years</span></td></tr>
<tr><td>a tall building · a high price</td><td><span class="wrong">a high building · an expensive price</span></td></tr>
<tr><td>fast food · a quick question</td><td><span class="wrong">quick food · a fast question</span></td></tr></table></div>
<h3>Fixed pairs</h3>
<p>Some pairs always come in the same order: [[salt and pepper]], [[ladies and gentlemen]], [[black and white]], [[rock and roll]], [[back and forth]], [[now and then]], [[safe and sound]], [[pros and cons]]. “Pepper and salt” sounds very strange to Canadians.</p>
<h3>Collocations at work</h3>
<p>[[meet a deadline]] · [[take a break]] · [[call in sick]] · [[work overtime]] · [[apply for a job]] · [[get a raise]] · [[run a meeting]] · [[follow up]] · [[give notice]] (tell your employer you are leaving)</p>
<div class="box rule"><b>How to learn them</b><p>When you learn a new word, write down the <b>whole group</b> you heard it in. Don’t learn <i>decision</i>; learn <b>make a decision</b>. Don’t learn <i>rain</i>; learn <b>heavy rain</b>. And when you don’t know how to say something, ask: <b>“What’s the expression for…?”</b></p></div>
<div class="box tip"><b>Translation traps</b><p>Most collocation mistakes come from translating word by word from your first language. Turn on <b>&#127760; your language</b> at the top to see the most common traps for speakers of your language.</p></div>`,
ex:[
{type:'mc',q:'Choose the natural phrase.',o:['strong rain','heavy rain','big rain'],a:1},
{type:'mc',q:'Choose the natural phrase.',o:['make a photo','take a photo','do a photo'],a:1},
{type:'mc',q:'Choose the natural phrase.',o:['ask a question','make a question','do a question'],a:0},
{type:'mc',q:'Choose the natural sentence.',o:['I have 35 years.','I am 35 years.','I’m 35.'],a:2},
{type:'mc',q:'Choose the natural phrase.',o:['pepper and salt','salt and pepper'],a:1},
{type:'fill',q:'I found the address ___ the internet.',a:['on'],show:'on'},
{type:'fill',q:'I feel sick. I need to call in ___ today.',a:['sick'],show:'sick'},
{type:'fill',q:'We have to ___ the deadline on Friday. (finish on time)',a:['meet'],show:'meet'}
]};

NEW.x13={title:'Make, Do, Have, Get, Take',
lede:'Five small verbs that combine with hundreds of nouns.',
body:`
<p>These five verbs are in almost every English sentence, and each one has its own partners. Some patterns make sense; many you just have to memorize.</p>
<div class="tw"><table><tr><th>Verb</th><th>General idea</th><th>Common partners</th></tr>
<tr><td><b>make</b></td><td>create or produce something</td><td>a mistake · a decision · a plan · money · dinner · a list · an appointment · a phone call · friends · noise · sense · progress · an effort · your bed</td></tr>
<tr><td><b>do</b></td><td>perform a task or activity</td><td>homework · the dishes · laundry · the shopping · your best · a favour · business · research · a course · damage · well / badly</td></tr>
<tr><td><b>have</b></td><td>experience, eat or drink, own</td><td>breakfast / lunch · a coffee · fun · a good time · a party · a meeting · a problem · a cold · a headache · an idea · a question · a baby</td></tr>
<tr><td><b>get</b></td><td>receive, become, arrive</td><td>a job · a raise · an email · a ticket · married · sick · lost · tired · ready · better · home · to work · the joke (= understand it)</td></tr>
<tr><td><b>take</b></td><td>use, accept, do (some actions)</td><td>a bus / a taxi · a photo · a break · a test · a course · notes · medicine · a seat · time · a shower · a look · responsibility</td></tr></table></div>
<div class="box tip"><b>Make or do?</b><p>A rough guide: <b>make</b> = you create something that didn’t exist before (a plan, a cake, a mistake). <b>Do</b> = you perform a task or job (homework, dishes, laundry). It doesn’t always work — just use it as a starting point.</p></div>
<div class="box ca"><b>“Get” — the most useful verb in Canada</b><p>In speech, Canadians use <i>get</i> constantly:<br>[[Can I get a medium coffee?]] (order) · [[I don’t get it.]] (understand) · [[When do you get off work?]] (finish) · [[It’s getting cold.]] (become) · [[I’ll get the door.]] (open it) · [[How do I get to the library?]] (arrive / go)</p></div>`,
ex:[
{type:'fill',q:'Don’t worry if you ___ a mistake. Everybody does.',a:['make'],show:'make'},
{type:'fill',q:'I have to ___ the laundry tonight.',a:['do'],show:'do'},
{type:'fill',q:'We ___ a great time at the party.',a:['had'],show:'had'},
{type:'fill',q:'She just ___ a new job at the hospital.',a:['got'],show:'got'},
{type:'fill',q:'Let’s ___ a ten-minute break.',a:['take'],show:'take'},
{type:'fill',q:'Could you ___ me a favour?',a:['do'],show:'do'},
{type:'fill',q:'I need to ___ an appointment with the doctor.',a:['make'],show:'make'},
{type:'fill',q:'I usually ___ the bus to work.',a:['take'],show:'take'},
{type:'mc',q:'Someone tells a joke and you don’t understand it. You say…',o:['I don’t get it.','I don’t take it.','I don’t make it.'],a:0}
]};

NEW.x14={title:'See, Look, Watch · Say, Tell, Talk, Speak',
lede:'Two groups of verbs that learners mix up all the time.',
body:`
<h3>See, look, watch</h3>
<div class="tw"><table><tr><th>Verb</th><th>Idea</th><th>Examples</th></tr>
<tr><td><b>see</b></td><td>it comes to your eyes — you don’t try; also “understand” and “meet”</td><td>[[I can see the lake from my window.]] [[I see what you mean.]] [[I’m seeing the doctor tomorrow.]]</td></tr>
<tr><td><b>look (at)</b></td><td>you point your eyes on purpose; also “seem”</td><td>[[Look at this!]] [[I’m just looking, thanks.]] [[You look tired.]]</td></tr>
<tr><td><b>watch</b></td><td>look for a period of time at something that moves or changes; also “take care of”</td><td>[[We watched the game.]] [[Can you watch my bag?]] [[Watch out!]]</td></tr></table></div>
<p>With <b>look</b>: <i>look for</i> (try to find), <i>look up</i> (find information), <i>look after</i> (take care of), <i>look forward to</i> (be happy about something in the future).</p>
<h3>Say, tell, talk, speak</h3>
<div class="tw"><table><tr><th>Verb</th><th>Pattern</th><th>Examples</th></tr>
<tr><td><b>say</b></td><td>say + <b>words</b> (to someone)</td><td>[[What did the manager say?]] [[She said hi to me.]]</td></tr>
<tr><td><b>tell</b></td><td>tell + <b>person</b> + information</td><td>[[Tell me your address.]] [[He told us the meeting was cancelled.]]</td></tr>
<tr><td><b>talk</b></td><td>talk <b>to / with</b> someone <b>about</b> something</td><td>[[Can I talk to you for a minute?]] [[We talked about the schedule.]]</td></tr>
<tr><td><b>speak</b></td><td>languages; more formal talking</td><td>[[I speak Arabic and English.]] [[May I speak to the manager?]]</td></tr></table></div>
<p>Fixed phrases with <b>tell</b>: tell the truth · tell a lie · tell a story · tell a joke · tell the time · tell the difference.</p>
<div class="box tip"><b>Common mistakes</b><p><span class="wrong">He said me that…</span> → <span class="right">He <b>told</b> me that…</span> or <span class="right">He <b>said</b> that…</span><br><span class="wrong">Can you explain me?</span> → <span class="right">Can you explain <b>it to</b> me?</span><br><span class="wrong">I talk English.</span> → <span class="right">I <b>speak</b> English.</span></p></div>`,
ex:[
{type:'fill',q:'What are you ___ on TV tonight?',a:['watching'],show:'watching'},
{type:'fill',q:'___ at this photo!',a:['look','Look'],show:'Look'},
{type:'fill',q:'I ___ what you mean.',a:['see'],show:'see'},
{type:'fill',q:'Could you ___ my kids for an hour?',a:['watch'],show:'watch'},
{type:'fill',q:'She ___ me about her new job.',a:['told'],show:'told'},
{type:'fill',q:'What did the doctor ___?',a:['say'],show:'say'},
{type:'fill',q:'Can I ___ to you after the meeting?',a:['talk'],show:'talk'},
{type:'fill',q:'Do you ___ French?',a:['speak'],show:'speak'}
]};

NEW.x15={title:'Common Idioms',
lede:'Idioms are phrases whose meaning you can’t guess from the words.',
body:`
<p>If a coworker says “It’s a piece of cake,” there is no cake — it means <b>it’s easy</b>. Every language has idioms like this, and they can’t be translated word for word. You learn them as complete phrases.</p>
<div class="tw"><table><tr><th>Idiom</th><th>Meaning</th></tr>
<tr><td>[[It’s a piece of cake.]]</td><td>It’s very easy.</td></tr>
<tr><td>[[I’m feeling under the weather.]]</td><td>I feel a little sick.</td></tr>
<tr><td>[[It cost an arm and a leg.]]</td><td>It was very expensive.</td></tr>
<tr><td>[[Let’s call it a day.]]</td><td>Let’s stop working for today.</td></tr>
<tr><td>[[I’m getting the hang of it.]]</td><td>I’m learning how to do it.</td></tr>
<tr><td>[[Can you give me a hand?]]</td><td>Can you help me?</td></tr>
<tr><td>[[I’m all ears.]]</td><td>I’m listening carefully.</td></tr>
<tr><td>[[Let’s touch base next week.]]</td><td>Let’s talk again / check in next week.</td></tr>
<tr><td>[[Keep me in the loop.]]</td><td>Keep me informed.</td></tr>
<tr><td>[[We’re on the same page.]]</td><td>We understand and agree.</td></tr>
<tr><td>[[It’s not the end of the world.]]</td><td>It’s not a serious problem.</td></tr>
<tr><td>[[Better late than never.]]</td><td>It’s good that it happened, even if late.</td></tr>
<tr><td>[[Let me sleep on it.]]</td><td>Let me think about it until tomorrow.</td></tr>
<tr><td>[[I’m swamped.]]</td><td>I’m extremely busy.</td></tr>
<tr><td>[[That rings a bell.]]</td><td>That sounds familiar.</td></tr>
<tr><td>[[Break a leg!]]</td><td>Good luck! (before a performance or interview)</td></tr>
<tr><td>[[once in a blue moon]]</td><td>very rarely</td></tr>
<tr><td>[[It’s up in the air.]]</td><td>It’s not decided yet.</td></tr></table></div>
<div class="box ca"><b>Canadian expressions</b><p>[[double-double]] — a coffee with two creams and two sugars. [[a toonie / a loonie]] — the $2 / $1 coins. [[the May two-four]] — Victoria Day long weekend in May. [[give’r]] — give it full effort (casual). [[Beauty!]] — great! (casual). [[keener]] — a very eager person.</p></div>
<div class="box tip"><b>Understanding comes first</b><p>It’s more important to <b>understand</b> idioms than to use them. One wrong word inside an idiom sounds funny (“a piece of pie”). Use the ones you’re sure about; just recognize the rest.</p></div>`,
ex:[
{type:'mc',q:'“The test was a piece of cake.”',o:['There was cake.','The test was very easy.','The test was short.'],a:1},
{type:'mc',q:'“I’m a bit under the weather today.”',o:['I feel a little sick.','It’s raining.','I’m outside.'],a:0},
{type:'mc',q:'“Can you give me a hand with these boxes?”',o:['Can you help me?','Can you shake my hand?','Can you give me a glove?'],a:0},
{type:'mc',q:'Your manager says, “Keep me in the loop.” She wants you to…',o:['work faster','tell her what happens','stay in the office'],a:1},
{type:'mc',q:'“I’m swamped this week.”',o:['I’m on vacation.','I’m extremely busy.','I’m sick.'],a:1},
{type:'mc',q:'“The schedule for next month is still up in the air.”',o:['It’s finished.','It’s not decided yet.','It’s online.'],a:1}
]};

NEW.v1={title:'Classes, Training and Credentials',
lede:'Words for studying English and upgrading your skills in Canada.',
body:`
<h3>Learning English in Canada</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[LINC]]</td><td>Language Instruction for Newcomers to Canada — free government English classes for eligible permanent residents and some other newcomers</td></tr>
<tr><td>[[CLB]]</td><td>Canadian Language Benchmarks — the 12 levels used to measure English in Canada (CLB 4, CLB 7…)</td></tr>
<tr><td>[[ESL]]</td><td>English as a Second Language — classes offered by school boards, colleges and community centres</td></tr>
<tr><td>[[assessment]]</td><td>a test to find your level before you start classes</td></tr>
<tr><td>[[settlement agency]] / [[settlement worker]]</td><td>an organization / a person that helps newcomers with services, housing, jobs and paperwork</td></tr>
<tr><td>[[conversation circle]]</td><td>a free, informal group where people practise speaking — often at public libraries</td></tr></table></div>
<h3>Studying and training</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[college]]</td><td>In Canada: a school for practical and career programs (diplomas, certificates). Not the same as university.</td></tr>
<tr><td>[[university]]</td><td>A school for academic degrees (bachelor’s, master’s)</td></tr>
<tr><td>[[program]] / [[course]]</td><td>A full plan of study / one subject or class in it</td></tr>
<tr><td>[[full-time]] / [[part-time]]</td><td>Studying (or working) most of the week / only some of it</td></tr>
<tr><td>[[tuition]]</td><td>The money you pay for classes</td></tr>
<tr><td>[[apprenticeship]]</td><td>Learning a trade (electrician, plumber…) by working and studying at the same time</td></tr>
<tr><td>[[credentials]]</td><td>Your diplomas, degrees and licences</td></tr>
<tr><td>[[credential assessment]]</td><td>An official check of how your foreign education compares to Canadian education</td></tr>
<tr><td>[[bridging program]]</td><td>A program that helps internationally trained professionals work in their field in Canada</td></tr>
<tr><td>[[licensed]] / [[regulated profession]]</td><td>Jobs like nurse, engineer or electrician need a provincial licence</td></tr></table></div>
<h3>Useful classroom phrases</h3>
<ul class="lines"><li>[[Sorry, could you repeat that?]]</li>
<li>[[What page are we on?]]</li>
<li>[[When is this due?]]</li>
<li>[[Could you explain that another way?]]</li>
<li>[[How do you spell that?]]</li>
<li>[[Is there a break?]]</li>
<li>[[I missed the last class. What did I miss?]]</li></ul>

NEW.x17={title:'At Work',
lede:'Words and phrases for finding a job and working in Canada.',
body:`
<h3>Finding a job</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[résumé]] (“REZ-oo-may”)</td><td>A one- or two-page summary of your work and education. Canadian résumés don’t include a photo, age or marital status.</td></tr>
<tr><td>[[cover letter]]</td><td>A short letter explaining why you want the job</td></tr>
<tr><td>[[job posting]]</td><td>An advertisement for a job</td></tr>
<tr><td>[[apply for]] a job</td><td>Send your résumé to ask for the job</td></tr>
<tr><td>[[reference]]</td><td>A person (usually a former boss) who can describe your work</td></tr>
<tr><td>[[Canadian experience]]</td><td>Work you have done in Canada — many employers ask about it; volunteering counts</td></tr>
<tr><td>[[networking]]</td><td>Meeting people who can help you find work — many jobs are found this way</td></tr>
<tr><td>[[SIN]]</td><td>Social Insurance Number — you need it to work in Canada. Keep it private.</td></tr></table></div>
<h3>On the job</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[shift]]</td><td>Your working hours on one day: the day shift, the night shift</td></tr>
<tr><td>[[schedule]] (“SKED-jool”)</td><td>The plan of who works when</td></tr>
<tr><td>[[supervisor]] / [[manager]] / [[boss]]</td><td>The person in charge of you</td></tr>
<tr><td>[[coworker]] / [[colleague]]</td><td>A person you work with</td></tr>
<tr><td>[[overtime]]</td><td>Extra hours, often paid at a higher rate</td></tr>
<tr><td>[[pay stub]]</td><td>The paper or email showing your pay and deductions</td></tr>
<tr><td>[[deductions]]</td><td>Money taken from your pay: income tax, CPP (pension), EI (employment insurance)</td></tr>
<tr><td>[[call in sick]]</td><td>Phone work to say you are sick and can’t come</td></tr>
<tr><td>[[give notice]]</td><td>Tell your employer you are leaving — usually two weeks before</td></tr>
<tr><td>[[health and safety]]</td><td>Rules that protect workers — you have the right to refuse unsafe work</td></tr></table></div>
<h3>Useful phrases</h3>
<ul class="lines"><li>[[Could you show me how to do this?]]</li>
<li>[[Just to confirm — you want this done by Friday?]]</li>
<li>[[Sorry, I didn’t catch that. Could you say it again?]]</li>
<li>[[I’m not feeling well, so I won’t be able to come in today.]]</li>
<li>[[Could I switch shifts with someone on Saturday?]]</li>
<li>[[I’ve finished this. What would you like me to do next?]]</li></ul>
<div class="box ca"><b>Workplace culture</b><p>Canadian workplaces are usually informal: people use first names, even with managers. Asking questions is seen as a <b>good</b> thing — it shows you care about doing the job right. It’s better to ask than to guess.</p></div>`,
ex:[
{type:'mc',q:'What should you NOT put on a Canadian résumé?',o:['Your work experience','A photo and your age','Your education'],a:1},
{type:'mc',q:'“Can you cover my shift on Saturday?” means…',o:['Can you work my hours on Saturday?','Can you close the shop?','Can you pay me on Saturday?'],a:0},
{type:'mc',q:'You are sick and can’t go to work. You…',o:['call in sick','give notice','work overtime'],a:0},
{type:'fill',q:'You need a ___ (Social Insurance Number) to work in Canada.',a:['sin'],show:'SIN'},
{type:'say',q:'Practise these workplace phrases.',lines:['Could you show me how to do this?','Just to confirm — you want this done by Friday?','I’ve finished this. What would you like me to do next?']}
]};

 s1:'ਲਿਖੀ ਅਤੇ ਬੋਲੀ ਜਾਣ ਵਾਲੀ ਅੰਗਰੇਜ਼ੀ ਵੱਖਰੀਆਂ ਹਨ। ਇਹ ਕੋਰਸ ਬੋਲੀ ਜਾਣ ਵਾਲੀ ਅੰਗਰੇਜ਼ੀ ਸਿਖਾਉਂਦਾ ਹੈ।',

},

 g1:P('Punjabi has no articles, so a/an/the are often dropped: “I am going to office” → <i>I’m going to <b>the</b> office</i>; “He is doctor” → <i>He’s <b>a</b> doctor</i>.'),

 ar:{intro:'هذه أهم النقاط التي يحتاج إليها متحدثو العربية عند تعلّم الإنجليزية المحكية.',body:`

const T=(goal,warm,act,tip)=>({goal,warm,act,tip});
const TEACH={
 s1:T('Learners understand that spoken English has its own patterns (reductions, weak forms) that textbooks often skip.','Write a common question on the board in full (“What are you going to do?”). Ask learners how they think a Canadian says it. Then play the audio.','In pairs, learners list three things they find hardest about understanding Canadians. Collect them on the board and point to the units that cover each one.'),
 s4:T('Learners can find their level, choose their language notes, use the audio and print worksheets.','Ask: “When do you use English outside class?” to set personal goals.','Walk the class through one lesson on a projector: level filter, language picker, audio, exercises, notes box, print button.','Make sure every learner can hear the audio on their own device; some phones need an English voice installed.'),
 s2:T('Learners adopt a daily listen–repeat–record routine.','Ask how learners practised English before. Who has recorded themselves speaking?','Demonstrate shadowing with one sentence. Learners record themselves on their phones, listen back, then try again.','Some learners are shy about recording. Let them listen alone with earphones first.'),
 x1:T('Learners stop predicting pronunciation from spelling and start checking sounds.','Write <i>though, through, tough, cough</i>. Ask learners to read them aloud before hearing them.','Give pairs 10 words with tricky spelling (<i>women, said, busy, colonel, receipt…</i>). They guess, then check with a dictionary’s audio.'),
 x2:T('Learners feel voicing (buzz) and aspiration (puff of air), and avoid adding vowels to clusters.','Fingers on throats: “ssss–zzzz, ffff–vvvv”. Who feels the buzz?','Paper test in pairs: hold a strip of paper in front of the lips for <i>pin/bin, ten/den, coat/goat</i>. Then minimal-pair bingo with the pairs from the exercise.','Learners who add vowels before s-clusters (“estudent”) benefit from starting with a long hissing s: “sssss-tudent”.'),
 p1:T('Learners produce /θ/ and /ð/ with the tongue visible between the teeth.','Mirror check: everyone says <i>think</i> and looks for their tongue.','Minimal-pair drill (think/sink, three/tree, they/day): teacher reads one word, learners hold up 1 or 2 fingers. Then learners take turns being the teacher.','Learners often over-correct by adding TH to s-words. Contrast <i>sink/think</i> both ways.'),
 p2:T('Learners distinguish /w/ (rounded lips, no teeth) and /v/ (teeth on lip).','Ask learners to say <i>very well</i> slowly while watching a partner’s mouth.','Tongue twister race: “We visited Vancouver very early on Wednesday.” Pairs time each other and check lips/teeth.'),
 p5:T('Learners make a soft breathy /h/ and a non-trilled, non-tapped Canadian /r/.','Fog a cold window (or imagine it): that breath is English H.','Growl practice for R (“errrr”) → <i>red, right, very</i>. Then contrast <i>right/light, rock/lock</i> using the listening drill.'),
 k4:T('Learners recognize the flap T (<i>water</i>), the silent T (<i>twenty</i>) and the stopped T (<i>button</i>).','Ask learners how they say <i>water</i>. Play the Canadian version.','Learners listen to a short local radio clip or video and count the flap Ts they hear in 30 seconds.','Learners don’t need to produce the flap, but they must understand it.'),
 p6:T('Learners pronounce final consonants and choose /s z ɪz/ and /t d ɪd/ correctly.','Say <i>bag</i> and <i>back</i>. Ask: what is the difference? (vowel length + final sound)','Sorting game: cards with plural nouns and past verbs; groups sort them into three columns by ending sound.','Common error: adding a syllable to every -ed (“work-ed”).'),
 x5:T('Learners know the common silent letters, especially in high-frequency Canadian words (receipt, Wednesday).','Write <i>knife, listen, receipt, Wednesday</i>. Learners cross out the letters they think are silent.','Silent-letter hunt: learners find five words with silent letters in a flyer, menu or job posting.'),
 x3:T('Learners know the 16 vowel keywords and can match common words to them.','Show the keyword pictures. Learners say each keyword after you.','Card sort: groups sort 30 word cards under the 16 keywords. Then play the “Which vowel?” drill in the Practice lab on the projector.','The keyword chart is original to this course. Feel free to print it for the classroom wall.'),
 p3:T('Learners distinguish /iː/–/ɪ/ and /uː/–/ʊ/.','Hold up a picture of a sheep and a ship. Learners point as you say each word.','Minimal-pair listening (sheep/ship, leave/live, pool/pull), then partner dictation of short sentences: “Please leave / live here.”','Handle the “rude twin” pairs (sheet, beach, piece) matter-of-factly; adults appreciate the warning.'),
 p4:T('Learners distinguish /æ/, /ɛ/, /ʌ/ and /ɑ/.','Mouth shapes: wide jaw for <i>cat</i>, half-open for <i>bet</i>, relaxed for <i>cut</i>, wide and back for <i>cot</i>.','Four corners: label the room’s corners CAT, BED, CUP, CLOCK. Read words; learners walk to the right corner.'),
 x4:T('Learners glide in diphthongs and produce the r-vowels, especially /ɝ/.','Say <i>no</i> with and without the glide. Which sounds Canadian?','Rhyming pairs race: groups write as many rhymes as they can for <i>day, go, my, now, boy, her</i> in two minutes.','Watch <i>work/walk</i> and <i>word/ward</i> — common confusions with real consequences at work.'),
 p7:T('Learners recognize Canadian raising, the cot–caught merger and local place-name pronunciations.','Ask: have you heard Americans joke that Canadians say “aboot”?','Listening: play a short Canadian news clip. Learners note any words that sound different from what they expected.'),
 r1:T('Learners hear and produce word stress, and know the noun–verb and compound-noun patterns.','Say <i>computer</i> with the stress on each syllable. Which one is right? Why does it matter?','Stress clap: learners clap the rhythm of 20 everyday words (big clap on the stressed syllable). Then the noun/verb pairs in sentences.'),
 x6:T('Learners use suffixes and word families to predict stress.','Write <i>photograph, photographer, photographic</i>. Learners guess the stress of each.','Groups build word families (educate → education → educational) and mark stress. Check with dictionary audio.'),
 r3:T('Learners reduce unstressed vowels and function words to /ə/.','Write <i>banana</i>. Ask learners how many different vowel sounds they hear.','Weak-form dictation: read sentences at natural speed; learners write them. Discuss which words were hardest to hear.','<i>can/can’t</i> is a high-stakes pair — practise it in context.'),
 x7:T('Learners recognize and use common elided pronunciations.','Say <i>comfortable</i> two ways. Which one do Canadians use?','Learners mark the disappearing syllable in a list, then say each word in a sentence to a partner.'),
 r2:T('Learners stress content words and weaken function words.','Telegram game: write a long sentence; learners cross out every word that isn’t needed for meaning.','Pairs mark stressed words in short dialogues, then perform them. Others clap the stresses.'),
 r4:T('Learners keep a stress-timed beat and divide speech into thought groups.','Clap a steady beat. Learners chant the four “cats” lines from the lesson with the same clap speed.','Jazz chant: groups write a 4-line chant about their week with 3 beats per line and perform it.'),
 r5:T('Learners move sentence stress to show contrast or correction.','Say “I didn’t take your phone” five ways. Learners guess the hidden meaning each time.','Correction game: one learner says a wrong fact about a classmate (“You’re from Peru?”); the classmate corrects with contrastive stress (“No, I’m from <b>Chile</b>”).'),
 k1:T('Learners use contractions naturally in speech.','Read a short paragraph without contractions. Ask how it sounds (formal, robotic).','Learners rewrite and read aloud a short formal dialogue using contractions.','Remind learners that <i>should of</i> is always wrong in writing.'),
 k2:T('Learners understand <i>gonna, wanna, gotta, kinda</i> and use a few in casual speech.','Play or say: “Whaddaya wanna do?” Who understood?','Pairs make weekend plans using <i>gonna</i> and <i>wanna</i>, then report back.','<i>gonna</i> + noun is a common error (“I’m gonna the store”).'),
 k3:T('Learners link consonant–vowel, same consonants and vowel–vowel, and recognize t+y/d+y mixing.','Write <i>pick it up</i>. Ask: where are the word boundaries when we speak?','Learners mark links (‿) in five short phrases, then say them to a partner without pauses.'),
 k5:T('Learners recognize dropped H in unstressed pronouns and reduced <i>them, of, and</i>.','Say “Tell him I said hi” fast. How many words did you hear?','Dictation of 6 sentences with dropped H; learners write the full forms.'),
 x9:T('Learners decode reduced question starts in fast speech.','Say “Djeetyet?” at lunchtime. Who understood?','Listening race: say reduced questions at natural speed; teams write the full form. Then teams create their own for others.','Production is optional; comprehension is the goal.'),
 i1:T('Learners use a clear fall on statements, wh-questions and commands.','Hum the melody of “Where do you live?” and “I live in Toronto.”','Pairs interview each other with wh-questions, focusing on a clear fall at the end.'),
 i2:T('Learners rise on yes/no questions and list items, and fall at the end of choices.','Say “Tea or coffee?” two ways. Ask what each one means.','Café role-play: servers offer choices with up–down intonation; customers choose.'),
 i3:T('Learners form tag questions and understand rising vs falling tags and Canadian “eh?”.','Ask: “Nice weather today, isn’t it?” Learners reply.','Small-talk mingle: learners use three tag questions or “eh?” with different classmates.'),
 i4:T('Learners use polite request forms and a warm, varied pitch.','Say “Thank you” flat, then warm. Ask which one sounds friendly.','Learners turn direct commands into polite requests, then role-play at a service counter.'),
 x10:T('Learners hear emotion and sarcasm in tone of voice and adjust their own tone.','Say “That’s great” happily and sarcastically. Learners show thumbs up/down.','Emotion cards: learners say a neutral word (“Okay”, “Really”) with the emotion on their card; others guess.','Sarcasm can confuse newcomers; normalize asking “Are you joking?”'),
 x11:T('Learners understand Canadian norms for smiling, eye contact, handshakes, personal space and punctuality.','Ask: what is polite in your culture when you meet someone new?','Handshake practice in pairs with introductions; then a discussion comparing customs. Keep it respectful — no culture is “wrong”.','Be sensitive to learners who don’t shake hands for religious or personal reasons; the lesson presents alternatives.'),

const TEACH_PAGE=`<div class="kicker">For teachers</div><h2 class="title">Using Speak Easy in class</h2>
<p class="lede">A free, open course for adult ESL and LINC classes in Canada (CEFR A2–B2, roughly CLB 3–7). Use it on a projector, assign lessons for homework, or print worksheets.</p>
<div class="body">
<h3>Teacher mode</h3>
<p>Turn on <b>&#9881; Settings → Teacher mode</b>. Every lesson then shows a <b>Teacher notes</b> panel with a goal, a warm-up, a class activity, things to watch for, and an <b>answer key</b>. You also get a <b>Print answer key</b> button.</p>
<h3>Built-in tools for your class</h3>
<ul><li><b>&#127919; Placement quiz</b> — 15 questions that suggest a starting level (A2, B1 or B2).</li>
<li><b>&#10003; Unit tests</b> — a mixed test at the end of every unit, printable with an answer key.</li>
<li><b>&#128257; Review</b> — exercises a learner got wrong come back after 1, 3, 7 and 21 days.</li>
<li><b>&#127908; Record &amp; compare</b> — on speaking exercises, learners record themselves and hear the model followed by their own voice. Recordings never leave the device and are deleted when the page closes.</li>
<li><b>Dialogues</b> — the Life in Canada unit has two-voice conversations with a “hide the text” option for listening practice.</li>
<li><b>Light theme and text size</b> — in Settings. The light theme is much easier to read on a projector.</li></ul>
<h3>Printing worksheets</h3>
<p>Every lesson has a <b>&#128424; Print worksheet</b> button. It prints the lesson notes and all exercises in a clean, black-and-white layout with spaces for answers. Listening drills print as “teacher reads, learners circle” activities.</p>
<h3>Levels</h3>
<div class="tw"><table><tr><th>CEFR</th><th>Approx. CLB</th><th>Suggested units</th></tr>
<tr><td>A2</td><td>3–4</td><td>00, 01–02 (sounds), 07 (grammar), 09 (everyday Canada), 10 (life in Canada), 11</td></tr>
<tr><td>B1</td><td>5–6</td><td>03–06 (stress, rhythm, linking, voice), 08 (expressions)</td></tr>
<tr><td>B2</td><td>7+</td><td>Fast speech, focus stress, idioms, slang</td></tr></table></div>
<p>CLB equivalents are approximate; use your own assessment.</p>
<h3>Learners’ languages</h3>
<p>Learners can choose Arabic, Mandarin, French, Spanish, Punjabi, Tagalog or Russian. Each lesson then shows a one-line summary in that language, and key lessons show tips for speakers of that language. These notes are drafts — if you speak one of these languages and see a mistake, please report it so it can be fixed for everyone.</p>
<h3>Audio</h3>
<p>Audio uses the device’s built-in text-to-speech, so the course works offline and needs no downloads. Quality depends on the device: Chrome/Edge on Windows, Safari on iPhone and Android with Google’s English voices all work well. Computer voices are good for sounds and words but imperfect for emotion and rhythm — your own voice is still the best model.</p>
<h3>Privacy</h3>
<p>No accounts, no tracking, no data collection. Progress is stored only in each learner’s browser. This makes the course easy to use with any group and on shared computers (use <b>Settings → Erase all progress</b> at the end of a session on a shared machine).</p>
<h3>The vowel chart</h3>
<p>The course uses its own picture keywords for the vowel sounds of Canadian English:</p>
<div data-widget="vowelchart"></div>
<h3>Canadian English glossary</h3>
<p>The <a href="#/glossary">glossary</a> lists Canadian words, Canada/UK/US differences, figurative expressions, winter, food and civic vocabulary. Filter by category and press <b>Print this list</b> for a handout.</p>
<h3>Copy, adapt, share</h3>
<p>All lesson content is licensed <b>CC BY 4.0</b>: you may copy, print, translate and adapt it for any purpose, including in your own materials, as long as you credit “Speak Easy — Spoken Canadian English”.</p>
</div>`;

<h3>Support</h3>
<p>Speak Easy is free and always will be. If it helped you or your learners, you can <a href="https://buymeacoffee.com/a50443536g" target="_blank" rel="noopener noreferrer">buy me a coffee</a> — entirely optional. It’s a plain link: nothing from outside is loaded into this page, and nothing about your visit is reported anywhere.</p>

<p>Public edition 0.2 (translations are drafts under review).</p>

NEW.x18={title:'What Makes Canadian English Canadian',
lede:'British spelling, American words, and a few hundred words and expressions of its own.',
body:`
<p>Many newcomers learned British English at school, or American English from movies. Canadian English is a <b>mix of both</b> — plus words you won’t hear anywhere else.</p>
<div class="tw"><table><tr><th>Feature</th><th>Canada is like…</th><th>Examples</th></tr>
<tr><td>Spelling</td><td>mostly Britain</td><td>colour, centre, metre, cheque, travelled</td></tr>
<tr><td>Everyday words</td><td>mostly the US</td><td>[[elevator]], [[truck]], [[apartment]], [[gas]], [[sidewalk]], [[cart]]</td></tr>
<tr><td>Pronunciation</td><td>mostly the US (with its own vowels)</td><td>[[zed]], [[sorry|sore-ee]], [[about]]</td></tr>
<tr><td>Its own words</td><td>only Canada</td><td>[[toque]], [[loonie]], [[washroom]], [[double-double]], [[eavestrough]]</td></tr></table></div>
<h3>Canada, the UK and the US</h3>
<div class="tw"><table><tr><th>Canada</th><th>UK</th><th>US</th></tr>
<tr><td>[[elevator]]</td><td>lift</td><td>elevator</td></tr>
<tr><td>[[truck]]</td><td>lorry</td><td>truck</td></tr>
<tr><td>[[shopping cart]]</td><td>trolley</td><td>shopping cart</td></tr>
<tr><td>[[line-up]]</td><td>queue</td><td>line</td></tr>
<tr><td>[[washroom]]</td><td>toilet / loo</td><td>restroom</td></tr>
<tr><td>[[apartment]]</td><td>flat</td><td>apartment</td></tr>
<tr><td>[[first floor]] (street level)</td><td>ground floor</td><td>first floor</td></tr>
<tr><td>[[pants]]</td><td>trousers</td><td>pants</td></tr>
<tr><td>[[zed]]</td><td>zed</td><td>zee</td></tr>
<tr><td>[[cheque]]</td><td>cheque</td><td>check</td></tr></table></div>
<div class="box tip"><b>Two words to be careful with</b><p><b>Pants</b> in Canada means trousers — in the UK it means underwear. And don’t ask for a <b>rubber</b> when you mean an <b>eraser</b>: in Canada, “rubber” is slang for a condom.</p></div>
<h3>Not what it sounds like</h3>
<p>Many everyday expressions don’t mean what the words say:</p>
<ul><li>[[It’s nice and toasty in here.]] — warm and cosy. Nothing to do with toast!</li>
<li>[[I’m just killing time.]] — doing something while you wait. Nobody is hurt.</li>
<li>[[My phone’s dead.]] — the battery is empty.</li>
<li>[[You’re killing it!]] — you’re doing really well.</li>
<li>[[I’m starving.]] / [[I’m freezing.]] — very hungry / very cold. Canadians exaggerate a lot.</li>
<li>[[Cool.]] — OK, good. Not about temperature.</li></ul>
<h3>Hockey English</h3>
<p>Hockey is so important in Canada that hockey words are used in everyday life: [[deke]] (fake a move), [[stickhandle]] (handle a tricky situation), [[drop the gloves]] (start a serious fight or argument), [[a hat trick]] (three successes in a row).</p>
<div class="box ca"><b>Regional words</b><p>Canada is big, and words change across the country. A hoodie is a <b>bunnyhug</b> in Saskatchewan. A convenience store is a <b>dep</b> in Montreal. A summer house is a <b>cottage</b> in Ontario, a <b>cabin</b> out West, and a <b>camp</b> in northern Ontario. When you hear a new word, ask: [[Is that a local word?]] — people love to explain.</p></div>
<p>Find over 150 more words and expressions in the <a href="#/glossary">Canadian English glossary</a>.</p>`,
ex:[
{type:'mc',q:'You need to go to the 8th floor. In Canada, you take the…',o:['lift','elevator','escalator'],a:1},
{type:'mc',q:'At the grocery store, you put your food in a…',o:['trolley','cart','lorry'],a:1},
{type:'mc',q:'A big vehicle delivers furniture. In Canada, it’s a…',o:['lorry','truck','van-car'],a:1},
{type:'mc',q:'“Come sit by the fire — it’s nice and toasty.”',o:['It smells like toast.','It’s warm and cosy.','It’s too hot.'],a:1},
{type:'mc',q:'“I got to the appointment early, so I killed time at a coffee shop.”',o:['I wasted the coffee.','I did something while I waited.','I was very angry.'],a:1},
{type:'mc',q:'You’re in a mall. Where is the toilet? The most Canadian question is…',o:['Where is the loo?','Where’s the washroom?','Where is the WC?'],a:1},
{type:'mc',q:'Your coworker says: “Wow, you’re killing it this week!”',o:['You’re doing a great job.','You’re in trouble.','You’re very tired.'],a:0},
{type:'fill',q:'How do Canadians say the letter Z?',a:['zed'],show:'zed'},
{type:'fill',q:'A warm winter hat in Canada is a ___.',a:['toque','tuque'],show:'toque (also spelled tuque)'}
]};
