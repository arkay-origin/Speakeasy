<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speak Easy — Spoken Canadian English</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111318">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="A free, offline course in spoken Canadian English for adult learners. Pronunciation, grammar, vocabulary and conversation.">
<style>
:root{
  --bg:#111318; --panel:#171A21; --panel2:#1E222B; --panel3:#252A35; --line:#2A303C;
  --ink:#E7E9EF; --muted:#9BA2B3; --faint:#646B7D;
  --amber:#F2B53C; --amber-dim:rgba(242,181,60,.14);
  --teal:#4EC3B0; --teal-dim:rgba(78,195,176,.13);
  --maple:#E8645A; --maple-dim:rgba(232,100,90,.12);
  --violet:#A596F5; --violet-dim:rgba(165,150,245,.12);
  --ok:#5CC27E; --bad:#E8645A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:var(--ink)}
a{color:var(--teal)}
#app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
aside{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:40px}
.brand{padding:24px 22px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.brand h1{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.01em;line-height:1.15}
.rhythm{display:flex;gap:6px;align-items:center;margin:8px 0 6px}
.rhythm i{display:block;border-radius:50%;background:var(--amber)}
.rhythm i.b{width:11px;height:11px}.rhythm i.s{width:5px;height:5px;background:var(--faint)}
.brand .sub{font-size:12.5px;color:var(--muted)}
.prog{padding:14px 22px;border-bottom:1px solid var(--line)}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.bar{height:6px;background:var(--panel3);border-radius:3px;margin-top:8px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));width:0;transition:width .4s}
nav .navlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 22px;font-size:14px;color:var(--muted);border-left:3px solid transparent}
nav .navlink:hover{background:var(--panel2);color:var(--ink)}
nav .navlink.on{color:var(--ink);border-left-color:var(--teal);background:var(--panel2)}
.unit{border-top:1px solid var(--line)}
.unit>.uh{display:flex;width:100%;text-align:left;padding:13px 22px 11px;gap:10px;align-items:baseline}
.unit>.uh .num{font-family:var(--mono);font-size:11px;color:var(--amber);min-width:22px}
.unit>.uh .t{flex:1;font-weight:600;font-size:14.5px}
.unit>.uh .c{font-family:var(--mono);font-size:11px;color:var(--faint)}
.unit>.uh:hover .t{color:var(--amber)}
.unit .ls{display:none;padding-bottom:8px}
.unit.open .ls{display:block}
.ls button{display:flex;gap:10px;width:100%;text-align:left;padding:6px 22px 6px 30px;font-size:13.5px;color:var(--muted);line-height:1.4;border-left:3px solid transparent}
.ls button:hover{color:var(--ink);background:var(--panel2)}
.ls button.on{color:var(--ink);border-left-color:var(--amber);background:var(--panel2)}
.ls .dot{flex-shrink:0;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);margin-top:5px}
.ls button.done .dot{background:var(--ok);border-color:var(--ok)}

/* ---------- main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--bar,rgba(17,19,24,.92));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .menu{display:none;font-size:20px;padding:4px 8px}
.topbar .crumb{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--panel)}
.pill:hover{color:var(--ink);border-color:var(--faint)}
.pill.on{color:var(--bg);background:var(--teal);border-color:var(--teal)}
.pill.rubtn.on{background:var(--violet);border-color:var(--violet)}
#view{padding:34px 28px 90px;max-width:800px;width:100%;margin:0 auto}

/* ---------- typography in lessons ---------- */
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
h2.title{font-family:var(--serif);font-size:34px;line-height:1.15;font-weight:600;margin:6px 0 10px}
.lede{color:var(--muted);font-size:16.5px;margin-bottom:6px}
.ru{display:none;color:var(--violet)}
body.ru-on .ru{display:inline}
body.ru-on div.ru,body.ru-on p.ru{display:block}
p.ru.sum{font-size:14.5px;border-left:2px solid var(--violet);padding-left:12px;margin:10px 0 4px}
.body{margin-top:22px}
.body h3{font-family:var(--serif);font-size:22px;font-weight:600;margin:30px 0 8px}
.body h4{font-size:15px;font-weight:700;margin:20px 0 6px;color:var(--teal);letter-spacing:.02em}
.body p{margin:10px 0}
.body ul,.body ol{margin:10px 0 10px 22px}
.body li{margin:5px 0}
.body code,.mono{font-family:var(--mono);font-size:.92em;background:var(--panel2);padding:1px 6px;border-radius:4px}
.st{color:var(--amber);font-weight:800;letter-spacing:.02em}
.sch{color:var(--teal);font-family:var(--mono)}
.lk{color:var(--teal);font-weight:700}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1.5px}
.right{color:var(--ok)}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.box{border:1px solid var(--line);border-left:4px solid var(--teal);background:var(--panel);border-radius:8px;padding:12px 16px;margin:16px 0}
.box>b:first-child{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.box.tip{border-left-color:var(--teal)}.box.tip>b:first-child{color:var(--teal)}
.box.ca{border-left-color:var(--maple);background:linear-gradient(90deg,var(--maple-dim),var(--panel) 40%)}.box.ca>b:first-child{color:var(--maple)}
.box.rus{border-left-color:var(--violet);background:linear-gradient(90deg,var(--violet-dim),var(--panel) 40%)}.box.rus>b:first-child{color:var(--violet)}
.box.rule{border-left-color:var(--amber);background:linear-gradient(90deg,var(--amber-dim),var(--panel) 40%)}.box.rule>b:first-child{color:var(--amber)}
.box p:first-of-type{margin-top:0}.box p:last-child{margin-bottom:0}

/* say chips */
.say{display:inline;cursor:pointer;padding:1px 4px 1px 6px;margin:0 1px;border-radius:5px;background:var(--teal-dim);border-bottom:1px dashed rgba(78,195,176,.5);text-align:left;line-height:1.7}
.say:hover{background:rgba(78,195,176,.24)}
.say::after{content:"\25B8";font-size:.72em;color:var(--teal);margin-left:5px;vertical-align:1px}
.say.playing{background:rgba(78,195,176,.35)}
.lines{list-style:none;margin:12px 0!important}
.lines li{margin:8px 0!important}

/* ---------- exercises ---------- */
.practice{margin-top:44px;border-top:1px solid var(--line);padding-top:24px}
.practice>h3{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:4px}
.practice .score{font-size:13px;color:var(--muted);margin-bottom:12px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:14px 0}
.ex .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.ex .q{margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;padding:9px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:15px}
.opt:hover{border-color:var(--faint)}
.opt.ok{border-color:var(--ok);background:rgba(92,194,126,.13)}
.opt.no{border-color:var(--bad);background:rgba(232,100,90,.12)}
.why{margin-top:10px;font-size:14.5px;color:var(--muted);border-left:2px solid var(--faint);padding-left:10px}
.why.ok{border-color:var(--ok)}.why.no{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.inp:focus{outline:none;border-color:var(--teal)}
.inp.ok{border-color:var(--ok)}.inp.no{border-color:var(--bad)}
.btn{padding:9px 15px;border-radius:8px;background:var(--panel3);border:1px solid var(--line);font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--teal);color:#0d1513;border-color:var(--teal);font-weight:600}
.btn.amb{background:var(--amber);color:#1a1405;border-color:var(--amber);font-weight:600}
.btn.sm{padding:5px 10px;font-size:13px}
.ans{margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:8px;font-size:15px}
.syls{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:8px 0}
.syl{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);font-size:16px;font-family:var(--mono)}
.syl:hover{border-color:var(--amber)}
.syl.ok{border-color:var(--ok);background:rgba(92,194,126,.15);color:var(--amber);font-weight:800}
.syl.no{border-color:var(--bad);background:rgba(232,100,90,.12)}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding:6px 0}
.srow:last-child{border-bottom:0}
.lsn{width:34px;height:34px;border-radius:50%;background:var(--teal-dim);color:var(--teal);font-size:14px;flex-shrink:0}
.lsn:hover{background:rgba(78,195,176,.3)}
.pairgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.pairgrid span{padding:4px 6px;background:var(--panel2);border-radius:6px;font-size:14px}
.drill{margin-top:10px;padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.drill .big{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.drill .big .opt{min-width:120px;text-align:center;font-size:18px}
.drill .meta{font-size:13px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{margin-top:7px;accent-color:var(--teal);width:17px;height:17px;flex-shrink:0}

/* lesson foot */
.notes{margin-top:34px}
.notes label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes textarea{width:100%;min-height:90px;margin-top:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);resize:vertical}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:26px;flex-wrap:wrap}
.foot .done-btn.is{background:var(--ok);border-color:var(--ok);color:#0b160f;font-weight:600}

/* home */
.hero{padding:6px 0 20px}
.hero h2{font-family:var(--serif);font-size:40px;line-height:1.1;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:18px 0}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.card:hover{border-color:var(--faint)}
.card .n{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em}
.card .t{font-family:var(--serif);font-size:19px;font-weight:600;margin:3px 0 4px;line-height:1.2}
.card .d{font-size:13.5px;color:var(--muted);line-height:1.45}
.card .bar{margin-top:12px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:baseline;font-size:15px;margin:10px 0}
.legend>span:nth-child(odd){font-family:var(--mono);text-align:right}

/* lab */
.tool{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}
.tool h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:4px}
.tool .d{color:var(--muted);font-size:14.5px;margin-bottom:12px}
textarea.inp{width:100%;min-height:80px;resize:vertical}
select.inp{min-width:0}
input[type=range]{accent-color:var(--teal);flex:1}

/* sound alphabet */
.epa{font-family:var(--mono);color:var(--amber);font-size:.92em;white-space:nowrap;font-weight:600}
.ipa{color:var(--faint);font-weight:400;font-size:.86em;margin-left:5px}
body.ipa-off .ipa{display:none}
.vc{white-space:nowrap}
.vc::after{content:none!important}
.vc i,.sw{display:inline-block;width:.9em;height:.9em;border-radius:50%;margin-right:6px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.vchart{margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vrow{display:grid;grid-template-columns:44px 118px 150px 1fr;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow:nth-child(odd){background:var(--panel)}
.vrow .dot{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.vrow .cw{font-weight:700}
.vrow .exs{display:flex;flex-wrap:wrap;gap:4px}
.cpal{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{display:inline-flex;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);font-size:14px}
.cbtn:hover{border-color:var(--faint)}
.cbtn.ok{border-color:var(--ok);background:rgba(92,194,126,.15)}
.cbtn.no{border-color:var(--bad);background:rgba(232,100,90,.12);opacity:.7}
.crow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding:8px 0}
.crow:last-child{border-bottom:0}
.crow .w{min-width:110px;font-size:17px}
.bigword{font-family:var(--serif);font-size:34px;margin:6px 0 4px}
.srcb{display:inline-block;font-size:12.5px;color:var(--violet);border:1px solid rgba(165,150,245,.35);background:var(--violet-dim);padding:3px 10px;border-radius:999px;margin:0 0 8px}
.part{padding:16px 22px 6px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--line)}
.partlbl{grid-column:1/-1;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.notes3{display:flex;align-items:flex-end;gap:3px;height:54px;margin:8px 0}
@media (max-width:640px){.vrow{grid-template-columns:34px 1fr;row-gap:4px}.vrow .ep,.vrow .exs{grid-column:2}}

/* public: languages, levels, teacher, print */
html[data-l1=ru] .ru{display:inline}html[data-l1=ru] td.ru,html[data-l1=ru] th.ru{display:table-cell}
.langpill{padding:3px 6px 3px 11px}
.langpill select{background:transparent;border:0;color:inherit;font:inherit;font-size:13px;padding:3px 2px;cursor:pointer;max-width:120px}
.langpill select option{background:var(--panel);color:var(--ink)}
.langpill.on{background:var(--violet);border-color:var(--violet);color:#15121f}
.l1sum{font-size:15px;color:var(--violet);border-left:2px solid var(--violet);padding:2px 12px;margin:10px 0 4px;unicode-bidi:plaintext}
.l1sum[dir=rtl]{border-left:0;border-right:2px solid var(--violet)}
.l1box{border-left-color:var(--violet)!important;background:linear-gradient(90deg,var(--violet-dim),var(--panel) 40%)!important}
.l1box>b:first-child{color:var(--violet)!important}
.lv{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.ls .lv{margin-left:auto;align-self:center}
.lvfilter{padding:10px 22px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.lvfilter button{padding:3px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-family:var(--mono)}
.lvfilter button.on{background:var(--teal);border-color:var(--teal);color:#0d1513}
.ls button.hid{display:none}
.teach{border:1px solid rgba(242,181,60,.45);background:var(--amber-dim);border-radius:10px;padding:14px 16px;margin:16px 0}
.teach>summary{cursor:pointer;font-weight:700;color:var(--amber);font-size:14px;letter-spacing:.04em}
.teach h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:12px 0 4px}
.teach ol{margin:4px 0 4px 20px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.vrow{grid-template-columns:44px 40px 130px 90px 1fr}
.vrow .emo{font-size:24px;line-height:1}
.cbtn .emo{margin-right:5px}
.vc .emo{margin-right:3px}
#printArea{display:none}
@media (max-width:640px){.vrow{grid-template-columns:34px 34px 1fr}.vrow .ep,.vrow .exs{grid-column:3}}
@media print{
  @page{margin:16mm}
  body{background:#fff!important;color:#000!important;font-size:12pt}
  #app,#toast,.modal,.scrim{display:none!important}
  #printArea{display:block!important;color:#000;font-family:Georgia,"Times New Roman",serif;line-height:1.5}
  #printArea h1{font-size:20pt;margin:0 0 2pt}
  #printArea .pmeta{font-size:9pt;color:#555;margin-bottom:10pt;border-bottom:1px solid #999;padding-bottom:6pt}
  #printArea h2{font-size:14pt;margin:14pt 0 6pt}
  #printArea h3{font-size:12.5pt;margin:12pt 0 4pt}
  #printArea table{width:100%;border-collapse:collapse;margin:6pt 0;font-size:10.5pt}
  #printArea th,#printArea td{border:1px solid #aaa;padding:3pt 5pt;color:#000;vertical-align:top}
  #printArea th{text-transform:none;letter-spacing:0;font-size:10pt;background:#eee}
  #printArea .box{border:1px solid #999;border-left:3pt solid #555;padding:5pt 8pt;margin:6pt 0;background:none!important;border-radius:0}
  #printArea .box>b:first-child{color:#000!important;font-size:9pt}
  #printArea .st{color:#000;text-decoration:underline;font-weight:800}
  #printArea .say{background:none;border:0;padding:0}
  #printArea .say::after{content:none}
  #printArea .wrong,#printArea .right,#printArea .epa,#printArea .lk,#printArea .sch{color:#000}
  #printArea .pq{margin:9pt 0;page-break-inside:avoid}
  #printArea .pq .n{font-weight:700;margin-right:4pt}
  #printArea .po{margin:2pt 0 2pt 18pt}
  #printArea .line{border-bottom:1px solid #000;height:18pt;margin:4pt 0}
  #printArea .lv{color:#000;border-color:#000}
  #printArea .vchart{border:1px solid #aaa;border-radius:0}
  #printArea .vrow{background:none!important;border-bottom:1px solid #ccc}
  #printArea .pfoot{margin-top:16pt;font-size:8.5pt;color:#555;border-top:1px solid #999;padding-top:4pt}
}

/* glossary */
.gsearch{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:16px;margin:10px 0}
.gsearch:focus{outline:none;border-color:var(--teal)}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.gchips button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--panel)}
.gchips button.on{background:var(--teal);border-color:var(--teal);color:#0d1513}
.gcount{font-size:13px;color:var(--faint);margin-bottom:6px}
.gitem{border-bottom:1px solid var(--line);padding:12px 2px}
.gitem .gt{font-size:17px;font-weight:700}
.gitem .gc{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-left:8px;white-space:nowrap}
.gitem .gm{margin:3px 0}
.gitem .gex{color:var(--muted);font-size:15px}

OLD.push({id:'u0',title:'Start Here',desc:'How spoken English is different from written English, and how to use this course.',ru:'Чем устная речь отличается от письменной, и как работать с курсом.',lessons:[

{id:'s1',title:'Two Englishes',
lede:'You already speak English well enough to have a conversation. Now we make it sound natural.',
ru:'В английском как будто два языка: письменный и устный. В школе обычно учат письменный. Этот курс — про устный.',
body:`
<p>Most textbooks teach <b>written English</b>: every word clear, every sentence complete. But people do not talk like a textbook. Listen to how a Canadian really says this question:</p>
<table><tr><th>Written</th><th>Spoken</th></tr>
<tr><td>What are you going to do?</td><td>[[«WHAD»·ya gonna «DO»?|whaddaya gonna do?]]</td></tr>
<tr><td>Do you want to get something to eat?</td><td>[[ya «WAN»na get something to «EAT»?|you wanna get something to eat?]]</td></tr>
<tr><td>I do not know.</td><td>[[I dun«NO».|I dunno.]]</td></tr></table>
<p>Seven written words became about four spoken “beats.” This is not lazy or wrong. It is <b>how English works</b> when people speak. If you only learn the written version, two things happen:</p>
<ul><li>You understand your teacher, but you miss what coworkers and neighbours say in a hurry.</li>
<li>You sound correct, but a bit like a robot or a news reader.</li></ul>
<div class="box rule"><b>The big idea</b><p>In spoken English, the <b>important words</b> are loud and clear. The <b>small words</b> get short, quiet and squeezed together. Almost everything in this course comes back to this one idea.</p></div>
<h3>What this course covers</h3>
<ol><li><b>Sounds</b> — the consonants and vowels of English, and the ones learners find hardest.</li>
<li><b>Word stress</b> — which syllable is strong, and the tiny sound /ə/.</li>
<li><b>Rhythm</b> — strong words, weak words, and speaking in groups.</li>
<li><b>Linking &amp; fast speech</b> — how words shrink and join.</li>
<li><b>Voice &amp; body language</b> — intonation, tone, and Canadian body language.</li>
<li><b>Grammar for speaking</b> — articles, tenses and questions you use every day.</li>
<li><b>Expressions</b> — words that go together, phrasal verbs and idioms.</li>
<li><b>Everyday Canada</b> — work, money, numbers, technology, small talk.</li>
<li><b>Conversation skills</b> — asking for help, keeping a conversation going, being polite.</li></ol>
<div class="box tip"><b>Two goals, not one</b><p>Your first goal is to <b>understand</b> fast, natural speech. Your second goal is to <b>speak</b> clearly. You do not have to copy every reduction. But you must recognize them, because Canadians will use them with you every day.</p></div>`,
ex:[
{type:'mc',q:'Which statement matches the big idea of spoken English?',o:['Every word should be said clearly and equally.','Important words are strong; small words become short and quiet.','Speaking fast is always better.'],a:1,why:'Strong important words + weak small words = the rhythm of English.'},
{type:'mc',q:'A coworker says [[«WHAD»·ya «WAN»na «DO»?|whaddaya wanna do?]] What did they say?',o:['What do you want to do?','Why do you want two?','What did you do?'],a:0,why:'“What do you” → <i>whaddaya</i>, “want to” → <i>wanna</i>.'},
{type:'reveal',q:'Think of one time when you understood the words in a textbook, but not a real person speaking. What made it hard?',a:'Usual answers: they spoke fast, the words were joined together, small words disappeared, or they used slang. This course trains exactly those things.'}
]},

{id:'s2',title:'How to Practise',
lede:'Short practice every day beats long practice once a week.',
ru:'Лучше заниматься понемногу каждый день. Слушайте, повторяйте вслух, записывайте себя.',
body:`
<h3>The listen–repeat method (shadowing)</h3>
<p>Pronunciation is a physical skill, like a sport. Reading about it is not enough — your mouth needs practice. For every example in this course:</p>
<ol><li><b>Listen</b> — tap the phrase. Listen two or three times.</li>
<li><b>Repeat out loud</b> — copy the rhythm first, then the sounds.</li>
<li><b>Shadow</b> — play it again and speak <i>at the same time</i> as the voice.</li>
<li><b>Record yourself</b> — use your phone’s voice recorder. Compare with the course audio. This feels strange at first, but it is the fastest way to improve.</li></ol>
<p>Try it now: [[Nice to meet you.]] &nbsp; [[Where are you from?]] &nbsp; [[I’m from Manila, in the Philippines.]]</p>
<div class="box tip"><b>Slow, then normal</b><p>Use the <b>&#128034; Slow</b> button when a phrase is new. Then turn it off and practise at normal speed. Natural rhythm only appears at normal speed.</p></div>
<h3>A good weekly routine</h3>
<table><tr><th>When</th><th>What</th></tr>
<tr><td>Every day, 15–20 min</td><td>One lesson section, or review. Say every example out loud.</td></tr>
<tr><td>Every day, 5 min</td><td>Practice lab: the sound trainer or numbers.</td></tr>
<tr><td>A few times a week</td><td>Watch a Canadian or American show or YouTube video <b>with English subtitles</b>. Pause and repeat one sentence you like.</td></tr>
<tr><td>Whenever you can</td><td>Talk with real people. Mistakes are normal and fine.</td></tr></table>
<div class="box tip"><b>Typical for adult learners</b><p>Many adults first learned English by reading, grammar and translation. That builds good grammar and vocabulary — you probably have that already. What is usually missing is <b>listening to real speech</b> and <b>speaking out loud a lot</b>. Focus your time there.</p></div>
<h3>Use your notes</h3>
<p>Every lesson has a <b>My notes</b> box at the bottom. Write new words, questions, or sentences you want to practise. Your notes are saved on this device.</p>`,

{type:'mc',q:'What is “shadowing”?',o:['Reading a text silently many times.','Speaking at the same time as a recording, copying it.','Writing down everything you hear.'],a:1}

OLD.push({id:'u1',title:'Stress & Rhythm',desc:'The beat of English: strong syllables, weak syllables, and the schwa.',ru:'Ритм английского: ударные и безударные слоги, звук «шва».',lessons:[

{id:'r1',title:'Word Stress',
lede:'Every English word with two or more syllables has one strong syllable.',
ru:'В каждом слове из двух и более слогов есть один ударный слог. Неправильное ударение мешает пониманию сильнее, чем неправильный звук.',
body:`
<p>A <b>syllable</b> is a beat of a word: <i>com · pu · ter</i> has three. One syllable is <b>stressed</b>. A stressed syllable is:</p>
<ul><li><b>longer</b></li><li><b>louder</b></li><li><b>higher</b> in pitch</li><li>clear — the vowel keeps its full sound</li></ul>
<p>Listen: [[com·«PU»·ter|computer]] &nbsp; [[«TEA»·cher|teacher]] &nbsp; [[ba·«NA»·na|banana]] &nbsp; [[«CA»·na·da|Canada]] &nbsp; [[to·«MOR»·row|tomorrow]]</p>
<div class="box rule"><b>Why it matters</b><p>English listeners recognize words by their <b>stress pattern</b> first. If you say a sound a little wrong, people usually still understand. If you put the stress in the wrong place, they often do not. Example: say “com-pu-<b>TER</b>” and many people will not recognize the word.</p></div>
<div class="box tip"><b>Stress in other languages</b><p>Every language handles stress differently. In French, the stress is almost always at the end of a word group. In Spanish and Punjabi it follows fairly regular rules. Mandarin uses tones instead. In English, stress can fall on <b>any</b> syllable, so you must learn it with each word.</p></div>
<h3>Helpful patterns</h3>
<p>English stress is not random. These patterns work most of the time:</p>
<h4>1. Two-syllable nouns and adjectives: usually the first syllable</h4>
<p>[[«TA»·ble|table]] &nbsp; [[«PEN»·cil|pencil]] &nbsp; [[«STU»·dent|student]] &nbsp; [[«HAP»·py|happy]] &nbsp; [[«WIN»·ter|winter]]</p>
<h4>2. Two-syllable verbs: usually the second syllable</h4>
<p>[[be·«GIN»|begin]] &nbsp; [[re·«LAX»|relax]] &nbsp; [[for·«GET»|forget]] &nbsp; [[de·«CIDE»|decide]] &nbsp; [[ex·«PLAIN»|explain]]</p>
<h4>3. Same spelling, different stress</h4>
<p>Some words are a noun <i>and</i> a verb. The stress tells you which:</p>
<div class="tw"><table><tr><th>Noun (1st)</th><th>Verb (2nd)</th></tr>
<tr><td>[[a «RE»·cord|a record]]</td><td>[[to re·«CORD»|to record]]</td></tr>
<tr><td>[[a «PRE»·sent (gift)|a present]]</td><td>[[to pre·«SENT»|to present]]</td></tr>
<tr><td>[[a «PRO»·ject|a project]]</td><td>[[to pro·«JECT»|to project]]</td></tr>
<tr><td>[[an «OB»·ject|an object]]</td><td>[[to ob·«JECT»|to object]]</td></tr>
<tr><td>[[an «IN»·crease|an increase]]</td><td>[[to in·«CREASE»|to increase]]</td></tr></table></div>
<h4>4. Endings that move the stress</h4>
<p>With <b>-tion, -sion, -ic, -ical, -ity</b>, the stress falls on the syllable <b>just before</b> the ending:</p>
<p>[[in·for·«MA»·tion|information]] &nbsp; [[de·«CI»·sion|decision]] &nbsp; [[e·co·«NO»·mic|economic]] &nbsp; [[e·lec·«TRI»·ci·ty|electricity]] &nbsp; [[u·ni·«VER»·si·ty|university]]</p>
<p>Notice how the stress moves inside a word family: [[«PHO»·to·graph|photograph]] → [[pho·«TO»·gra·pher|photographer]] → [[pho·to·«GRA»·phic|photographic]].</p>
<h4>5. Compound nouns: stress the first part</h4>
<p>[[«LAP»·top|laptop]] &nbsp; [[«KEY»·board|keyboard]] &nbsp; [[«PASS»·word|password]] &nbsp; [[«CLASS»·room|classroom]] &nbsp; [[«BUS» stop|bus stop]]</p>
<p>Compare: a [[«GREEN»·house|greenhouse]] (a glass building for plants) and a [[green «HOUSE»|green house]] (a house painted green).</p>
<div class="box tip"><b>How to check stress</b><p>Online dictionaries (Cambridge, Oxford, Merriam-Webster) mark stress with a small line <code>ˈ</code> before the stressed syllable: <code>/kəmˈpjuːtər/</code>. When you learn a new word, learn its stress too.</p></div>`,
ex:[
{type:'stress',items:[['ho','tel',1],['win','dow',0],['re','peat',1],['pro','fes','sor',1],['af','ter','noon',2],['ba','na','na',1],['Ca','na','da',0],['im','por','tant',1]]},
{type:'stress',q:'Endings: stress goes just before <b>-tion / -ic / -ity</b>.',items:[['e','du','ca','tion',2],['sci','en','tif','ic',2],['ac','tiv','i','ty',1],['con','ver','sa','tion',2]]},
{type:'mc',q:'“I want to <u>record</u> a video.” Where is the stress in <i>record</i> here?',o:['[[«RE»·cord|record, noun]]','[[re·«CORD»|to record]]'],a:1,why:'It is a verb (to record), so the stress is on the second syllable.'},
{type:'mc',q:'Which is a compound noun with stress on the FIRST part?',o:['a black «BOARD» (a board that is black)','a «BLACK»·board (in a classroom)'],a:1,why:'Compound nouns stress the first part: «BLACK»board, «LAP»top, «PASS»word.'}
]},

{id:'r2',title:'Sentence Stress: Content vs Function Words',
lede:'In a sentence, the important words are strong and the small grammar words are weak.',
ru:'Во фразе ударение падает на смысловые слова (существительные, глаголы, прилагательные). Служебные слова (артикли, предлоги, местоимения) произносятся слабо и быстро.',
body:`
<p>Words in a sentence are not equal. There are two groups:</p>
<div class="tw"><table><tr><th>Content words — STRONG</th><th>Function words — weak</th></tr>
<tr><td>Nouns: <i>work, Maria, phone</i><br>Main verbs: <i>go, eat, study</i><br>Adjectives: <i>cold, big, new</i><br>Adverbs: <i>quickly, never, often</i><br>Question words: <i>what, where, why</i><br>Negatives: <i>not, can’t, don’t, no</i><br>Numbers: <i>three, ten</i></td>
<td>Articles: <i>a, an, the</i><br>Prepositions: <i>to, at, for, of, in</i><br>Pronouns: <i>I, you, he, it, them</i><br>Helping verbs: <i>do, can, will, have, is, are</i><br>Conjunctions: <i>and, but, or</i></td></tr></table></div>
<p>Content words carry the <b>meaning</b>. If you only heard the strong words, you would still understand:</p>
<p>[[I «WANT» to «GO» to the «STORE».]] → <b>WANT · GO · STORE</b></p>
<p>[[«WHERE» did you «PUT» my «PHONE»?]] → <b>WHERE · PUT · PHONE</b></p>
<p>[[She «DOESN’T» «LIKE» «HOCK»ey.]] → <b>DOESN’T · LIKE · HOCKEY</b></p>
<div class="box rule"><b>Rule</b><p>Stress the content words. Make the function words <b>short, quiet and fast</b> — squeeze them between the strong words.</p></div>
<h3>Small words have weak forms</h3>
<p>Because function words are not stressed, their vowels change to a short “uh” sound (the schwa — next lesson). So <i>to</i> sounds like “tə,” <i>for</i> like “fər,” <i>and</i> like “ən.” Listen: [[«BREAD» and «BUT»ter|bread and butter]] → “bread-n-butter.”</p>
<div class="box tip"><b>Exception: the end of a sentence</b><p>A function word at the very end of a sentence often keeps its full form: [[«WHERE» are you «FROM»?|where are you from?]] — <i>from</i> is clear here. And “Yes, I <b>can</b>.” uses the full, strong <i>can</i>.</p></div>
<div class="box tip"><b>A common habit</b><p>Many learners give every word the same weight: “I — WANT — TO — GO — TO — THE — STORE.” It sounds very careful and slow, like a robot. Practise making the small words almost disappear.</p></div>`,
ex:[
{type:'mc',q:'Which words are stressed? “The bus leaves at six.”',o:['The · at','BUS · LEAVES · SIX','The · bus · at · six'],a:1,why:'Noun (bus), main verb (leaves), number (six) are content words.'},
{type:'mc',q:'Which words are stressed? “Can you help me with my homework?”',o:['CAN · YOU · ME','HELP · HOMEWORK','YOU · WITH · MY'],a:1,why:'“Can, you, me, with, my” are function words. Only HELP and HOMEWORK carry meaning.'},
{type:'mc',q:'Why is “not” stressed in “I’m «NOT» ready”?',o:['Negatives are content words — they change the meaning.','Because it is a short word.','It should not be stressed.'],a:0},
{type:'say',q:'Say these. Tap your hand on the table on each stressed word only.',lines:['I «WANT» to «GO» «HOME».','«WHAT» do you «WANT» for «LUNCH»?','The «TEST» is on «FRI»day.','I «DON’T» «KNOW» the «AN»swer.']}
]},

{id:'r3',title:'The Schwa /ə/',
lede:'The most common sound in English is a short, relaxed “uh.”',
ru:'Самый частый звук английского — короткий нейтральный «ə». Безударные гласные часто превращаются в него — как в русском «молоко» [мəлако].',
body:`
<p>Say “uh” — short, quiet, with your mouth and tongue completely relaxed. That is the <b>schwa</b>, written <span class="sch">ə</span>. It appears in almost every English sentence, many times.</p>
<p>The schwa can be spelled with <b>any vowel letter</b>. It does not matter how the word is written — if the syllable is unstressed, the vowel often becomes <span class="sch">ə</span>:</p>
<div class="tw"><table><tr><th>Word</th><th>Sounds like</th></tr>
<tr><td>[[ba«NA»na|banana]]</td><td>b<span class="sch">ə</span>-NA-n<span class="sch">ə</span></td></tr>
<tr><td>[[«CA»nada|Canada]]</td><td>KA-n<span class="sch">ə</span>-d<span class="sch">ə</span></td></tr>
<tr><td>[[to«DAY»|today]]</td><td>t<span class="sch">ə</span>-DAY</td></tr>
<tr><td>[[«PROB»lem|problem]]</td><td>PROB-l<span class="sch">ə</span>m</td></tr>
<tr><td>[[«LEM»on|lemon]]</td><td>LEM-<span class="sch">ə</span>n</td></tr>
<tr><td>[[sup«PORT»|support]]</td><td>s<span class="sch">ə</span>-PORT</td></tr>
<tr><td>[[pho«TO»grapher|photographer]]</td><td>f<span class="sch">ə</span>-TOG-r<span class="sch">ə</span>-f<span class="sch">ə</span>r</td></tr></table></div>
<div class="box tip"><b>Not every vowel is clear</b><p>In Spanish, Tagalog, Arabic and many other languages, every vowel is pronounced clearly, the way it is written. English is different: unstressed vowels shrink to /ə/. Don’t pronounce every vowel the way it’s spelled — that is one of the biggest reasons learners sound “foreign.”</p></div>
<h3>Weak forms of small words</h3>
<p>Function words usually use the schwa. This is the main reason fast English is hard to hear:</p>
<div class="tw"><table><tr><th>Word</th><th>Strong (rare)</th><th>Weak (normal)</th><th>Example</th></tr>
<tr><td>a</td><td>“ay”</td><td><span class="sch">ə</span></td><td>[[a «CUP» of «TEA»]]</td></tr>
<tr><td>the</td><td>“thee”</td><td>th<span class="sch">ə</span></td><td>[[«OPEN» the «DOOR».]]</td></tr>
<tr><td>to</td><td>“too”</td><td>t<span class="sch">ə</span></td><td>[[«GO» to «BED».]]</td></tr>
<tr><td>for</td><td>“for”</td><td>f<span class="sch">ə</span>r</td><td>[[«THANKS» for «COM»ing.]]</td></tr>
<tr><td>of</td><td>“ov”</td><td><span class="sch">ə</span>v / <span class="sch">ə</span></td><td>[[a «LOT» of «PEO»ple]]</td></tr>
<tr><td>and</td><td>“and”</td><td><span class="sch">ə</span>n</td><td>[[«SALT» and «PEP»per]]</td></tr>
<tr><td>can</td><td>“kan”</td><td>k<span class="sch">ə</span>n</td><td>[[I can «SWIM».]]</td></tr>
<tr><td>was</td><td>“woz”</td><td>w<span class="sch">ə</span>z</td><td>[[It was «GREAT».]]</td></tr>
<tr><td>them</td><td>“them”</td><td>th<span class="sch">ə</span>m / <span class="sch">ə</span>m</td><td>[[«TELL» them.]]</td></tr></table></div>
<div class="box ca"><b>can vs can’t — a Canadian trap</b><p>“I can go” and “I can’t go” sound very similar, because the final <i>t</i> is often silent. The difference is mostly <b>stress and the vowel</b>:</p>
<p>[[I can «GO».]] → <i>can</i> is weak (k<span class="sch">ə</span>n), <b>GO</b> is strong.<br>[[I «CAN’T» «GO».]] → <i>can’t</i> is strong, with a full “a” sound (like in <i>cat</i>).</p></div>`,
ex:[
{type:'mc',q:'In “«CA»nada”, which syllables have a schwa?',o:['The first one','The second and third','All three'],a:1,why:'Only the stressed syllable keeps its full vowel: KA-nə-də.'},
{type:'mc',q:'Listen: [[I can «SEE» it.]] Did the speaker say <i>can</i> or <i>can’t</i>?',o:['can','can’t'],a:0,why:'Weak, quick <i>kən</i> and stress on SEE = can.'},
{type:'mc',q:'Listen: [[I «CAN’T» «SEE» it.]] Did the speaker say <i>can</i> or <i>can’t</i>?',o:['can','can’t'],a:1,why:'<i>Can’t</i> is stressed and has a full vowel.'},
{type:'say',q:'Say these with schwas. Do not pronounce every vowel!',lines:['a «LOT» of «PEO»ple','«FISH» and «CHIPS»','I «HAVE» to «GO» to «SCHOOL».','It was a «GOOD» «DAY».']}
]},

{id:'r4',title:'Rhythm: English Keeps the Beat',
lede:'English has a beat, like music. The strong words land on the beat.',
ru:'В английском ударные слова звучат примерно через равные промежутки времени. Безударные слова «сжимаются» между ними.',
body:`
<p>English is called a <b>stress-timed</b> language. This means: the <b>stressed syllables</b> come at roughly regular intervals, like a drum beat. The unstressed syllables between them must <b>speed up and squeeze</b> to fit.</p>
<p>Try this. Clap a steady beat and say each line — one clap on each strong word:</p>
<div class="tw"><table><tr><th>Line</th><th>Beats</th></tr>
<tr><td>[[«CATS» «EAT» «FISH».]]</td><td>3</td></tr>
<tr><td>[[The «CATS» will «EAT» the «FISH».]]</td><td>3</td></tr>
<tr><td>[[The «CATS» will have «EAT»en the «FISH».]]</td><td>3</td></tr>
<tr><td>[[The «CATS» could have been «EAT»ing the «FISH».]]</td><td>3</td></tr></table></div>
<p>All four lines have <b>three beats</b>, so they take <b>about the same time</b> — even though the last one has many more words. The small words get fast and weak.</p>
<div class="box rule"><b>Rule</b><p>Do not slow down for small words. Keep the beat on the strong words; let the weak words rush in between.</p></div>
<h3>Thought groups</h3>
<p>Long sentences are cut into <b>thought groups</b> — short chunks with a tiny pause between them. Each group usually has one main stress:</p>
<p>[[When I «GET» home, | I’m gonna «EAT», | and then I’ll do my «HOME»work.|When I get home, I'm gonna eat, and then I'll do my homework.]]</p>
<p>Pausing in the right places makes you easier to understand, even if your accent is strong. Pause at commas, between clauses, and before <i>and, but, because, so</i>.</p>
<div class="box tip"><b>Syllable-timed languages</b><p>In many languages — Spanish, French, Tagalog, Punjabi, Mandarin and others — every syllable takes about the same amount of time. English works differently: strong syllables are long, weak ones are very short. If you give every syllable the same time, your English can sound choppy (“staccato”). Practise with a beat: clap, tap your foot, or use music.</p></div>
<h3>Chants</h3>
<p>Chants are a fun way to train rhythm. Clap on the capital syllables:</p>
<ul class="lines"><li>[[«ONE», «TWO», «THREE», «FOUR».]]</li>
<li>[[«ONE» and a «TWO» and a «THREE» and a «FOUR».]]</li>
<li>[[«ONE» and then a «TWO» and then a «THREE» and then a «FOUR».]]</li></ul>
<p>Keep the same speed of clapping for all three lines!</p>`,
ex:[
{type:'mc',q:'How many beats (stressed words)? “I’m going to the store for some milk.”',o:['2','3','8'],a:1,why:'GO·ing, STORE, MILK → 3 beats. (Going can also sound like “gonna”.)'},
{type:'mc',q:'In a stress-timed language, what happens to the small words between stresses?',o:['They get longer and clearer.','They get faster and weaker so the beat stays regular.','They are always deleted.'],a:1},
{type:'say',q:'Clap a steady beat. Say all three lines with the SAME clap speed.',lines:['«DOGS» «CHASE» «CATS».','The «DOGS» will «CHASE» the «CATS».','The «DOGS» have been «CHAS»ing the «CATS».']},
{type:'reveal',q:'Where would you pause? “After school I usually go to the gym but today I have a test so I need to study.”',a:'After school | I usually go to the gym, | but today I have a test, | so I need to study.'}
]},

{id:'r5',title:'Focus Stress: Changing the Meaning',
lede:'Put extra stress on one word to show what is new, important, or different.',
ru:'Выделяя голосом одно слово, говорящий меняет смысл фразы: показывает, что важно, ново или противопоставлено.',
body:`
<p>Normally the last content word in a thought group gets the biggest stress. But you can move the <b>main stress</b> to any word to show what you mean. This is called <b>focus</b> or <b>contrastive</b> stress.</p>
<p>Same words, different meanings:</p>
<div class="tw"><table><tr><th>Sentence</th><th>Hidden meaning</th></tr>
<tr><td>[[«I» didn’t take your phone.]]</td><td>Someone else did.</td></tr>
<tr><td>[[I «DIDN’T» take your phone.]]</td><td>I did not do it — stop saying I did!</td></tr>
<tr><td>[[I didn’t «TAKE» your phone.]]</td><td>I only borrowed / moved it.</td></tr>
<tr><td>[[I didn’t take «YOUR» phone.]]</td><td>I took someone else’s.</td></tr>
<tr><td>[[I didn’t take your «PHONE».]]</td><td>I took something else.</td></tr></table></div>
<h3>When to use it</h3>
<h4>Correcting someone</h4>
<p>“You live in Ottawa?” — [[No, I live in «DEEP» River.]]</p>
<h4>Contrasting two things</h4>
<p>[[I like «TEA», but my «SIS»ter likes «COF»fee.]]</p>
<h4>Answering a question — stress the new information</h4>
<p>“What time does it start?” — [[It starts at «SEV»en.]]</p>
<p>“Does it start at six?” — [[No, at «SEV»en.]]</p>
<h4>Returning a question</h4>
<p>“How are you?” — “Good, how are [[«YOU»?|you?]]” (stress moves to <i>you</i>).</p>
<div class="box tip"><b>Focus in other languages</b><p>Many languages show focus by changing the word order or adding a small word. English mostly keeps the word order and uses <b>voice stress</b> instead. If you do not use focus stress, people may miss your point — or think you are not interested.</p></div>`,
ex:[
{type:'mc',q:'[[I didn’t say «HE» stole it.]] What does the speaker mean?',o:['I said someone else stole it.','I never said anything.','He borrowed it, not stole it.'],a:0},
{type:'mc',q:'“Is your brother 15?” — “No, my «SIS»ter is 15.” Why is SISTER stressed?',o:['It is the first word.','It corrects wrong information.','Family words are always stressed.'],a:1},
{type:'mc',q:'Friend: “How was your weekend?” You: “Great! How was ___?” Which word should be stressed?',o:['how','was','yours'],a:2,why:'Returning a question: stress moves to the new person — «YOURS».'},
{type:'say',q:'Read with the stress shown, and think about the meaning.',lines:['«I» didn’t take your phone.','I didn’t take «YOUR» phone.','No, I live in «DEEP» River.','Good, how are «YOU»?']}
]}
]});

/* ---------- UNIT 02: REDUCTIONS & LINKING ---------- */
OLD.push({id:'u2',title:'Reductions & Linking',desc:'How words shrink (gonna, wanna) and join together (pick‿it‿up).',ru:'Как слова сокращаются (gonna, wanna) и сливаются в речи.',lessons:[

{id:'k1',title:'Contractions',
lede:'In speech, Canadians almost always use contractions. Without them you sound very formal.',
ru:'Сокращения (I’m, don’t, it’s) — норма устной речи. Без них речь звучит слишком официально.',
body:`
<p>A <b>contraction</b> joins two words: <i>I am → I’m</i>. In writing, some teachers want full forms in essays. In <b>speaking</b>, contractions are normal everywhere — with friends, teachers, even in job interviews.</p>
<div class="tw"><table><tr><th>Full</th><th>Contraction</th><th>Example</th></tr>
<tr><td>I am</td><td>I’m</td><td>[[I’m «TIRED».]]</td></tr>
<tr><td>you are / we are / they are</td><td>you’re / we’re / they’re</td><td>[[They’re «LATE».]]</td></tr>
<tr><td>he is / she is / it is</td><td>he’s / she’s / it’s</td><td>[[It’s «COLD» «OUT».]]</td></tr>
<tr><td>I have / you have</td><td>I’ve / you’ve</td><td>[[I’ve «FIN»ished.]]</td></tr>
<tr><td>I will / you will</td><td>I’ll / you’ll</td><td>[[I’ll «CALL» you.]]</td></tr>
<tr><td>I would / I had</td><td>I’d</td><td>[[I’d «LIKE» a «COF»fee.]]</td></tr>
<tr><td>do not / does not / did not</td><td>don’t / doesn’t / didn’t</td><td>[[I «DON’T» «KNOW».]]</td></tr>
<tr><td>is not / are not</td><td>isn’t / aren’t</td><td>[[It «IS»n’t «FAIR».]]</td></tr>
<tr><td>cannot</td><td>can’t</td><td>[[I «CAN’T» «COME».]]</td></tr>
<tr><td>will not</td><td>won’t</td><td>[[It «WON’T» «WORK».]]</td></tr>
<tr><td>would not / should not</td><td>wouldn’t / shouldn’t</td><td>[[You «SHOULD»n’t «WOR»ry.]]</td></tr></table></div>
<div class="box tip"><b>won’t vs want</b><p>[[won’t|won't]] rhymes with <i>don’t</i> (“wohnt”). [[want]] sounds like “wahnt.” “I won’t go” = I will not go. “I want to go” = I would like to go. Listen carefully — they are opposites!</p></div>
<h3>Spoken-only contractions</h3>
<p>In speech, people contract much more than the rules for writing allow. You will hear these all the time:</p>
<div class="tw"><table><tr><th>Said</th><th>Meaning</th></tr>
<tr><td>[[My «PHONE»’s «DEAD».|my phone's dead]]</td><td>My phone is dead (battery empty).</td></tr>
<tr><td>[[«WHERE»’d you «GO»?|where'd you go?]]</td><td>Where did you go?</td></tr>
<tr><td>[[«WHAT»’s he «WANT»?|what's he want?]]</td><td>What does he want?</td></tr>
<tr><td>[[«WHO»’ve you «MET»?|who've you met?]]</td><td>Who have you met?</td></tr>
<tr><td>[[I should’ve «KNOWN».|I should've known]]</td><td>I should have known. (“should-uv”)</td></tr>
<tr><td>[[It would’ve been «FUN».|it would've been fun]]</td><td>It would have been fun.</td></tr></table></div>
<div class="box ca"><b>Spelling warning</b><p><i>should’ve</i> sounds like “should of,” but <b>“should of” is always wrong in writing</b>. Same for <i>could’ve</i> and <i>would’ve</i>. Many native speakers make this mistake — teachers will mark it.</p></div>`,
ex:[
{type:'fill',q:'Contract: “She <u>is not</u> here.” → She ___ here.',a:['isn\'t','isnt','\'s not','s not'],show:'isn’t (or: she’s not)'},
{type:'fill',q:'Contract: “I <u>will not</u> forget.” → I ___ forget.',a:['won\'t','wont'],show:'won’t'},
{type:'mc',q:'Listen: [[I «WON’T» go.|I won’t go.]] What does it mean?',o:['I will not go.','I want to go.'],a:0},
{type:'mc',q:'Which is correct in writing?',o:['I should of studied.','I should have studied.'],a:1,why:'Say “should’ve,” write “should have” or “should’ve.” Never “should of.”'}
]},

{id:'k2',title:'Gonna, Wanna, Gotta & Friends',
lede:'Very common reductions. Understand all of them; use some of them when you speak casually.',
ru:'Самые частые разговорные сокращения. Понимать нужно все; использовать — в неформальной речи, но не в письменных работах.',
body:`
<p>Some common word pairs shrink into one word in fast speech. They are <b>normal spoken English</b>, used by everyone — including teachers and news reporters in casual moments. But they are <b>not written</b> in school assignments.</p>
<div class="tw"><table><tr><th>Spoken</th><th>Full form</th><th>Example</th></tr>
<tr><td>gonna</td><td>going to (+ verb)</td><td>[[I’m gonna «CALL» you «LAT»er.]]</td></tr>
<tr><td>wanna</td><td>want to / want a</td><td>[[You wanna «COME»?]]</td></tr>
<tr><td>gotta</td><td>have got to = must</td><td>[[I gotta «GO».]]</td></tr>
<tr><td>hafta / hasta</td><td>have to / has to</td><td>[[I «HAF»ta «WORK».|I hafta work]]</td></tr>
<tr><td>kinda / sorta</td><td>kind of / sort of</td><td>[[I’m «KIN»da «TIRED».|I'm kinda tired]]</td></tr>
<tr><td>lotta</td><td>a lot of</td><td>[[a «LOT»ta «HOME»work|a lotta homework]]</td></tr>
<tr><td>outta</td><td>out of</td><td>[[Get «OUT»ta «HERE»!|get outta here]]</td></tr>
<tr><td>lemme / gimme</td><td>let me / give me</td><td>[[«LEM»me «SEE».|lemme see]] [[«GIM»me a «SEC».|gimme a sec]]</td></tr>
<tr><td>dunno</td><td>don’t know</td><td>[[I dun«NO».|I dunno]]</td></tr>
<tr><td>whaddaya</td><td>what do you / what are you</td><td>[[«WHAD»daya «THINK»?|whaddaya think?]]</td></tr>
<tr><td>didja / d’ya</td><td>did you / do you</td><td>[[«DID»ja «EAT»?|didja eat?]] [[d’ya «KNOW»?|d'ya know?]]</td></tr>
<tr><td>gotcha</td><td>(I) got you = I understand</td><td>[[«GOT»cha.|gotcha]]</td></tr>
<tr><td>y’know</td><td>you know</td><td>[[It’s «HARD», y’know?|it's hard, you know?]]</td></tr></table></div>
<div class="box rule"><b>Gonna only works before a verb</b><p>✓ <span class="right">I’m gonna <b>eat</b>.</span> (going to + verb)<br>✗ <span class="wrong">I’m gonna the store.</span> → You must say: I’m <b>going to</b> the store. (here <i>to</i> is a direction, not part of the future)</p></div>
<h3>When should you use them?</h3>
<ul><li><b>Understand them:</b> always. You will hear them every day.</li>
<li><b>Say them:</b> with friends and in casual talk — <i>gonna, wanna, kinda, gotta</i> sound natural even with a light accent.</li>
<li><b>Write them:</b> only in text messages, never in school work.</li></ul>
<div class="box tip"><b>One step at a time</b><p>Do not force every reduction. Start with the four most useful: <b>gonna, wanna, gotta, kinda</b>. The others will come naturally after months of listening.</p></div>`,
ex:[
{type:'mc',q:'Which sentence is correct?',o:['I’m gonna the gym.','I’m gonna go to the gym.','I gonna go to the gym.'],a:1,why:'<i>Gonna</i> needs a verb after it (go), and you still need <i>I’m</i>.'},
{type:'fill',q:'Listen and write the full form: [[«LEM»me «HELP» you.|lemme help you]] → ___ help you.',a:['let me'],show:'Let me'},
{type:'fill',q:'Listen and write the full form: [[You «WAN»na «WATCH» a «MOV»ie?|you wanna watch a movie?]] → Do you ___ watch a movie?',a:['want to'],show:'want to'},
{type:'mc',q:'Your friend says “Gotcha.” What do they mean?',o:['I caught you.','I understand.','I have to go.'],a:1},
{type:'say',q:'Say naturally, with the reductions.',lines:['I’m gonna be late.','You wanna grab some food?','I gotta go — see you tomorrow!','It’s kinda cold today.']}
]},

{id:'k3',title:'Linking Words Together',
lede:'English speakers do not pause between words. The end of one word joins the start of the next.',
ru:'В английской речи слова «сцепляются»: конечный звук одного слова переходит в начало следующего.',
body:`
<p>When you read, you see spaces between words. When you <b>listen</b>, there are no spaces. Words are joined into smooth chains. This is called <b>linking</b>. Learning the patterns helps you <b>hear</b> where words begin and end.</p>
<h3>1. Consonant + vowel</h3>
<p>When a word ends in a consonant and the next word starts with a vowel, the consonant <b>moves over</b> to the next word:</p>
<div class="tw"><table><tr><th>Written</th><th>Sounds like</th></tr>
<tr><td>[[pick‿it‿up|pick it up]]</td><td>pi-ki-tup</td></tr>
<tr><td>[[turn‿off|turn off]]</td><td>tur-noff</td></tr>
<tr><td>[[an‿apple|an apple]]</td><td>a-napple</td></tr>
<tr><td>[[check‿it‿out|check it out]]</td><td>che-ki-tout</td></tr>
<tr><td>[[log‿in|log in]]</td><td>lo-gin</td></tr>
<tr><td>[[What‿is‿it?|what is it?]]</td><td>wha-di-zit?</td></tr></table></div>
<h3>2. Same consonant twice</h3>
<p>When one word ends with the same sound the next word begins with, say it <b>once</b>, a little longer:</p>
<p>[[bus‿stop|bus stop]] (not “bus-stop” with two s) &nbsp; [[big‿game|big game]] &nbsp; [[some‿more|some more]] &nbsp; [[want‿to|want to]] &nbsp; [[good‿day|good day]]</p>
<h3>3. Vowel + vowel: a small glide</h3>
<p>Between two vowels, English adds a tiny <b>w</b> or <b>y</b> sound so the voice never stops:</p>
<ul><li>After <i>oo, oh, ow</i> sounds → a small <b>w</b>: [[go‿away|go away]] (go-<b>w</b>away), [[do‿it|do it]] (do-<b>w</b>it), [[how‿are you?|how are you]]</li>
<li>After <i>ee, ay, eye, oy</i> sounds → a small <b>y</b>: [[I‿am|I am]] (I-<b>y</b>am), [[see‿it|see it]] (see-<b>y</b>it), [[the‿end|the end]] (thee-<b>y</b>end)</li></ul>
<h3>4. Sounds that change: t+y, d+y, s+y</h3>
<p>When <i>you</i> or <i>your</i> follows certain sounds, the two sounds mix:</p>
<div class="tw"><table><tr><th>Mix</th><th>Example</th><th>Sounds like</th></tr>
<tr><td>t + y → ch</td><td>[[«DON’T» you|don't you]] &nbsp; [[«GOT» you|got you]]</td><td>doncha, gotcha</td></tr>
<tr><td>d + y → j</td><td>[[«DID» you|did you]] &nbsp; [[«WOULD» you|would you]]</td><td>didja, wouldja</td></tr>
<tr><td>s + y → sh</td><td>[[«MISS» you|miss you]] &nbsp; [[this «YEAR»|this year]]</td><td>mishu, thishyear</td></tr>
<tr><td>z + y → zh</td><td>[[«AS» you know|as you know]]</td><td>azhu know</td></tr></table></div>
<div class="box tip"><b>A common habit</b><p>Many learners put a small stop before every word that starts with a vowel: “pick | it | up.” This makes speech sound choppy. <b>Slide</b> the last consonant into the next word. Practise slowly first: “pi… ki… tup.”</p></div>`,
ex:[
{type:'mc',q:'How does “turn it on” usually sound?',o:['turn | it | on','tur-ni-ton','turni ton'],a:1},
{type:'mc',q:'Listen: [[«DID» you «FIN»ish?|did you finish?]] The first two words sound like…',o:['did you (clearly separated)','didja','dit you'],a:1},
{type:'mc',q:'“Bus stop” — how many “s” sounds do you hear?',o:['Two separate s sounds','One long s sound'],a:1},
{type:'say',q:'Link the words. No pauses inside each phrase!',lines:['Pick it up.','Turn it off.','Check it out.','Log in.','Go away.','Did you eat?','I’ll miss you.']}
]},

{id:'k4',title:'The Canadian T',
lede:'The letter T has several different sounds in Canadian English.',
ru:'Буква T в канадском английском звучит по-разному: иногда как быстрое «д», иногда пропадает совсем.',
body:`
<p>In many languages, <i>t</i> is always a clear <i>t</i>. In Canadian (and American) English, <b>t</b> changes depending on where it is. You do not have to copy all of these, but you <b>must recognize</b> them.</p>
<h3>1. Clear T — start of a stressed syllable</h3>
<p>At the start of a word or stressed syllable, T is strong, with a little puff of air: [[«TIME»|time]] &nbsp; [[«TEN»|ten]] &nbsp; [[at«TACK»|attack]] &nbsp; [[«TO»day|today]]</p>
<h3>2. Flap T — between vowels → a quick “d”</h3>
<p>Between two vowel sounds (and after <i>r</i>), when the next syllable is unstressed, T becomes a very fast, soft <b>d</b>-like tap:</p>
<div class="tw"><table><tr><th>Word</th><th>Sounds like</th></tr>
<tr><td>[[water]]</td><td>wah-der</td></tr>
<tr><td>[[better]]</td><td>bedder</td></tr>
<tr><td>[[city]]</td><td>ciddy</td></tr>
<tr><td>[[party]]</td><td>pardy</td></tr>
<tr><td>[[computer]]</td><td>compuder</td></tr>
<tr><td>[[little]]</td><td>liddle</td></tr>
<tr><td>[[get it|get it]] / [[a lot of|a lot of]]</td><td>geddit / a lodda</td></tr>
<tr><td>[[What are you doing?]]</td><td>whadder you doing?</td></tr></table></div>
<div class="box tip"><b>Does your language have a tapped r?</b><p>Spanish, Tagalog, Arabic, Punjabi and Russian all have an <i>r</i> made with one quick tap of the tongue. The flap T is almost the same sound! Say <i>water</i> with one quick tap — just don’t roll it.</p></div>
<p>This is why <b>writer</b> and <b>rider</b> sound almost the same in Canada, and <b>latter</b> and <b>ladder</b> too.</p>
<h3>3. Silent T — after N</h3>
<p>In casual speech, T after N often disappears:</p>
<p>[[twenty|twenty]] → “twenny” &nbsp; [[internet]] → “innernet” &nbsp; [[want to|wanna]] → “wanna” &nbsp; [[I don’t know|I dunno]]</p>
<h3>4. Stopped T — before N, or at the end</h3>
<p>Before <i>n</i> (as in <i>button</i>), the T is a short <b>stop in the throat</b>, with no puff: [[button]] (“buh-n”), [[mountain]], [[certain]], [[forgotten]].</p>
<p>At the <b>end of a word</b>, T is often not released — the tongue stops but makes no sound: [[What?|what]] &nbsp; [[hot]] &nbsp; [[I got it.]] This makes words like <i>hot / hop / hock</i> hard to tell apart at first. Listen for the vowel and context.</p>
<div class="box ca"><b>Canadian or British?</b><p>British English (and a careful teacher) often uses a clear T in <i>water</i> and <i>city</i>. Both are correct. Across Canada, you will hear the flap almost all the time. Using the flap yourself will make you sound more Canadian; using a clear T is also perfectly understood.</p></div>`,
ex:[
{type:'mc',q:'In Canadian English, “better” usually sounds like…',o:['bet-ter (clear t)','bedder (quick tap)','be-er (no sound)'],a:1},
{type:'mc',q:'Which word normally has a flap T?',o:['ten','attack','water','tea'],a:2,why:'T between vowels, before an unstressed syllable: wa-ter → “wah-der.”'},
{type:'mc',q:'Someone says “I’ll be there in twenny minutes.” What number?',o:['12','20','70'],a:1},
{type:'say',q:'Use a quick tap (like a single tapped r) for each T.',lines:['water','a little bit','What are you doing?','Let’s get it done.','I got a lot of homework.']}
]},

{id:'k5',title:'Disappearing H and Other Shortcuts',
lede:'Pronouns like him, her and them often lose their first sound.',
ru:'В местоимениях him, her, his, them начальный звук часто пропадает: tell him → «теллим».',
body:`
<h3>H-dropping in pronouns</h3>
<p>When <i>he, him, his, her, have, had</i> are <b>unstressed</b> and in the middle of a sentence, the H often disappears. Then the word links to the word before:</p>
<div class="tw"><table><tr><th>Written</th><th>Sounds like</th></tr>
<tr><td>[[«TELL» him|tell him]]</td><td>tell-im</td></tr>
<tr><td>[[«ASK» her|ask her]]</td><td>ask-er</td></tr>
<tr><td>[[Is he «HOME»?|is he home?]]</td><td>iz-ee home?</td></tr>
<tr><td>[[What did he «SAY»?|what did he say?]]</td><td>wha-di-dee say?</td></tr>
<tr><td>[[I «LIKE» his «CAR».|I like his car]]</td><td>I like-iz car</td></tr>
<tr><td>[[She must have «GONE».|she must have gone]]</td><td>she must-uv gone</td></tr></table></div>
<p>At the <b>start of a sentence</b> or when stressed, H stays: [[«HE» did it, not «ME».|he did it, not me]]</p>
<h3>Them → ’em</h3>
<p><i>Them</i> often becomes just “əm”: [[«GIVE» ’em to me.|give them to me]] &nbsp; [[I «LOVE» ’em.|I love them]] &nbsp; [[«CALL» ’em.|call them]]</p>
<h3>Of → a</h3>
<p>Before a consonant, <i>of</i> can shrink to just “ə”: [[a «CUP» of «TEA»|a cup of tea]] → “a cuppa tea”, [[«KIND» of|kind of]] → kinda, [[«OUT» of|out of]] → outta.</p>
<h3>And → ’n’</h3>
<p>[[«ROCK» and «ROLL»|rock and roll]] → rock ’n’ roll &nbsp; [[«MAC» and «CHEESE»|mac and cheese]] → mac ’n’ cheese</p>
<h3>Because → ’cause</h3>
<p>[[I «LEFT» ’cause I was «TIRED».|I left because I was tired]] — “cuz” is very common in speech and text messages.</p>
<div class="box tip"><b>Listening strategy</b><p>When you hear a strange word you cannot find in the dictionary, try adding back a missing H, T or vowel. “Izee” → <i>is he</i>. “Wudja” → <i>would you</i>. Most mystery words are two small words joined together.</p></div>`,
ex:[
{type:'fill',q:'Write the full words: [[Did you «ASK» her?|did you ask her?]] sounds like “didja ask-er?” → Did you ask ___?',a:['her'],show:'her'},
{type:'mc',q:'“I gave ’em my number.” What is ’em?',o:['him','them','a them'],a:1},
{type:'mc',q:'“Izee coming?” means…',o:['Is it coming?','Is he coming?','Easy coming?'],a:1},
{type:'say',q:'Drop the H and link.',lines:['Tell him I said hi.','What did he want?','I don’t know her.','Give them to me.']}
]}
]});

/* ---------- UNIT 03: INTONATION ---------- */
OLD.push({id:'u3',title:'Intonation',desc:'The music of the voice: rising, falling, and sounding friendly instead of rude.',ru:'Интонация: повышение и понижение голоса. Как звучать вежливо и дружелюбно.',lessons:[

{id:'i1',title:'Falling Intonation ↘',
lede:'A falling voice means “I’m finished” or “this is certain.”',
ru:'Нисходящая интонация — в утверждениях, командах и вопросах с вопросительным словом (what, where, why…).',
body:`
<p><b>Intonation</b> is the up and down movement of your voice — the “music” of a sentence. In English, the biggest movement happens on the <b>last stressed word</b> of a thought group.</p>
<p>A <b>falling</b> tone ↘ (the voice goes down at the end) is used for:</p>
<h4>Statements</h4>
<p>[[I live in «WIN»nipeg. ↘|I live in Winnipeg.]] &nbsp; [[It’s really «COLD» today. ↘|It's really cold today.]]</p>
<h4>Wh-questions (what, where, when, who, why, how)</h4>
<p>[[Where do you «LIVE»? ↘|Where do you live?]] &nbsp; [[What’s your «NAME»? ↘|What's your name?]] &nbsp; [[How «OLD» are you? ↘|How old are you?]]</p>
<h4>Commands and instructions</h4>
<p>[[Open your «BOOKS». ↘|Open your books.]] &nbsp; [[Close the «DOOR», please. ↘|Close the door, please.]]</p>
<div class="box rule"><b>Rule</b><p>The fall happens on the <b>last stressed syllable</b>: in “Where do you LIVE?” the voice is high on <i>LIVE</i> and then drops. Not on the last word — on the last <b>stressed</b> syllable: “I live in Deep RIV-er” falls on <i>RIV</i>.</p></div>
`,
ex:[
{type:'mc',q:'Which kind of sentence normally has falling intonation?',o:['Do you like pizza?','What kind of pizza do you like?','Pizza? Really?'],a:1,why:'Wh-questions (what, where, who…) fall.'},
{type:'mc',q:'In “I’m from Om-SK,” where does the voice fall?',o:['On “I’m”','On “from”','On the last stressed syllable — “OMSK”'],a:2},
{type:'say',q:'Make the voice go clearly UP on the stressed word, then DOWN.',lines:['Where do you «LIVE»?','What time is it «NOW»?','I’m from «RUS»sia.','Please sit «DOWN».']}
]},

{id:'i2',title:'Rising Intonation ↗',
lede:'A rising voice means “I’m asking” or “I’m not finished yet.”',
ru:'Восходящая интонация — в вопросах «да/нет», при переспрашивании и в перечислениях (кроме последнего элемента).',
body:`
<h3>Yes/no questions rise</h3>
<p>Questions that can be answered with <i>yes</i> or <i>no</i> usually <b>rise</b> at the end ↗:</p>
<p>[[Do you like «HOCK»ey? ↗|Do you like hockey?]] &nbsp; [[Are you «READ»y? ↗|Are you ready?]] &nbsp; [[Can I «SIT» here? ↗|Can I sit here?]]</p>
<div class="box tip"><b>Questions in other languages</b><p>In some languages, a yes/no question doesn’t rise — it uses a question word or a small particle instead (like Mandarin <i>ma</i>), or a different melody. In English, keep the voice going <b>up at the end</b>. A falling yes/no question can sound annoyed or suspicious.</p></div>
<h3>Statement + rise = a question</h3>
<p>In casual speech, you can ask a question with no grammar change — just raise your voice:</p>
<p>[[You’re «NEW» here? ↗|You're new here?]] &nbsp; [[«LUNCH»? ↗|Lunch?]] &nbsp; [[«REAL»ly? ↗|Really?]]</p>
<h3>Lists: up, up, up… down</h3>
<p>Each item rises (more is coming), the <b>last item falls</b> (finished):</p>
<p>[[I need «PEN»cils ↗, a «NOTE»book ↗, and a «CAL»culator ↘.|I need pencils, a notebook, and a calculator.]]</p>
<h3>Choice questions: up… down</h3>
<p>[[Do you want «TEA» ↗ or «COF»fee ↘?|Do you want tea or coffee?]] — falling at the end means “choose one of these two.”</p>
<p>Compare: [[Do you want tea or coffee? ↗|Do you want tea or coffee?]] with a rise at the end means “Do you want <i>a drink</i>?” — yes or no.</p>
<h3>Unfinished thoughts</h3>
<p>A small rise in the middle of a sentence tells the listener “wait, I’m not done”: [[When I got «HOME» ↗, | I went to «SLEEP» ↘.|When I got home, I went to sleep.]]</p>`,
ex:[
{type:'mc',q:'Which question normally RISES at the end?',o:['Where is the library?','Is the library open?','Why is it closed?'],a:1},
{type:'mc',q:'In a list, which item falls?',o:['The first','Every item','Only the last'],a:2},
{type:'mc',q:'Server: “Do you want fries ↗ or salad ↘?” What should you answer?',o:['Yes.','Fries, please.'],a:1,why:'Falling at the end = choose one.'},
{type:'say',q:'Rise at the end of each question.',lines:['Do you have a pen?','Is this seat free?','Are you coming tonight?','You’re from Brazil?']}
]},

{id:'i3',title:'Tag Questions and “eh?”',
lede:'Little questions at the end of a sentence — very common in Canada.',
ru:'Разделительные вопросы (isn’t it?, don’t you?) и канадское «eh?». Интонация показывает, ждёте вы согласия или задаёте настоящий вопрос.',
body:`
<p>A <b>tag question</b> is a short question added to the end of a sentence:</p>
<p>[[It’s cold today, «IS»n’t it?|It's cold today, isn't it?]] &nbsp; [[You’re new here, «AR»en’t you?|You're new here, aren't you?]] &nbsp; [[You don’t speak French, «DO» you?|You don't speak French, do you?]]</p>
<div class="box rule"><b>Grammar pattern</b><p>Positive sentence → <b>negative</b> tag: <i>It <b>is</b> cold, <b>isn’t</b> it?</i><br>Negative sentence → <b>positive</b> tag: <i>You <b>don’t</b> know, <b>do</b> you?</i><br>The tag uses the same helping verb as the sentence (is, are, do, did, can, will…).</p></div>
<h3>Intonation changes the meaning</h3>
<div class="tw"><table><tr><th>Tone</th><th>Meaning</th><th>Example</th></tr>
<tr><td>Falling ↘</td><td>“I’m sure — please agree with me.” Small talk.</td><td>[[Nice day, «IS»n’t it ↘.|nice day, isn't it.]]</td></tr>
<tr><td>Rising ↗</td><td>“I’m not sure — please tell me.” A real question.</td><td>[[The test is on Friday, «IS»n’t it? ↗|the test is on friday, isn't it?]]</td></tr></table></div>
<h3>Canada’s tag: “eh?”</h3>
<p>Canadians often use <b>eh</b> (sounds like the letter <i>A</i>) instead of a full tag. It means “right?” or “don’t you agree?”, and it usually rises:</p>
<p>[[Cold out today, «EH»? ↗|Cold out today, eh?]] &nbsp; [[Nice truck, «EH»?|Nice truck, eh?]] &nbsp; [[That was a good game, «EH»?|That was a good game, eh?]]</p>
<div class="box ca"><b>Using “eh” yourself</b><p>“Eh” is friendly and very Canadian, especially in small towns. It is fine to use it, but don’t overuse it — too many “eh”s sounds like a joke about Canadians. Other common tags: <b>right?</b> and <b>you know?</b></p></div>`,
ex:[
{type:'fill',q:'Complete the tag: “You’re new here, ___ you?”',a:['aren\'t','arent'],show:'aren’t'},
{type:'fill',q:'Complete the tag: “She didn’t call, ___ she?”',a:['did'],show:'did'},
{type:'mc',q:'“We have English next period, don’t we? ↗” (rising). The speaker is…',o:['sure and making small talk','not sure and really asking'],a:1},
{type:'mc',q:'What does “Great game, eh?” mean?',o:['Was the game great? I didn’t see it.','The game was great — don’t you agree?','Say that again?'],a:1}
]},

{id:'i4',title:'Sounding Polite and Friendly',
lede:'In English, flat intonation can sound rude or bored — even when your words are polite.',
ru:'В английском ровная интонация может звучать грубо или скучающе. Канадцы используют более широкий диапазон голоса и «смягчающие» фразы.',
body:`
<p>English speakers use a <b>wide pitch range</b> — their voice goes higher and lower than in many other languages. When a speaker uses a narrow, flat range, English listeners may think the person is:</p>
<ul><li>bored or uninterested</li><li>annoyed or angry</li><li>unfriendly</li></ul>
<p>The words can be perfect and still sound rude. Compare saying [[Thank you.]] flat and low, with saying it with a lively up-down melody: “THANK you!”</p>
<div class="box tip"><b>A very common misunderstanding</b><p>Every language has its own melody. If your language’s normal melody is flatter than English, Canadians may hear you as bored, serious or unfriendly — not because of what you say, but because of how your voice moves. This is not about personality; it is just a different melody. Try to use a bigger, warmer voice movement than feels natural at first.</p></div>
<h3>Polite request phrases</h3>
<p>Canadians rarely give direct commands to people. They use softer question forms:</p>
<div class="tw"><table><tr><th>Too direct</th><th>Polite</th><th>Very polite</th></tr>
<tr><td><span class="wrong">Give me the pen.</span></td><td>[[Can I «BOR»row your pen?]]</td><td>[[Would you mind if I borrowed your «PEN»?]]</td></tr>
<tr><td><span class="wrong">Repeat.</span></td><td>[[Could you say that a«GAIN»?]]</td><td>[[Sorry, would you mind repeating that?]]</td></tr>
<tr><td><span class="wrong">I want coffee.</span></td><td>[[Can I get a «COF»fee, please?]]</td><td>[[Could I please have a «COF»fee?]]</td></tr>
<tr><td><span class="wrong">Where is the office?</span></td><td>[[Where’s the «OF»fice, please?]]</td><td>[[Excuse me, do you know where the «OF»fice is?]]</td></tr></table></div>
<h3>“Sorry” — the Canadian word</h3>
<p>Canadians say <b>sorry</b> constantly — not only to apologize. It means:</p>
<ul><li>“Excuse me” — [[«SOR»ry, can I get by?|sorry, can I get by?]]</li>
<li>“Pardon?” — [[«SOR»ry? ↗|sorry?]]</li>
<li>“I feel bad for you” — [[Oh, I’m «SO» sorry.|oh, I'm so sorry]]</li>
<li>Even when someone else bumps into <i>them</i>!</li></ul>
<div class="box ca"><b>Pronunciation</b><p>Canadians say “sorry” as <b>SORE-ee</b> (like the word <i>sore</i>). Americans often say “SAH-ree.” This is one of the easiest ways to recognize a Canadian.</p></div>
<h3>Please and thank you</h3>
<p>Use them more than you think you need — with teachers, bus drivers, cashiers, and family. Saying <b>“Thanks!”</b> to a bus driver or cashier is normal in Canada.</p>`,
ex:[
{type:'mc',q:'Which is the most natural way to ask a classmate for a pencil?',o:['Give me a pencil.','I need your pencil.','Can I borrow a pencil?'],a:2},
{type:'mc',q:'You did not hear what the teacher said. Which is best?',o:['What?','Repeat.','Sorry, could you say that again?'],a:2},
{type:'mc',q:'Why might a Canadian think a newcomer sounds unfriendly, even when they are polite?',o:['Because of grammar mistakes.','Because their intonation is flatter.','Because they speak too loudly.'],a:1},
{type:'say',q:'Say these with a warm, lively voice — big ups and downs.',lines:['Thank you so much!','Sorry, could you say that again?','Can I get a hot chocolate, please?','Have a good day!']}
]}
]});

/* ---------- UNIT 04: SOUNDS ---------- */
OLD.push({id:'u4',title:'Sounds for Russian Speakers',desc:'The English sounds that are hardest for Russian speakers, with listening drills.',ru:'Английские звуки, которые труднее всего даются русскоговорящим. С тренажёром на слух.',lessons:[

{id:'p1',title:'TH: think and this',
lede:'English has two TH sounds. Many languages have neither — but they are easy to learn.',
ru:'В английском два звука TH: глухой /θ/ (think) и звонкий /ð/ (this). Кончик языка — между зубами.',
body:`
<h3>How to make TH</h3>
<ol><li>Put the <b>tip of your tongue between your teeth</b> — you can even let it stick out a little.</li>
<li>Blow air gently over the tongue.</li>
<li>Do not touch the tongue to the roof of your mouth (that makes t / d).</li></ol>
<p>There are two versions:</p>
<div class="tw"><table><tr><th>Sound</th><th>Voice?</th><th>Examples</th></tr>
<tr><td>/θ/ (voiceless)</td><td>No — just air, like a soft <i>s</i></td><td>[[think]] [[three]] [[thanks]] [[math]] [[birthday]] [[nothing]]</td></tr>
<tr><td>/ð/ (voiced)</td><td>Yes — the throat buzzes, like a soft <i>z</i></td><td>[[this]] [[the]] [[they]] [[mother]] [[brother]] [[with]]</td></tr></table></div>
<p>Put your hand on your throat: with /ð/ you feel buzzing, with /θ/ you don’t.</p>
<div class="box tip"><b>Common substitutions</b><p>Many learners replace TH with <b>s / z</b> (“I sink so” for <i>I think so</i>), with <b>t / d</b> (“tree” for <i>three</i>), or with <b>f / v</b>. Each one can change the meaning. Look in a mirror: if you cannot see your tongue, it is not TH.</p></div>
<div class="box tip"><b>The most common word in English</b><p><i>The</i> uses /ð/. You say it hundreds of times a day, so it is the best word to practise. In fast speech it is short and weak — “thə” — but the tongue still goes forward.</p></div>
<h3>Practice phrases</h3>
<ul class="lines"><li>[[Thank you for the birthday present.]]</li><li>[[I think there are three of them.]]</li><li>[[My mother and father are with my brother.]]</li><li>[[This Thursday is the thirteenth.]]</li></ul>`,
ex:[
{type:'pairs',q:'TH vs S, T and D. Learn the pairs, then do the listening drill.',pairs:[['think','sink'],['three','tree'],['thank','tank'],['thick','sick'],['math','mass'],['they','day'],['then','den'],['breathe','breeze'],['thought','taught'],['worth','worse']]},
{type:'mc',q:'Which word has the VOICED TH (/ð/, with buzzing)?',o:['think','thanks','mother','math'],a:2},
{type:'say',q:'Tongue between the teeth for every TH.',lines:['Thank you.','I think so.','The thirteenth of this month.','My brother’s birthday is on Thursday.']}
]},

{id:'p2',title:'W vs V',
lede:'Many languages have only one of these sounds, so W and V often get mixed up.',
ru:'В русском нет звука W. Для W губы округляются, как для «у», и зубы не касаются губы. Для V — верхние зубы касаются нижней губы.',
body:`
<div class="tw"><table><tr><th>Sound</th><th>How</th><th>Examples</th></tr>
<tr><td><b>W</b></td><td>Round your lips like a small “oo” (у). <b>Teeth do not touch the lips.</b> Then open into the vowel.</td><td>[[we]] [[week]] [[what]] [[west]] [[window]] [[work]]</td></tr>
<tr><td><b>V</b></td><td>Top teeth <b>touch the bottom lip</b> and buzz.</td><td>[[very]] [[video]] [[visit]] [[seven]] [[move]] [[live]]</td></tr></table></div>
<div class="box tip"><b>The “oo” trick</b><p>Start every W with a tiny “oo”: <i>wine</i> = “oo-ine,” <i>west</i> = “oo-est,” <i>we</i> = “oo-ee.” Then make the “oo” faster and faster until it becomes a W. Check in a mirror that your teeth never touch your lip.</p></div>
<h3>Tricky words with both</h3>
<p>[[vowel]] &nbsp; [[very well]] &nbsp; [[Volkswagen]] &nbsp; [[wolverine]] &nbsp; [[I was very worried.]] &nbsp; [[We visited Vancouver.]]</p>
<div class="box tip"><b>Also watch out for “wh”</b><p>Words with <i>wh</i> — <i>what, where, when, why, which, white</i> — all start with a W sound in Canadian English (not “hw” and not “v”). Practise: [[What? Where? When? Why?]]</p></div>`,
ex:[
{type:'pairs',pairs:[['wine','vine'],['west','vest'],['wet','vet'],['while','vile'],['worse','verse'],['wail','veil'],['wiper','viper'],['went','vent']]},
{type:'mc',q:'For the W sound, your top teeth should…',o:['touch the bottom lip','not touch the lips at all'],a:1},
{type:'say',q:'Round your lips for W, teeth on lip for V.',lines:['We went west.','Very well, thank you.','What a wonderful view!','I was very worried about the video.']}
]},

{id:'p3',title:'Short and Long Vowels: ship / sheep',
lede:'Some English vowels come in pairs. Mixing them up changes the word.',
ru:'Английские гласные бывают «напряжёнными» (sheep, долго) и «ненапряжёнными» (ship, коротко и расслабленно). Русское «и» — где-то посередине.',
body:`
<h3>/iː/ and /ɪ/ — sheep and ship</h3>
<div class="tw"><table><tr><th>Long /iː/</th><th>Short /ɪ/</th></tr>
<tr><td>Smile wide, tongue high and tense. Hold it longer.<br>[[sheep]] [[leave]] [[eat]] [[seat]] [[feel]]</td>
<td>Relax your mouth. Short. Between the “ee” of <i>see</i> and the “e” of <i>bed</i>.<br>[[ship]] [[live]] [[it]] [[sit]] [[fill]]</td></tr></table></div>
<div class="box tip"><b>Why this is hard</b><p>Many languages — Spanish, Arabic, Tagalog, French, Russian and others — have only <b>one</b> “ee” sound, somewhere between these two English sounds. If you use it for both, <i>live</i> and <i>leave</i> sound the same. Make the short /ɪ/ <b>more relaxed and lower</b>, and the long /iː/ <b>long and smiling</b>.</p></div>
<div class="box tip"><b>A sensitive pair</b><p>A few pairs, like <i>sheet / (a rude word)</i> and <i>beach / (a rude word)</i>, are famous because mixing them up is embarrassing. Make the long vowels in <i>sheet</i>, <i>beach</i>, <i>piece</i> and <i>sheep</i> clearly long and smiling!</p></div>
<h3>/uː/ and /ʊ/ — fool and full</h3>
<div class="tw"><table><tr><th>Long /uː/</th><th>Short /ʊ/</th></tr>
<tr><td>Round tight lips, longer.<br>[[fool]] [[pool]] [[food]] [[Luke]] [[shoot]]</td>
<td>Relaxed lips, short.<br>[[full]] [[pull]] [[good]] [[look]] [[should]]</td></tr></table></div>
<p>Careful: <i>food</i> is long, but <i>good, book, look, cook</i> are short — the spelling <i>oo</i> does not tell you!</p>`,
ex:[
{type:'pairs',q:'Long vs short /iː/ – /ɪ/',pairs:[['sheep','ship'],['leave','live'],['eat','it'],['seat','sit'],['feel','fill'],['heat','hit'],['week','wick'],['cheap','chip'],['green','grin'],['peel','pill']]},
{type:'pairs',q:'Long vs short /uː/ – /ʊ/',pairs:[['fool','full'],['pool','pull'],['Luke','look'],['suit','soot'],['who\'d','hood']]},
{type:'mc',q:'“Please ___ the room.” (go out) Which word, and which vowel?',o:['live — short','leave — long'],a:1},
{type:'mc',q:'Which word has the SHORT vowel /ʊ/?',o:['food','school','book','moon'],a:2}
]},

{id:'p4',title:'cat / cut / bet',
lede:'Three vowels that many learners say the same way.',
ru:'Три гласные, которые русскоговорящие часто путают: /æ/ (cat), /ʌ/ (cut), /e/ (bet).',
body:`
<div class="tw"><table><tr><th>Sound</th><th>How</th><th>Examples</th></tr>
<tr><td>/æ/ — <b>cat</b></td><td>Open your mouth <b>wide</b>, jaw down, lips spread. Between the “a” of <i>father</i> and the “e” of <i>bed</i>.</td><td>[[cat]] [[bad]] [[man]] [[have]] [[class]] [[Canada]]</td></tr>
<tr><td>/e/ — <b>bet</b></td><td>Mouth half open. Like the <i>e</i> in many languages.</td><td>[[bet]] [[bed]] [[men]] [[said]] [[friend]] [[test]]</td></tr>
<tr><td>/ʌ/ — <b>cut</b></td><td>Mouth relaxed, short, from the middle. A short, neutral “uh.”</td><td>[[cut]] [[bus]] [[fun]] [[money]] [[young]] [[love]]</td></tr></table></div>
<div class="box tip"><b>The main problem</b><p>Many learners say /æ/ like /e/, so <b>bad</b> sounds like <b>bed</b>, and <b>man</b> sounds like <b>men</b>. Open your jaw more for /æ/ — imagine you are about to bite a big apple.</p></div>
<div class="box ca"><b>The Canadian /æ/</b><p>In Canada, /æ/ is a bit more open and “back” than in the USA — closer to <i>а</i>. So “bag” in Canada sounds a little like “bahg” to Americans. Both are fine.</p></div>
<h3>Spelling surprises</h3>
<p>The /ʌ/ sound is often spelled with <b>o</b>: [[son]] [[money]] [[love]] [[come]] [[mother]] [[Monday]] [[nothing]] — and with <b>ou</b>: [[young]] [[touch]] [[country]] [[double]].</p>`,
ex:[
{type:'pairs',q:'/æ/ vs /e/',pairs:[['bad','bed'],['man','men'],['sad','said'],['had','head'],['pan','pen'],['laughed','left']]},
{type:'pairs',q:'/æ/ vs /ʌ/',pairs:[['cat','cut'],['hat','hut'],['cap','cup'],['ran','run'],['bag','bug'],['match','much']]},
{type:'mc',q:'Which word has the same vowel as “cut”?',o:['cat','come','coat','kite'],a:1}
]},

{id:'p5',title:'English H and R',
lede:'Two consonants that look easy but sound different from most other languages.',
ru:'Английский H — лёгкий выдох, не русское «х». Английский R — язык загибается назад и ничего не касается, без вибрации.',
body:`
<h3>H — just breath</h3>
<p>English H is a soft, silent <b>breath</b> — like breathing on cold glass to make it foggy. There is <b>no friction</b> in the throat.</p>
<p>[[hello]] &nbsp; [[house]] &nbsp; [[have]] &nbsp; [[hockey]] &nbsp; [[who]] &nbsp; [[behind]]</p>
<div class="box tip"><b>Not a scrape</b><p>In Spanish (<i>j</i>), Arabic (<i>خ</i>), Russian (<i>х</i>) and other languages, there is a sound that scrapes in the back of the mouth. English H is <b>not</b> that sound. If you use it, “hello” sounds harsh: “khello.” Practise by sighing: “haaa.” Then say “ha-llo” with that same soft breath. (If your language has no H at all, like French, practise the same sigh.)</p></div>
<p>Some words have a <b>silent H</b>: [[hour]] [[honest]] [[honour]] [[what]] [[when]] [[why]] — and note: <i>an hour</i>, not <i>a hour</i>.</p>
<h3>R — the Canadian R</h3>
<p>English R is different from the R in most languages:</p>
<ol><li>Pull your tongue <b>back</b> and curl the tip slightly up — but it <b>does not touch</b> anything.</li>
<li>Round your lips a little.</li>
