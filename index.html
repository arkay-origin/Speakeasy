NEW.f1={title:'At the Doctor, Clinic and Pharmacy',
lede:'Book an appointment, describe your symptoms, and understand the pharmacist.',
body:`
<h3>Where to go</h3>
<div class="tw"><table><tr><th>Place</th><th>When</th></tr>
<tr><td>[[family doctor]] (or nurse practitioner)</td><td>Your regular doctor. You book an <b>appointment</b>. Finding one can take time — ask to be put on a waiting list.</td></tr>
<tr><td>[[walk-in clinic]]</td><td>No appointment needed, but you may wait a long time. For problems that aren’t emergencies.</td></tr>
<tr><td>[[pharmacy]] (drugstore)</td><td>Medicine. Pharmacists can give advice, and in many provinces they can treat minor problems.</td></tr>
<tr><td>[[emergency room]] (ER)</td><td>Serious or urgent problems, at a hospital. Not for small problems — the wait can be many hours.</td></tr>
<tr><td>811</td><td>In most provinces, a free phone line where a nurse gives health advice, 24 hours a day.</td></tr></table></div>
<h3>Describing symptoms</h3>
<ul class="lines"><li>[[I have a sore throat.]] / [[I have a headache.]] / [[I have a fever.]]</li>
<li>[[I’ve had a cough for five days.]] — use <b>for</b> + time, with present perfect</li>
<li>[[It hurts here.]] / [[It hurts when I breathe.]]</li>
<li>[[I feel dizzy.]] / [[I feel nauseous.]] (like you might throw up)</li>
<li>[[I’m allergic to penicillin.]]</li>
<li>[[It’s getting worse.]] / [[It’s getting better.]]</li></ul>
<h3>At the pharmacy</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[prescription]]</td><td>A doctor’s order for medicine</td></tr>
<tr><td>[[refill]]</td><td>More of the same prescription</td></tr>
<tr><td>[[over the counter]]</td><td>Medicine you can buy without a prescription</td></tr>
<tr><td>[[dose]]</td><td>How much to take: “one tablet twice a day”</td></tr>
<tr><td>[[side effects]]</td><td>Unwanted effects of a medicine</td></tr></table></div>
<p>Useful questions: [[How often should I take this?]] [[Should I take it with food?]] [[Are there any side effects?]] [[Can I take this with my other medication?]]</p>
<div class="box tip"><b>Ask for an interpreter</b><p>Many hospitals and clinics can provide a free interpreter by phone. Ask: [[Is there an interpreter available? I speak Arabic.]] It’s your right to understand your health care.</p></div>`,
ex:[
{type:'dialogue',q:'At a walk-in clinic. Listen, then answer the questions below.',who:{A:'Receptionist',B:'Patient'},lines:[
 ['A','Hi there. Have you been here before?'],
 ['B','No, it’s my first time.'],
 ['A','Okay. Can I see your health card, please?'],
 ['B','Here you go.'],
 ['A','Thanks. And what brings you in today?'],
 ['B','I’ve had a sore throat and a fever for three days.'],
 ['A','All right. Please have a seat. The wait is about forty-five minutes.'],
 ['B','Okay, thank you.']]},
{type:'mc',q:'What does the receptionist ask for first?',o:['The patient’s address','The patient’s health card','Money'],a:1},
{type:'mc',q:'How long has the patient been sick?',o:['Three days','Five days','Forty-five minutes'],a:0},
{type:'mc',q:'“What brings you in today?” means…',o:['How did you get here?','Why are you here?','Who came with you?'],a:1},
{type:'fill',q:'Complete: “I’ve had a cough ___ a week.”',a:['for'],show:'for'},
{type:'mc',q:'You need more of your regular medicine. You ask the pharmacist for a…',o:['refill','side effect','walk-in'],a:0},
{type:'say',q:'Practise these.',lines:['I’d like to make an appointment.','I’ve had a headache for two days.','How often should I take this?','Is there an interpreter available?']}
]};

NEW.f2={title:'Emergencies and 911',
lede:'What to say when you call 911 — and when not to call.',
body:`
<div class="box rule"><b>Call 911 for emergencies only</b><p>Call <b>911</b> when someone’s life, health or property is in danger <b>right now</b>: a fire, a serious injury, someone not breathing, a crime happening, a serious car accident. The call is free from any phone, even a phone with no plan.</p></div>
<h3>What the operator will ask</h3>
<ol><li>[[911, what is your emergency?]] or [[Police, fire or ambulance?]]</li>
<li>[[What is the address of your emergency?]] — the most important answer. Know your address!</li>
<li>[[What happened?]]</li>
<li>[[Is the person breathing? Are they awake?]]</li>
<li>[[What’s your phone number?]]</li></ol>
<p>Stay on the line until the operator tells you to hang up. Speak slowly and answer the questions — help is already being sent while you talk.</p>
<h3>Useful phrases</h3>
<ul class="lines"><li>[[I need an ambulance.]]</li><li>[[There’s a fire in my building.]]</li><li>[[My husband fell and he’s not moving.]]</li><li>[[Someone broke into my house.]]</li><li>[[I need an interpreter. I speak Spanish.]]</li></ul>
<div class="box tip"><b>Interpreters</b><p>911 centres in Canada can connect an interpreter for many languages. Say the name of your language clearly in English: “<b>Arabic</b>,” “<b>Punjabi</b>,” “<b>Mandarin</b>.”</p></div>
<h3>Not an emergency?</h3>
<ul><li><b>Health questions:</b> call <b>811</b> in most provinces to speak with a nurse.</li>
<li><b>Police, not urgent</b> (a stolen bike, noise): call your local police <b>non-emergency number</b>.</li>
<li><b>Power outage:</b> call your electricity company.</li></ul>
<p>Write these numbers on your fridge.</p>`,
ex:[
{type:'dialogue',q:'A 911 call. Listen, then answer.',who:{A:'Operator',B:'Caller'},lines:[
 ['A','911, what is your emergency?'],
 ['B','I need an ambulance. My neighbour fell down the stairs.'],
 ['A','What is the address?'],
 ['B','It’s 42 Maple Street, apartment 3.'],
 ['A','Is she awake and breathing?'],
 ['B','Yes, she’s awake, but she can’t move her leg.'],
 ['A','Okay. An ambulance is on the way. Don’t move her. Stay on the line with me.']]},
{type:'mc',q:'What is the most important information to give 911?',o:['Your name','The address of the emergency','Your health card number'],a:1},
{type:'mc',q:'What does the operator tell the caller to do?',o:['Hang up and wait','Drive her to the hospital','Not move her and stay on the line'],a:2},
{type:'mc',q:'Your bike was stolen last night. What should you call?',o:['911','The police non-emergency number','811'],a:1},
{type:'mc',q:'You have a fever and want advice from a nurse. In most provinces, you can call…',o:['811','911','411'],a:0},
{type:'say',q:'Practise saying your own address clearly, then these phrases.',lines:['I need an ambulance.','The address is 42 Maple Street.','I need an interpreter.']}
]};

NEW.f3={title:'Renting a Home',
lede:'Words for apartments, leases and landlords — and how to ask for repairs.',
body:`
<h3>Key words</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[landlord]] / [[property manager]]</td><td>The person or company you rent from</td></tr>
<tr><td>[[tenant]]</td><td>The person who rents (you)</td></tr>
<tr><td>[[lease]]</td><td>The rental contract</td></tr>
<tr><td>[[rent]]</td><td>The money you pay every month</td></tr>
<tr><td>[[deposit]]</td><td>Money paid at the start. The rules are different in each province.</td></tr>
<tr><td>[[utilities]]</td><td>Electricity (hydro), heat, water. Ask: [[Are utilities included?]]</td></tr>
<tr><td>[[superintendent]] (the super)</td><td>The person who looks after a building and does small repairs</td></tr>
<tr><td>[[maintenance request]]</td><td>A request for a repair</td></tr>
<tr><td>[[give notice]]</td><td>Tell the landlord in writing that you will move out</td></tr>
<tr><td>[[sublet]]</td><td>Rent your place to someone else (usually needs permission)</td></tr></table></div>
<h3>Questions to ask before you rent</h3>
<ul class="lines"><li>[[How much is the rent, and when is it due?]]</li><li>[[Are utilities included?]]</li><li>[[Is parking included?]]</li><li>[[Is there laundry in the building?]]</li><li>[[How long is the lease?]]</li><li>[[Are pets allowed?]]</li></ul>
<h3>Asking for repairs</h3>
<p>Be polite, clear and specific. Say what is wrong, since when, and ask when it can be fixed: [[Hi, this is Ana in unit 4. The heater in the bedroom stopped working yesterday. Could someone come and look at it this week?]]</p>
<div class="box tip"><b>Keep it in writing</b><p>For important things — repairs, notice, rent receipts — send an email or text too, so you have a record.</p></div>
<div class="box ca"><b>Your rights</b><p>Tenant rights, deposits, rent increases and eviction rules are set by each province. Every province has a landlord–tenant office or board that gives free information. A settlement worker or legal clinic can help you if you have a problem.</p></div>`,
ex:[
{type:'dialogue',q:'Calling the landlord. Listen, then answer.',who:{A:'Tenant',B:'Landlord'},lines:[
 ['A','Hi, it’s Ana from unit 4 on Pine Street.'],
 ['B','Oh, hi Ana. What can I do for you?'],
 ['A','The heater in the bedroom stopped working last night. It’s really cold.'],
 ['B','Sorry to hear that. I can send someone tomorrow morning. Is ten o’clock okay?'],
 ['A','Yes, that works. Thank you.'],
 ['B','No problem. I’ll text you when he’s on his way.']]},
{type:'mc',q:'What is the problem?',o:['The heater doesn’t work.','The rent is too high.','There’s no hot water.'],a:0},
{type:'mc',q:'When will someone come?',o:['Tonight','Tomorrow at 10','Next week'],a:1},
{type:'mc',q:'The person you rent your apartment from is your…',o:['tenant','landlord','neighbour'],a:1},
{type:'fill',q:'Electricity, heat and water are called ___.',a:['utilities'],show:'utilities'},
{type:'mc',q:'Most polite way to ask for a repair:',o:['Fix my sink now.','The sink is leaking since yesterday. Could someone come and look at it?','Why is my sink broken?'],a:1}
]};

NEW.f4={title:'Banking and Bills',
lede:'Bank accounts, cards, paying bills — and how to recognize common scams.',
body:`
<h3>At the bank</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[chequing account]]</td><td>For everyday spending and bills</td></tr>
<tr><td>[[savings account]]</td><td>For saving money; usually earns interest</td></tr>
<tr><td>[[debit card]]</td><td>Takes money directly from your account</td></tr>
<tr><td>[[credit card]]</td><td>You borrow money and pay it back later — pay the full balance every month to avoid interest</td></tr>
<tr><td>[[PIN]]</td><td>Your secret 4-digit number. Never share it.</td></tr>
<tr><td>[[e-Transfer]]</td><td>Sending money by email or phone number (Interac e-Transfer)</td></tr>
<tr><td>[[statement]]</td><td>The list of your transactions each month</td></tr>
<tr><td>[[pre-authorized payment]]</td><td>A bill paid automatically from your account</td></tr>
<tr><td>[[due date]]</td><td>The last day to pay a bill</td></tr>
<tr><td>[[credit history]] / [[credit score]]</td><td>A record of how you pay back money. Important for renting, loans and phone plans.</td></tr></table></div>
<h3>Useful phrases</h3>
<ul class="lines"><li>[[I’d like to open a bank account.]]</li><li>[[What are the monthly fees?]]</li><li>[[Is there a newcomer account?]]</li><li>[[I don’t recognize this charge.]]</li><li>[[My card was declined.]]</li><li>[[I think my card was stolen. Can you block it?]]</li></ul>
<div class="box rule"><b>Common scams — hang up!</b><p>Real government offices and banks will <b>never</b>: threaten to arrest or deport you on the phone, ask you to pay with <b>gift cards</b>, prepaid cards or cryptocurrency, or ask for your PIN or password. If someone calls saying they are from the CRA, the police or immigration and demands money now, it is a scam. Hang up and call the official number yourself.</p></div>`,
ex:[
{type:'dialogue',q:'At the bank. Listen, then answer.',who:{A:'Bank employee',B:'Customer'},lines:[
 ['A','Good morning. How can I help you?'],
 ['B','Hi. I’d like to open a bank account. I just moved to Canada.'],
 ['A','Welcome! We have a newcomer package with no monthly fees for the first year. Do you have your passport and your PR card or permit?'],
 ['B','Yes, I have both.'],
 ['A','Great. Would you like a chequing account, a savings account, or both?'],
 ['B','Both, please. And can I get a credit card too?'],
 ['A','Yes, we have a starter card to help you build your credit history.']]},
{type:'mc',q:'Why does the customer want an account?',o:['She just moved to Canada.','She lost her card.','She wants a loan.'],a:0},
{type:'mc',q:'What is special about the newcomer package?',o:['No monthly fees for the first year','Free cash','A higher PIN'],a:0},
{type:'mc',q:'Someone calls: “This is the CRA. Pay $2,000 in gift cards today or you will be arrested.” This is…',o:['a normal tax call','a scam — hang up','a bank offer'],a:1},
{type:'mc',q:'To send money to a friend from your phone, you use…',o:['an e-Transfer','a statement','a PIN'],a:0},
{type:'fill',q:'The last day to pay a bill is the ___ date.',a:['due'],show:'due'}
]};

NEW.f5={title:'Getting Around: Transit and Driving',
lede:'Buses and trains, driver’s licences, and what to do if police stop your car.',
body:`
<h3>Public transit</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[fare]]</td><td>The price of one trip</td></tr>
<tr><td>[[transit pass]] / [[transit card]]</td><td>A card or pass for many trips (each city has its own system)</td></tr>
<tr><td>[[transfer]]</td><td>Changing from one bus or train to another, often free within a time limit</td></tr>
<tr><td>[[stop request]]</td><td>Pull the cord or press the button to ask the bus to stop</td></tr>
<tr><td>[[route]] / [[schedule]]</td><td>The path of a bus / the times it comes</td></tr></table></div>
<ul class="lines"><li>[[Does this bus go to the hospital?]]</li><li>[[How much is the fare?]]</li><li>[[Could you tell me when we get to Main Street?]]</li><li>[[Where do I transfer to the subway?]]</li></ul>
<div class="box tip"><b>Bus manners</b><p>Canadians often say <b>“Thank you!”</b> to the driver when they get off. Give your seat to older people, pregnant women and people with disabilities.</p></div>
<h3>Driving</h3>
<p>Most provinces have <b>graduated licensing</b>: you start with a learner’s licence, then a probationary one, then a full licence (in Ontario: G1, G2, G). Some newcomers can exchange a licence from their home country — check with your province. You also need <b>car insurance</b> by law.</p>
<h3>If police stop your car</h3>
<ol><li>Signal and pull over safely to the right.</li>
<li>Stay in the car. Keep your hands where the officer can see them, for example on the steering wheel.</li>
<li>Wait for the officer to speak first. Be calm and polite.</li>
<li>When asked, give your <b>driver’s licence</b>, <b>registration</b> and <b>proof of insurance</b>.</li></ol>
<p>Useful phrases: [[Here’s my licence and registration.]] [[My insurance is in the glove box. Is it okay if I get it?]] [[Sorry, my English is limited. Could you speak slowly?]]</p>`,
ex:[
{type:'dialogue',q:'On the bus. Listen, then answer.',who:{A:'Passenger',B:'Driver'},lines:[
 ['A','Hi, does this bus go to the General Hospital?'],
 ['B','Yeah, but it’s about twenty minutes. Do you have a transit card?'],
 ['A','No, I have cash. How much is the fare?'],
 ['B','Three seventy-five. Exact change, please.'],
 ['A','Okay. Could you tell me when we get there?'],
 ['B','Sure, no problem. Have a seat.']]},
{type:'mc',q:'How much is the fare?',o:['$3.75','$7.35','$37.50'],a:0},
{type:'mc',q:'“Exact change” means…',o:['The driver gives you change.','Pay the exact amount — the driver has no change.','Pay with a card.'],a:1},
{type:'mc',q:'A police officer stops your car. What should you do first?',o:['Get out and walk to the police car','Stay in the car with your hands visible','Drive to the next street'],a:1},
{type:'fill',q:'Changing from one bus to another is a ___.',a:['transfer'],show:'transfer'},
{type:'say',q:'Practise these.',lines:['Does this bus go downtown?','Could you tell me when we get to Main Street?','Here’s my licence and registration.']}
]};

NEW.f6={title:'Your Children’s School',
lede:'Talking to teachers, reporting absences, and understanding school messages.',
body:`
<h3>School words</h3>
<div class="tw"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td>[[kindergarten]] (JK, SK)</td><td>The first years of school, ages 4–5 in many provinces</td></tr>
<tr><td>[[elementary school]] / [[high school]]</td><td>Primary school / secondary school</td></tr>
<tr><td>[[report card]]</td><td>A report about your child’s progress, a few times a year</td></tr>
<tr><td>[[parent-teacher interview]]</td><td>A short meeting with your child’s teacher</td></tr>
<tr><td>[[attendance line]]</td><td>The phone number to call when your child is absent</td></tr>
<tr><td>[[permission slip]]</td><td>A form you sign so your child can go on a <b>field trip</b></td></tr>
<tr><td>[[PD day]]</td><td>Professional development day — teachers work, but there is no school for students</td></tr>
<tr><td>[[snow day]] / [[bus cancellation]]</td><td>School closed, or buses not running, because of weather</td></tr>
<tr><td>[[ESL]] / [[ELL]] support</td><td>English language help for students</td></tr></table></div>
<h3>Reporting an absence</h3>
<p>Call or message the school before classes start: [[Hi, this is Maria Lopez, Daniel’s mother. He’s in Grade 3, Mr. Chen’s class. He’s sick today and won’t be at school.]]</p>
<h3>At a parent-teacher interview</h3>
<ul class="lines"><li>[[How is my son doing in class?]]</li><li>[[Is she getting along with the other kids?]]</li><li>[[What can we do at home to help?]]</li><li>[[Is there extra help with English?]]</li><li>[[Can we use an interpreter for the meeting?]]</li></ul>
<div class="box ca"><b>School culture in Canada</b><p>Teachers expect parents to be involved: reading notes, signing forms, coming to interviews and asking questions. Asking a teacher a question is seen as caring — not as criticism.</p></div>`,
ex:[
{type:'dialogue',q:'A parent-teacher interview. Listen, then answer.',who:{A:'Teacher',B:'Parent'},lines:[
 ['A','Thanks for coming in. Amir is doing really well in math.'],
 ['B','Oh, that’s great to hear. How is his English?'],
 ['A','It’s improving fast. He’s a bit quiet in group work, though.'],
 ['B','What can we do at home to help?'],
 ['A','Reading together for fifteen minutes every night would really help. In any language!'],
 ['B','Okay, we can do that. Thank you so much.']]},
{type:'mc',q:'What is Amir good at?',o:['Math','Reading','Group work'],a:0},
{type:'mc',q:'What does the teacher suggest?',o:['Extra homework','Reading together every night','A tutor'],a:1},
{type:'mc',q:'Your child is sick and won’t go to school. You call the…',o:['attendance line','report card','permission slip'],a:0},
{type:'mc',q:'Tomorrow is a PD day. That means…',o:['There’s a party at school.','Students don’t have school.','Parents must visit the school.'],a:1},
{type:'fill',q:'To go on a field trip, your child needs a signed ___ slip.',a:['permission'],show:'permission'}
]};

NEW.f7={title:'Government Services and Forms',
lede:'Service Canada, taxes, benefits — and the words you’ll see on every form.',
body:`
<h3>Who does what</h3>
<div class="tw"><table><tr><th>Office</th><th>For</th></tr>
<tr><td>[[Service Canada]]</td><td>Social Insurance Number (SIN), Employment Insurance (EI), pensions, passports</td></tr>
<tr><td>[[CRA]] — Canada Revenue Agency</td><td>Taxes and many benefits</td></tr>
<tr><td>[[IRCC]] — Immigration, Refugees and Citizenship Canada</td><td>Permits, permanent residence, citizenship</td></tr>
<tr><td>Your province’s service office</td><td>Health card, driver’s licence, birth certificates</td></tr></table></div>
<div class="box rule"><b>File your taxes every year</b><p>Even if you earned little or no money, file a tax return every spring — the deadline for most people is <b>April 30</b>. Many benefits, like the <b>Canada Child Benefit</b> and the GST/HST credit, are only paid if you file. Free tax clinics help newcomers with simple returns.</p></div>
<h3>Form words</h3>
<div class="tw"><table><tr><th>On the form</th><th>Meaning</th></tr>
<tr><td>[[surname]] / [[last name]] / [[family name]]</td><td>Your family name</td></tr>
<tr><td>[[given name(s)]] / [[first name]]</td><td>Your personal name(s)</td></tr>
<tr><td>[[date of birth]] (DOB)</td><td>Often written YYYY-MM-DD in Canada: 1988-04-07</td></tr>
<tr><td>[[marital status]]</td><td>Single, married, common-law, separated, divorced, widowed</td></tr>
<tr><td>[[common-law]]</td><td>Living together as a couple for at least one year, without marriage</td></tr>
<tr><td>[[proof of address]]</td><td>A document with your name and address, like a bill or bank statement</td></tr>
<tr><td>[[signature]] / [[sign here]]</td><td>Write your name in your own handwriting</td></tr>
<tr><td>[[N/A]]</td><td>Not applicable — write this if a question doesn’t apply to you</td></tr>
<tr><td>[[BLOCK LETTERS]]</td><td>Write in CAPITAL LETTERS</td></tr></table></div>
<h3>Useful phrases</h3>
<ul class="lines"><li>[[I’m here to apply for a SIN.]]</li><li>[[What documents do I need to bring?]]</li><li>[[Can I do this online?]]</li><li>[[I don’t understand this question on the form. Could you help me?]]</li><li>[[How long will it take?]]</li></ul>`,

{type:'dialogue',q:'At Service Canada. Listen, then answer.',who:{A:'Officer',B:'Client'},lines:[
 ['A','Next, please! Hi, what can I help you with today?'],
 ['B','Hi. I’d like to apply for a Social Insurance Number.'],
 ['A','Sure. Can I see your passport and your permanent resident confirmation?'],

 ['A','Thanks. Is your address the same as on this document?'],

 ['A','Okay, I’ll update that. Your number will be ready in a few minutes.']]},

{type:'mc',q:'What changed?',o:['Her name','Her address','Her phone number'],a:1},
{type:'mc',q:'On a form, “surname” means…',o:['your first name','your family name','your nickname'],a:1},
{type:'mc',q:'A question on a form doesn’t apply to you. You write…',o:['N/A','OK','No'],a:0},
{type:'mc',q:'Why should you file a tax return even if you earned very little?',o:['It’s fun.','Many benefits are only paid if you file.','To get a passport.'],a:1}

NEW.f8={title:'Texts and Short Emails',
lede:'The writing you really need: short, polite messages to a boss, a landlord or a teacher.',
body:`
<p>In Canada, many everyday tasks happen by text or email: telling your boss you’re late, asking your landlord for a repair, writing to your child’s teacher. A good message is <b>short, clear and polite</b>.</p>
<h3>The shape of a short message</h3>
<ol><li><b>Greeting:</b> “Hi Sarah,” (most situations) · “Hello Mr. Chen,” (more formal)</li>
<li><b>Why you’re writing</b> — in the first sentence.</li>
<li><b>Details:</b> what, when, where.</li>
<li><b>Request or next step:</b> “Could you…?” “Please let me know…”</li>
<li><b>Thanks and closing:</b> “Thanks,” / “Thank you,” + your name.</li></ol>
<h3>Examples</h3>
<div class="box tip"><b>Text to your supervisor</b><p>Hi Mike, it’s Ana. The bus is delayed, so I’ll be about 15 minutes late. Sorry about that — see you soon.</p></div>
<div class="box tip"><b>Calling in sick (text or email)</b><p>Hi Mike, I’m sick with a fever today, so I won’t be able to come in for my shift. I’ll let you know how I’m feeling tomorrow. Thanks, Ana</p></div>
<div class="box tip"><b>Email to a landlord</b><p>Subject: Repair needed – Unit 4<br>Hello Mr. Patel,<br>The kitchen sink in unit 4 has been leaking since Monday. Could someone come to fix it this week? I’m home after 5 p.m. every day.<br>Thank you,<br>Ana Silva</p></div>
<div class="box tip"><b>Email to a teacher</b><p>Subject: Daniel – absence on Friday<br>Hello Mr. Chen,<br>Daniel will be absent on Friday because he has a medical appointment. Could you please let me know what homework he will miss?<br>Thank you,<br>Maria Lopez</p></div>
<h3>Tone tips</h3>
<ul><li>Use <b>please</b>, <b>could you</b> and <b>thanks</b>. “Fix the sink.” sounds angry in writing.</li>
<li>Don’t write in ALL CAPITALS — it looks like shouting.</li>
<li>Add a clear <b>subject line</b> to emails.</li>
<li>With friends, short forms are fine: <i>thx</i>, <i>np</i> (no problem), <i>BRB</i> (be right back). At work, write full words. <i>ASAP</i> (as soon as possible), <i>FYI</i> (for your information) and <i>ETA</i> (expected time of arrival) are common at work too.</li></ul>`,
ex:[
{type:'mc',q:'Which text to a supervisor is best?',o:['I am late.','Hi Mike, the bus is delayed so I’ll be about 15 minutes late. Sorry!','WHERE ARE YOU? THE BUS IS LATE'],a:1},
{type:'mc',q:'Which email opening is best for your child’s teacher?',o:['Hey teacher!!','Hello Ms. Wong,','To whom it may concern'],a:1},
{type:'mc',q:'Which request sounds polite in writing?',o:['Fix the heater.','You need to fix the heater today.','Could someone come to fix the heater this week?'],a:2},
{type:'mc',q:'“FYI” means…',o:['For your information','Find your ID','For you in'],a:0},
{type:'reveal',q:'Rewrite this message so it is clear and polite: <code>heater broken. come today.</code>',a:'Example: “Hi Mr. Patel, this is Ana in unit 4. The bedroom heater stopped working last night. Could someone come to look at it today or tomorrow? Thank you, Ana”'},
{type:'reveal',q:'Write a text to your supervisor: you are sick and can’t come to work today.',a:'Example: “Hi Mike, I’m sick today and won’t be able to come in for my shift. I’ll update you tomorrow. Thanks, Ana”'}
]};

 {lv:'B2',type:'mc',q:'“She’s been swamped lately.” She has been…',o:['very busy','sick','travelling'],a:0}

/* ---------- COURSE STRUCTURE (public edition) ----------
   Lessons come from OLD (generalized original lessons) and NEW (keyed by id; NEW overrides OLD).
   lv = CEFR level(s). Translations, teacher notes and language tips are merged from TR, TEACH, L1. */
const LIB={};
OLD.forEach(u=>u.lessons.forEach(l=>{LIB[l.id]=l}));
Object.keys(NEW).forEach(id=>{LIB[id]=Object.assign({id},NEW[id])});

const UNITS=[
 {num:'00',lv:'A2',title:'Start Here',desc:'How spoken English is different from written English, how this course works, and how to practise.',
  ids:[['s1','A2'],['s4','A2'],['s2','A2']]},
 {num:'01',lv:'A2–B1',title:'Consonant Sounds',desc:'Spelling vs sound, the consonants of English, and the ones learners find hardest.',

 {num:'02',lv:'A2–B1',title:'Vowel Sounds',desc:'The 16 vowel sounds of Canadian English, each with a picture keyword.',

 {num:'05',lv:'A2–B2',title:'Linking & Fast Speech',desc:'Contractions, gonna and wanna, linking, and how to understand fast speech.',
  ids:[['k1','A2'],['k2','B1'],['k3','B1'],['k5','B1–B2'],['x9','B1–B2']]},
 {num:'06',lv:'A2–B1',title:'Voice & Body Language',desc:'Rising and falling voice, sounding polite, tone of voice, and body language in Canada.',
  ids:[['i1','A2–B1'],['i2','A2–B1'],['i3','B1'],['i4','A2–B1'],['x10','B1'],['x11','A2–B1']]},
 {num:'07',lv:'A2–B1',title:'Grammar for Speaking',desc:'Articles, questions, tenses and prepositions — the grammar you use every time you talk.',
  ids:[['g1','A2–B1'],['g3','A2'],['g4','A2'],['g2','B1'],['g5','B1'],['g7','A2']]},
 {num:'08',lv:'A2–B2',title:'Expressions',desc:'Words that go together, make/do/get, phrasal verbs, and common idioms.',
  ids:[['x12','B1'],['x13','A2–B1'],['x14','A2–B1'],['g6','B1–B2'],['x16','B1'],['x15','B1–B2']]},
 {num:'09',lv:'A2–B2',title:'Everyday Canada',desc:'Small talk, work, study, Canadian words, numbers and money, technology and slang.',
  ids:[['v3','A2'],['x17','A2–B1'],['v1','A2–B1'],['v2','A2'],['x18','A2–B1'],['v5','A2'],['v4','B1'],['v6','B1–B2']]},
 {num:'10',lv:'A2–B1',title:'Life in Canada',desc:'Health, emergencies, housing, banking, transit and driving, your children’s school, government services, and writing short messages.',
  ids:[['f1','A2–B1'],['f2','A2'],['f3','B1'],['f4','A2–B1'],['f5','A2–B1'],['f6','A2–B1'],['f7','B1'],['f8','A2–B1']]},
 {num:'11',lv:'A2–B2',title:'Conversation Skills',desc:'Asking for help, keeping a conversation going, disagreeing politely, and real-life situations.',
  ids:[['c1','A2'],['c2','B1'],['c3','B1–B2'],['c4','A2–B1']]}
];

const COURSE=UNITS.map((u,ui)=>{const o=Object.assign({},u);delete o.ids;
  o.tr=(typeof TR_UNITS!=='undefined'&&TR_UNITS[ui])||{};
  o.lessons=u.ids.map(([id,lv])=>{const l=LIB[id];if(!l)throw new Error('Missing lesson: '+id);
    l.lv=lv;delete l.ru;
    l.tr={};if(typeof TR!=='undefined')Object.keys(TR).forEach(c=>{if(TR[c][id])l.tr[c]=TR[c][id]});
    if(typeof TEACH!=='undefined'&&TEACH[id])l.teach=TEACH[id];
    l.l1={};if(typeof L1!=='undefined')Object.keys(L1).forEach(c=>{if(L1[c][id])l.l1[c]=L1[c][id]});
    return l});
  return o});

</script>
<script>
/* ============ ENGINE ============ */
(function(){
"use strict";
const KEY='speakeasy.public.v1';
const DEF={done:{},ex:{},notes:{},best:{},settings:{rate:0.9,voice:'',lang:'',slow:false,level:'all',teacher:false,theme:'dark',size:1},rev:{},place:null,last:''};
let S;
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  d=d&&typeof d==='object'?d:{};const o=JSON.parse(JSON.stringify(DEF));
  for(const k in o){if(d[k]&&typeof d[k]==='object'&&o[k]&&typeof o[k]==='object')Object.assign(o[k],d[k]);else if(d[k]!==undefined)o[k]=d[k]}return o}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---- index lessons ---- */
const LESSONS=[];
COURSE.forEach((u,ui)=>u.lessons.forEach((l,li)=>{l.unit=u;l.ui=ui;l.li=li;l.idx=LESSONS.length;LESSONS.push(l)}));
const byId=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const VLIST=typeof VOWELS!=='undefined'?VOWELS:[];
const VMAP=Object.fromEntries(VLIST.map(v=>[v.c,v]));
const LANGS=typeof LANGUAGES!=='undefined'?LANGUAGES:[];
const LMAP=Object.fromEntries(LANGS.map(x=>[x.code,x]));
const LVORDER=['A1','A2','B1','B2','C1'];
function lvList(l){if(!l.lv)return[];const p=String(l.lv).split(/[–-]/);if(p.length<2)return[p[0]];const a=LVORDER.indexOf(p[0]),b=LVORDER.indexOf(p[1]);return LVORDER.slice(a,b+1)}
function lvChip(l){return l.lv?'<span class="lv">'+esc(l.lv)+'</span>':''}
function curLang(){return LMAP[S.settings.lang]||null}
function trOf(o){const L=curLang();return L&&o&&o.tr&&o.tr[L.code]?o.tr[L.code]:''}
function l1Sum(text){const L=curLang();if(!text||!L)return'';return '<p class="l1sum" dir="'+(L.rtl?'rtl':'ltr')+'" lang="'+L.code+'">'+text+'</p>'}
const unitNum=(u,ui)=>u.num||String(ui).padStart(2,'0');

/* ---- markup ---- */
function strip(s){return s.replace(/<[^>]+>/g,'').replace(/[«»·↗↘]/g,'').replace(/‿/g,' ').replace(/\s+/g,' ').trim()}
function stress(s){return s.replace(/«([^»]+)»/g,'<b class="st">$1</b>')}
function fmt(h){if(!h)return'';
  h=h.replace(/\[\[([\s\S]+?)\]\]/g,(m,inner)=>{const p=inner.split('|');const disp=p[0];const spoken=strip(p[1]!==undefined?p[1]:disp);
    return '<span class="say" role="button" tabindex="0" data-say="'+esc(spoken)+'">'+stress(disp)+'</span>'});
  h=stress(h);
  h=h.replace(/⟨([^⟩|]+)(?:\|([^⟩]*))?⟩/g,(m,sym,ipa)=>{const k=sym.replace(/^\/|\/$/g,'');if(ipa===undefined)ipa=(typeof EPA_IPA!=='undefined'&&EPA_IPA[k])||'';
    return '<span class="epa">/'+k+'/'+(ipa?'<span class="ipa">/'+ipa+'/</span>':'')+'</span>'});
  h=h.replace(/⦃([a-z]+)⦄/g,(m,c)=>{const v=VMAP[c];return v?'<span class="say vc" role="button" tabindex="0" data-say="'+v.word+'"><i style="background:'+v.hex+'"></i><span class="emo">'+v.emoji+'</span>'+v.word.toUpperCase()+'</span>':m});
  h=h.replace(/\{\{([\s\S]+?)\}\}/g,'<span class="ru">$1</span>');
  return h}

/* ---- speech ---- */
let voices=[];
const hasTTS='speechSynthesis' in window;
function loadVoices(){if(!hasTTS)return;voices=speechSynthesis.getVoices().filter(v=>/^en([-_]|$)/i.test(v.lang));fillVoices()}
function rank(v){const l=v.lang.replace('_','-').toLowerCase();let r=0;
  if(l==='en-ca')r+=40;else if(l==='en-us')r+=30;else if(l==='en-gb')r+=20;else r+=10;
  if(v.localService)r+=50;if(/natural|neural|premium|enhanced/i.test(v.name))r+=5;return r}
function pickVoice(){if(S.settings.voice){const v=voices.find(x=>x.voiceURI===S.settings.voice);if(v)return v}
  return voices.slice().sort((a,b)=>rank(b)-rank(a))[0]||null}
let playingEl=null;
function speak(text,opt={}){
  if(!hasTTS){toast('This browser has no speech voices. Try Chrome, Edge or Safari.');return}
  speechSynthesis.cancel();
  if(playingEl){playingEl.classList.remove('playing');playingEl=null}
  const u=new SpeechSynthesisUtterance(text);const v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang='en-CA';
  u.rate=opt.rate||(S.settings.slow?Math.min(0.65,S.settings.rate):S.settings.rate);
  if(opt.el){playingEl=opt.el;opt.el.classList.add('playing')}
  u.onend=u.onerror=()=>{if(opt.el)opt.el.classList.remove('playing');if(opt.onend)opt.onend()};
  speechSynthesis.speak(u)}
function secondVoice(){const a=pickVoice();const rest=voices.filter(v=>!a||v.voiceURI!==a.voiceURI).sort((x,y)=>rank(y)-rank(x));return rest[0]||null}
function speakSeq(items,onLine,onDone){if(!hasTTS){toast('This browser has no speech voices.');return}
  speechSynthesis.cancel();const vA=pickVoice(),vB=secondVoice();
  items.forEach((it,n)=>{const u=new SpeechSynthesisUtterance(it.text);const v=it.who==='B'?(vB||vA):vA;if(v){u.voice=v;u.lang=v.lang}else u.lang='en-CA';
    if(it.who==='B'&&!vB)u.pitch=1.3;if(it.who==='A'&&!vB)u.pitch=0.9;
    u.rate=S.settings.slow?Math.min(0.65,S.settings.rate):S.settings.rate;
    u.onstart=()=>onLine&&onLine(n);if(n===items.length-1)u.onend=()=>onDone&&onDone();speechSynthesis.speak(u)})}

/* ---- recorder (record & compare; audio stays on this device, in memory only) ---- */
const REC={};let recCur=null;
async function toggleRec(key,btn,onReady){
  if(recCur&&recCur.key===key){recCur.mr.stop();return}
  if(recCur){recCur.mr.stop()}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Recording is not supported in this browser.');return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Microphone not available. Allow microphone access for this page and try again.');return}
  const mr=new MediaRecorder(stream);const chunks=[];mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());btn.classList.remove('on');btn.innerHTML='&#127908; Again';
    if(REC[key])URL.revokeObjectURL(REC[key]);REC[key]=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));recCur=null;onReady&&onReady()};
  mr.start();recCur={key,mr};btn.classList.add('on');btn.innerHTML='&#9632; Stop';
  setTimeout(()=>{if(recCur&&recCur.mr===mr)mr.stop()},12000)}
function compare(text,key){const url=REC[key];if(!url)return;speak(text,{onend:()=>{setTimeout(()=>{new Audio(url).play()},350)}})}
if(hasTTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function fillVoices(){const sel=$('#voiceSel');if(!sel)return;
  const cur=pickVoice();
  sel.innerHTML=voices.length?voices.slice().sort((a,b)=>rank(b)-rank(a)).map(v=>'<option value="'+esc(v.voiceURI)+'"'+(cur&&cur.voiceURI===v.voiceURI?' selected':'')+'>'+esc(v.name)+' ('+v.lang+')'+(v.localService?' — offline':' — online')+'</option>').join(''):'<option>No English voices found</option>';
  $('#voiceNote').innerHTML=voices.length?'Voices marked <b>offline</b> work without internet. Canadian (en-CA) voices are picked first when your device has one.':'No English voices found. On Android install Google Text-to-Speech English voices; on Windows add an English voice in Settings → Time &amp; language → Speech.'}

/* ---- progress ---- */
function updProg(){const d=LESSONS.filter(l=>S.done[l.id]).length;$('#progTxt').textContent=d+' / '+LESSONS.length;$('#progBar').style.width=(LESSONS.length?d/LESSONS.length*100:0)+'%'}

/* ---- nav ---- */
function buildNav(){
  let h='<div class="lvfilter"><span>Level:</span>'+['all','A2','B1','B2'].map(v=>'<button data-lvf="'+v+'" class="'+(S.settings.level===v?'on':'')+'">'+(v==='all'?'All':v)+'</button>').join('')+'</div>';
  h+='<button class="navlink" data-go="#/home">&#8962; Course home</button><button class="navlink" data-go="#/placement">&#127919; Placement quiz</button><button class="navlink" data-go="#/review">&#128257; Review<span class="badge" id="revBadge" style="display:none">0</span></button><button class="navlink" data-go="#/lab">&#127911; Practice lab</button><button class="navlink" data-go="#/glossary">&#128214; Canadian English glossary</button><button class="navlink" data-go="#/lang">&#127760; Tips for your language</button><button class="navlink" data-go="#/teach">&#127979; For teachers</button><button class="navlink" data-go="#/about">&#9432; About &amp; licence</button><a class="navlink coffee" href="https://buymeacoffee.com/a50443536g" target="_blank" rel="noopener noreferrer" title="Free and always will be. A coffee is appreciated — never required."><span aria-hidden="true">&#9749;</span> Buy me a coffee</a>';
  let part=null;
  COURSE.forEach((u,ui)=>{const d=u.lessons.filter(l=>S.done[l.id]).length;
    if(u.part&&u.part!==part){part=u.part;h+='<div class="part">'+esc(part)+'</div>'}
    h+='<div class="unit" data-u="'+ui+'"><button class="uh" data-tog="'+ui+'"><span class="num">'+unitNum(u,ui)+'</span><span class="t">'+esc(u.title)+'</span><span class="c">'+d+'/'+u.lessons.length+'</span></button><div class="ls">';
    u.lessons.forEach(l=>{const hid=S.settings.level!=='all'&&l.lv&&!lvList(l).includes(S.settings.level);h+='<button data-go="#/l/'+l.id+'" data-lid="'+l.id+'" class="'+(S.done[l.id]?'done':'')+(hid?' hid':'')+'"><span class="dot"></span><span>'+esc(l.title)+'</span>'+lvChip(l)+'</button>'});
    if(PSEUDO['test'+ui])h+='<button data-go="#/t/'+ui+'" class="tst"><span class="dot" style="border-color:var(--teal)"></span><span>&#10003; Unit '+unitNum(u,ui)+' test</span></button>';
    h+='</div></div>'});
  $('#nav').innerHTML=h;updBadge()}
function markNav(route,lesson){
  document.querySelectorAll('#nav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===route));
  if(lesson){const u=document.querySelector('.unit[data-u="'+lesson.ui+'"]');if(u)u.classList.add('open')}}

/* ---- exercises ---- */
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,;]+$/,'').replace(/\s+/g,' ').trim()}
const NONE=['','-','–','x','0','none','nothing','∅','no article'];
function exKey(l,i){return l.id+':'+i}
function renderEx(l,e,i){
  const k=exKey(l,i);const st=S.ex[k];
  const tags={mc:'Choose',fill:'Type the answer',reveal:'Think, then check',stress:'Click the stressed syllable',pairs:'Listening — minimal pairs',say:'Listen, repeat, record',colour:'Which vowel sound?',dialogue:'Listen to the conversation'};
  let h='<div class="ex" data-k="'+k+'" data-i="'+i+'"><div class="tag">'+(e.tag||tags[e.type]||'')+'</div>';
  if(e.q)h+='<div class="q">'+fmt(e.q)+'</div>';
  if(e.type==='mc'){
    h+='<div class="opts">'+e.o.map((o,j)=>{let c='';if(st&&st.pick!==undefined){if(j===e.a)c=' ok';else if(j===st.pick)c=' no'}return '<button class="opt'+c+'" data-mc="'+j+'">'+fmt(o)+'</button>'}).join('')+'</div>';
    if(st&&st.pick!==undefined&&e.why)h+='<div class="why '+(st.ok?'ok':'no')+'">'+fmt(e.why)+'</div>';
  }else if(e.type==='fill'){
    const v=st&&st.val!==undefined?st.val:'';
    h+='<div class="row"><input class="inp'+(st?(st.ok?' ok':' no'):'')+'" value="'+esc(v)+'" placeholder="'+esc(e.ph||'your answer')+'" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pri sm" data-fill>Check</button><button class="btn sm" data-show>Show</button></div>';
    if(st&&st.shown)h+='<div class="ans">'+fmt(e.show||e.a[0])+(e.why?'<div class="why">'+fmt(e.why)+'</div>':'')+'</div>';
    else if(st&&st.ok&&e.why)h+='<div class="why ok">'+fmt(e.why)+'</div>';
  }else if(e.type==='reveal'){
    h+=st&&st.shown?'<div class="ans">'+fmt(e.a)+'</div>':'<button class="btn sm" data-reveal>Show answer</button>';
  }else if(e.type==='stress'){
    e.items.forEach((it,r)=>{const syl=it.slice(0,-1),ans=it[it.length-1];const rs=st&&st.rows&&st.rows[r];
      h+='<div class="srow"><button class="lsn" data-sw="'+esc(syl.join(''))+'" title="Listen">&#9654;</button><div class="syls">'+syl.map((s,j)=>{let c='';if(rs!==undefined){if(j===ans&&rs.done)c=' ok';else if(rs.wrong&&rs.wrong.includes(j))c=' no'}return '<button class="syl'+c+'" data-r="'+r+'" data-j="'+j+'">'+esc(s)+'</button>'}).join('')+'</div></div>'});
  }else if(e.type==='pairs'){
    h+='<div class="pairgrid">'+e.pairs.map(p=>'<span>'+p.map(w=>'[['+w+']]').map(fmt).join(' / ')+'</span>').join('')+'</div>';
    h+='<div class="drill" data-drill></div>';
  }else if(e.type==='colour'){
    const opts=(e.o||VLIST.map(v=>v.c));
    e.items.forEach((it,r)=>{const rs=st&&st.rows&&st.rows[r];
      h+='<div class="crow"><div class="w">'+fmt('[['+it[0]+']]')+'</div><div class="cpal">'+opts.map(c=>{let k='';if(rs){if(c===it[1]&&rs.done)k=' ok';else if(rs.wrong&&rs.wrong.includes(c))k=' no'}const v=VMAP[c]||{hex:'#888',emoji:'',word:c};return '<button class="cbtn'+k+'" data-r="'+r+'" data-c="'+c+'"><i class="sw" style="background:'+v.hex+'"></i><span class="emo">'+v.emoji+'</span>'+v.word.toUpperCase()+'</button>'}).join('')+'</div></div>'});
  }else if(e.type==='say'){
    h+='<ul class="lines">'+e.lines.map((ln,j)=>'<li class="chk"><input type="checkbox" aria-label="I said this" data-said="'+j+'"'+(st&&st.said&&st.said[j]?' checked':'')+'><span>'+fmt('[['+ln+']]')+'<button class="recb" data-rec="'+j+'" aria-label="Record yourself">&#127908; Record</button><button class="recp" data-recp="'+j+'"'+(REC[k+':'+j]?'':' hidden')+' aria-label="Compare with the model">&#9654; Compare</button></span></li>').join('')+'</ul>';
  }else if(e.type==='dialogue'){
    const who=e.who||{A:'A',B:'B'};
    h+='<div class="row" style="margin-bottom:6px"><button class="btn pri sm" data-dplay>&#9654; Play conversation</button><button class="btn sm" data-dstop>&#9632; Stop</button><label class="chk" style="font-size:14px;color:var(--muted);align-items:center"><input type="checkbox" data-dhide> Hide the text (listen first)</label></div>';
    h+='<div class="dlg">'+e.lines.map((ln,n)=>'<div class="dl '+ln[0]+'" data-n="'+n+'"><span class="dw">'+esc(who[ln[0]]||ln[0])+'</span><span class="dt">'+fmt('[['+ln[1]+']]')+'</span></div>').join('')+'</div>';
  }
  return h+'</div>'}
function gradable(e){return e.type==='mc'||e.type==='fill'||e.type==='stress'||e.type==='colour'}
function lessonScore(l){let n=0,ok=0;(l.ex||[]).forEach((e,i)=>{if(!gradable(e))return;n++;const s=S.ex[exKey(l,i)];if(s&&s.ok)ok++});return{n,ok}}

/* drill for minimal pairs (used in lessons and lab) */
function mountDrill(box,pairs,bestKey,rounds){
  rounds=rounds||8;let r=0,score=0,cur=null,answered=false;
  function start(){r=0;score=0;next()}
  function next(){if(r>=rounds){finish();return}
    const p=pairs[Math.floor(Math.random()*pairs.length)];const w=Math.floor(Math.random()*2);cur={p,w};answered=false;
    const order=Math.random()<.5?[0,1]:[1,0];
    box.innerHTML='<div class="meta">Round '+(r+1)+' of '+rounds+' · score '+score+'</div><div class="big">'+order.map(j=>'<button class="opt" data-pick="'+j+'">'+esc(p[j])+'</button>').join('')+'</div><div class="row" style="justify-content:center"><button class="btn sm" data-again>&#9654; Play again</button></div><div class="why" data-fb style="display:none"></div>';
    speak(p[w],{rate:Math.min(S.settings.rate,0.85)});
  }
  function finish(){const best=S.best[bestKey]||0;if(score>best){S.best[bestKey]=score;save()}

  box.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;

function sched(k,ok){const lid=k.slice(0,k.lastIndexOf(':'));if(!byId[lid])return;const now=Date.now();const r=S.rev[k];
  if(!ok){S.rev[k]={box:0,due:now+20*36e5}}
  else if(REVIEWING&&r){const b=r.box+1;if(b>=BOXES.length)delete S.rev[k];else S.rev[k]={box:b,due:now+BOXES[b]*DAY}}
  save();updBadge()}

function bindEx(view,l0){

    if(e.type==='pairs')mountDrill(box.querySelector('[data-drill]'),e.pairs,k,e.rounds);

      if(b.dataset.mc!==undefined){if(S.ex[k]&&S.ex[k].pick!==undefined)return;const j=+b.dataset.mc;S.ex[k]={pick:j,ok:j===e.a};save();sched(k,j===e.a);rerender();updScore(l)}
      else if(b.hasAttribute('data-fill')){const inp=box.querySelector('.inp');const v=norm(inp.value);
        const acc=e.a.flatMap(x=>x==='∅'?NONE:[norm(x)]);const ok=acc.includes(v);
        const had=S.ex[k]&&S.ex[k].missed;S.ex[k]=Object.assign({},S.ex[k],{val:inp.value,ok:ok||!!(S.ex[k]&&S.ex[k].ok),missed:had||!ok});save();
        if(!ok){sched(k,false);inp.classList.remove('ok');inp.classList.add('no');toast('Not quite — try again or press Show.')}else{if(!had)sched(k,true);rerender()}updScore(l)}
      else if(b.hasAttribute('data-show')){S.ex[k]=Object.assign({},S.ex[k],{shown:true});save();if(!(S.ex[k]&&S.ex[k].ok))sched(k,false);rerender()}
      else if(b.hasAttribute('data-reveal')){S.ex[k]={shown:true};save();rerender()}
      else if(b.dataset.sw!==undefined)speak(b.dataset.sw);
      else if(b.dataset.c!==undefined){const r=+b.dataset.r,c=b.dataset.c,it=e.items[r];
        const s=S.ex[k]||{rows:{}};s.rows=s.rows||{};const rs=s.rows[r]||{wrong:[]};if(rs.done)return;
        if(c===it[1])rs.done=true;else if(!rs.wrong.includes(c))rs.wrong.push(c);
        s.rows[r]=rs;s.ok=e.items.every((_,x)=>s.rows[x]&&s.rows[x].done);S.ex[k]=s;save();
        if(s.ok)sched(k,!e.items.some((_,x)=>s.rows[x].wrong&&s.rows[x].wrong.length));rerender();updScore(l);
        speak(c===it[1]?it[0]+'. '+VMAP[c].word:VMAP[c].word)}
      else if(b.dataset.r!==undefined){const r=+b.dataset.r,j=+b.dataset.j,it=e.items[r],ans=it[it.length-1];
        const s=S.ex[k]||{rows:{}};s.rows=s.rows||{};const rs=s.rows[r]||{wrong:[]};if(rs.done)return;
        if(j===ans){rs.done=true;rs.first=!rs.wrong.length}else if(!rs.wrong.includes(j))rs.wrong.push(j);
        s.rows[r]=rs;s.ok=e.items.every((_,x)=>s.rows[x]&&s.rows[x].done);S.ex[k]=s;save();
        if(s.ok)sched(k,!e.items.some((_,x)=>s.rows[x].wrong&&s.rows[x].wrong.length));rerender();updScore(l);
        if(j===ans)speak(it.slice(0,-1).join(''))}
      else if(b.dataset.rec!==undefined){const j=+b.dataset.rec;const rk=k+':'+j;toggleRec(rk,b,()=>{const p=box.querySelector('[data-recp="'+j+'"]');if(p){p.hidden=false;p.focus()}})}
      else if(b.dataset.recp!==undefined){const j=+b.dataset.recp;compare(strip(e.lines[j]),k+':'+j)}

    });

    box.addEventListener('change',ev=>{if(ev.target.hasAttribute('data-dhide')){box.querySelector('.dlg').classList.toggle('hide',ev.target.checked);return}if(ev.target.dataset.said!==undefined){const s=S.ex[k]||{said:{}};s.said=s.said||{};s.said[ev.target.dataset.said]=ev.target.checked;S.ex[k]=s;save()}});
  })}

      speak(cur[0]+'. '+VMAP[cur[1]].word);r++}

/* ---- report a problem (configured in SITE) ---- */
function reportLink(what){const C=typeof SITE!=='undefined'?SITE:{};const t='Problem in '+what;
  if(C.reportUrl)return '<div class="report">&#9873; <a href="'+C.reportUrl+'?title='+encodeURIComponent(t)+'" target="_blank" rel="noopener">Report a problem with this page</a></div>';
  if(C.reportEmail)return '<div class="report">&#9873; <a href="mailto:'+C.reportEmail+'?subject='+encodeURIComponent('Speak Easy: '+t)+'">Report a problem with this page</a></div>';
  return ''}

/* ---- unit tests (built from each unit's exercises) ---- */
COURSE.forEach((u,ui)=>{const pool=[];u.lessons.forEach(l=>(l.ex||[]).forEach(e=>{if(e.type==='mc'||e.type==='fill')pool.push(e)}));
  if(pool.length<4)return;const n=Math.min(12,pool.length),step=pool.length/n;const ex=[];for(let j=0;j<n;j++)ex.push(pool[Math.floor(j*step)]);
  PSEUDO['test'+ui]={id:'test'+ui,title:'Unit '+unitNum(u,ui)+' test: '+u.title,unit:u,ui,li:0,lv:u.lv,lede:'A short mixed test with questions from every lesson in this unit.',body:'',ex}});
function viewTest(ui){const l=PSEUDO['test'+ui];if(!l)return'<p>No test for this unit.</p>';const sc=lessonScore(l);
  return '<div class="kicker">Unit '+unitNum(l.unit,ui)+' · '+esc(l.unit.title)+lvChip(l)+'</div><h2 class="title">Unit test</h2><p class="lede">'+esc(l.lede)+' Answer every question, then check your score.</p>'+
   '<div class="toolrow"><button class="btn sm" data-print="ws">&#128424; Print test</button>'+(S.settings.teacher?'<button class="btn sm" data-print="key">&#128424; Print answer key</button>':'')+'<button class="btn sm" id="resetTest">&#8634; Start again</button></div>'+
   '<div class="practice" style="margin-top:14px;border:0;padding-top:0"><div class="score" id="scoreLine">'+sc.ok+' of '+sc.n+' correct</div>'+l.ex.map((e,i)=>renderEx(l,e,i)).join('')+'</div>'}

/* ---- review (spaced repetition of missed exercises) ---- */
function viewReview(){const due=dueList();const later=Object.keys(S.rev).length-due.length;
  let h='<div class="kicker">Practice</div><h2 class="title">Review</h2><p class="lede">Exercises you got wrong come back here — after 1 day, then 3, 7 and 21 days. Answer correctly and they come back less often, until they’re learned.</p>';
  if(!due.length)return h+'<div class="result"><h3>Nothing to review right now</h3><p>'+(later?later+' exercise'+(later>1?'s':'')+' will come back in the next few days.':'When you miss an exercise in a lesson, it will appear here later.')+'</p></div>';
  h+='<p class="why">'+due.length+' due now'+(later?' · '+later+' later':'')+'. Showing up to 10.</p>';
  due.slice(0,10).forEach(k=>{const l=lessonOf(k),i=+k.slice(k.lastIndexOf(':')+1),e=l.ex[i];if(!e||!gradable(e)){delete S.rev[k];return}
    delete S.ex[k];h+='<div class="reviewfrom">From: <a href="#/l/'+l.id+'">'+esc(strip(l.title))+'</a></div>'+renderEx(l,e,i)});
  save();return h}

/* ---- placement quiz ---- */
function viewPlacement(){const l=PSEUDO.place;if(!l)return'';const answered=l.ex.filter((e,i)=>S.ex['place:'+i]&&S.ex['place:'+i].pick!==undefined).length;
  let h='<div class="kicker">Start here</div><h2 class="title">Placement quiz</h2><p class="lede">15 quick questions to suggest a starting level. Don’t guess — if you don’t know, choose the answer you think is most likely, and keep going.</p>';
  h+='<div class="practice" style="margin-top:10px;border:0;padding-top:0"><div class="score" id="placeCount">'+answered+' of '+l.ex.length+' answered</div>'+l.ex.map((e,i)=>renderEx(l,e,i)).join('')+'</div><div id="placeResult"></div>';
  return h}
function placeResult(){const l=PSEUDO.place;const res={A2:[0,0],B1:[0,0],B2:[0,0]};let all=true;
  l.ex.forEach((e,i)=>{const st=S.ex['place:'+i];if(!st||st.pick===undefined){all=false;return}res[e.lv][1]++;if(st.ok)res[e.lv][0]++});
  const cnt=$('#placeCount');if(cnt)cnt.textContent=l.ex.filter((e,i)=>S.ex['place:'+i]&&S.ex['place:'+i].pick!==undefined).length+' of '+l.ex.length+' answered';
  const box=$('#placeResult');if(!box)return;if(!all){box.innerHTML='';return}
  const tot=res.A2[0]+res.B1[0]+res.B2[0];const lv=tot<=7?'A2':tot<=11?'B1':'B2';S.place={lv,at:Date.now()};save();
  const msg={A2:'Start with the <b>A2</b> lessons. Units 00–02 (sounds), 07 (grammar), 09 (everyday Canada), 10 (life in Canada) and 11 are a great beginning.',B1:'Start with the <b>B1</b> lessons — word stress, rhythm, linking and expressions. Review A2 lessons whenever something feels difficult.',B2:'Start with the <b>B2</b> lessons — fast speech, focus stress, idioms and slang. Use the sound units to polish your accent.'}[lv];
  const top=tot>=14?'<p><b>Excellent score!</b> B2 is the highest level in this course, so you may already be above it. The most useful parts for you are probably fast speech, idioms and slang, the Canadian English glossary, and polishing your accent in the sound units.</p>':'';
  box.innerHTML='<div class="result"><h3>Suggested level: '+lv+'</h3><p>'+msg+'</p>'+top+'<p class="why">Total: '+tot+' / 15 — A2: '+res.A2[0]+'/'+res.A2[1]+' · B1: '+res.B1[0]+'/'+res.B1[1]+' · B2: '+res.B2[0]+'/'+res.B2[1]+'</p><div class="row" style="margin-top:10px"><button class="btn pri" id="placeStart">&#9654; Start the first '+lv+' lesson</button><button class="btn" id="placeAgain">Take the quiz again</button></div></div>';
  $('#placeStart').onclick=()=>{S.settings.level=lv;save();buildNav();const first=LESSONS.find(x=>lvList(x).includes(lv));location.hash=first?'#/l/'+first.id:'#/home'};
  $('#placeAgain').onclick=()=>{l.ex.forEach((e,i)=>delete S.ex['place:'+i]);S.place=null;save();route()}}
if(typeof PLACEMENT!=='undefined')PSEUDO.place={id:'place',title:'Placement quiz',unit:{title:'Placement'},ui:0,li:0,body:'',ex:PLACEMENT};

function viewLesson(l){
  S.last=l.id;save();
  const u=l.unit;const prev=LESSONS[l.idx-1],next=LESSONS[l.idx+1];const sc=lessonScore(l);
  let h='<div class="kicker">Unit '+unitNum(u,l.ui)+' · '+esc(u.title)+' · Lesson '+(l.li+1)+' of '+u.lessons.length+lvChip(l)+'</div>';
  h+='<h2 class="title">'+fmt(l.title)+'</h2>';
  if(l.lede)h+='<p class="lede">'+fmt(l.lede)+'</p>';
  h+=l1Sum(trOf(l));
  h+='<div class="toolrow"><button class="btn sm" data-print="ws">&#128424; Print worksheet</button>'+(S.settings.teacher?'<button class="btn sm" data-print="key">&#128424; Print answer key</button>':'')+'</div>';
  if(S.settings.teacher)h+=teachHTML(l);
  h+='<div class="body">'+fmt(l.body)+'</div>';
  const L=curLang();if(L&&l.l1&&l.l1[L.code])h+='<div class="box l1box"><b>For '+esc(L.en)+' speakers</b>'+fmt(l.l1[L.code])+'</div>';
  if(l.ex&&l.ex.length){h+='<div class="practice"><h3>Practice</h3><div class="score" id="scoreLine">'+(sc.n?sc.ok+' of '+sc.n+' checked exercises correct':'')+'</div>'+l.ex.map((e,i)=>renderEx(l,e,i)).join('')+'</div>'}
  if(l.li===u.lessons.length-1&&PSEUDO['test'+l.ui])h+='<div class="box tip"><b>End of unit</b><p>Finished this unit? Try the <a href="#/t/'+l.ui+'">Unit '+unitNum(u,l.ui)+' test</a>.</p></div>';
  h+='<div class="notes"><label for="notes">My notes</label><textarea id="notes" placeholder="Words to remember, questions for your teacher…">'+esc(S.notes[l.id]||'')+'</textarea></div>';
  h+='<div class="foot"><div>'+(prev?'<button class="btn" data-go="#/l/'+prev.id+'">&#8592; Back</button>':'')+'</div><button class="btn done-btn'+(S.done[l.id]?' is':'')+'" id="doneBtn">'+(S.done[l.id]?'&#10003; Completed':'Mark lesson complete')+'</button><div>'+(next?'<button class="btn pri" data-go="#/l/'+next.id+'">Next &#8594;</button>':'')+'</div></div>'+reportLink('lesson “'+strip(l.title)+'” ('+l.id+')');
  return h}

function allPairSets(){const sets=[];LESSONS.forEach(l=>(l.ex||[]).forEach(e=>{if(e.type==='pairs')sets.push({name:l.title,pairs:e.pairs})}));return sets}
function viewLab(){
  const sets=allPairSets();
  return '<div class="kicker">Tools</div><h2 class="title">Practice lab</h2><p class="lede">Extra practice you can repeat as often as you like.</p>'+
  '<div class="tool"><h3>Say anything</h3><div class="d">Type or paste any English text and hear it. Good for checking new words from school.</div><textarea class="inp" id="anyTxt" placeholder="Type English here…">Could you say that again, please?</textarea><div class="row" style="margin-top:10px"><button class="btn pri" id="anyGo">&#9654; Normal</button><button class="btn" id="anySlow">&#128034; Slow</button><button class="btn recb" id="anyRec" style="margin-left:0">&#127908; Record</button><button class="btn" id="anyCmp" hidden>&#9654; Compare</button></div><div class="why" style="margin-top:8px">Record yourself, then press <b>Compare</b> to hear the model and then your own voice. Recordings stay on this device and disappear when you leave the page.</div></div>'+
  '<div class="tool"><h3>Vowel chart</h3><div class="d">The vowel sounds of Canadian English, each with a keyword. Tap a keyword or an example to hear it.</div><div data-widget="vowelchart"></div></div>'+
  '<div class="tool"><h3>Which vowel?</h3><div class="d">See a word, hear it, choose the keyword with the same vowel sound.</div><div class="row"><select class="inp" id="cdSel"><option value="all">All vowel sounds</option><option value="short">Short vowels</option><option value="long">Long vowels</option><option value="glide">Gliding vowels</option><option value="r">R-vowels</option><option value="hard">Most often confused</option></select></div><div id="cdBox"></div></div>'+
  '<div class="tool"><h3>What does it really mean?</h3><div class="d">Canadian words and expressions that don’t mean what they sound like. From the <a href="#/glossary">glossary</a>.</div><div class="drill" id="gqBox"></div></div>'+
  '<div class="tool"><h3>Sound trainer</h3><div class="d">Hear one word, choose which one it was. Pick a sound set.</div><div class="row"><select class="inp" id="pairSel"><option value="all">All sound sets mixed</option>'+sets.map((s,i)=>'<option value="'+i+'">'+esc(s.name)+'</option>').join('')+'</select></div><div class="drill" id="labDrill"></div></div>'+
  '<div class="tool"><h3>Teen or ty?</h3><div class="d">thir<b class="st">TEEN</b> (13) or <b class="st">THIR</b>ty (30)? Listen to where the stress is.</div><div class="drill" id="teenDrill"></div></div>'+
  '<div class="tool"><h3>Numbers by ear</h3><div class="d">Prices, times, years and phone numbers. Type what you hear using digits (e.g. <code>4.99</code>, <code>7:45</code>, <code>1998</code>, <code>613-555-0142</code>).</div><div class="row"><select class="inp" id="numMode"><option value="price">Prices</option><option value="time">Times</option><option value="year">Years</option><option value="phone">Phone numbers</option></select><button class="btn pri" id="numPlay">&#9654; New number</button><button class="btn" id="numAgain">Again</button></div><div class="row" style="margin-top:10px"><input class="inp" id="numIn" placeholder="type what you heard" autocomplete="off"><button class="btn" id="numCheck">Check</button></div><div class="why" id="numFb" style="display:none"></div></div>'}

function bindLab(){
  $('#anyGo').onclick=()=>speak($('#anyTxt').value,{rate:S.settings.rate});
  $('#anySlow').onclick=()=>speak($('#anyTxt').value,{rate:0.6});
  $('#anyRec').onclick=()=>toggleRec('lab',$('#anyRec'),()=>{$('#anyCmp').hidden=false});
  $('#anyCmp').onclick=()=>compare($('#anyTxt').value,'lab');
  mountWidgets($('#view'));
  if(GL.length)mountGlossQuiz($('#gqBox'));
  const CDSETS=Object.assign({all:null},typeof VOWEL_SETS!=='undefined'?VOWEL_SETS:{});
  const cdMount=()=>{const v=$('#cdSel').value;const box=$('#cdBox');box.className='drill';mountColourDrill(box,CDSETS[v],'cdlab:'+v,10)};
  $('#cdSel').onchange=cdMount;if(VLIST.length)cdMount();
  const sets=allPairSets();
  const mount=()=>{const v=$('#pairSel').value;const pairs=v==='all'?sets.flatMap(s=>s.pairs):sets[+v].pairs;mountDrill($('#labDrill'),pairs,'lab:'+v,10)};
  $('#pairSel').onchange=mount;if(sets.length)mount();
  const teen=[];for(let n=3;n<=9;n++){const t=['thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'][n-3],y=['thirty','forty','fifty','sixty','seventy','eighty','ninety'][n-3];teen.push([t,y])}
  mountDrill($('#teenDrill'),teen,'lab:teen',10);
  let cur=null;
  const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  function gen(m){if(m==='price'){const d=r(1,49),c=[0,25,49,50,75,95,99][r(0,6)];const ans=d+'.'+String(c).padStart(2,'0');return{ans,say:c?d+' '+(c<10?'oh '+c:c):d+' dollars'}}
    if(m==='time'){const hh=r(1,12),mm=[0,5,10,15,20,30,40,45,50,55][r(0,9)];const ans=hh+':'+String(mm).padStart(2,'0');return{ans,say:mm===0?hh+" o'clock":mm<10?hh+' oh '+mm:hh+' '+mm}}
    if(m==='year'){const y=r(1950,2030);return{ans:String(y),say:String(y)}}
    const a='613',b='555',c=String(r(100,9999)).padStart(4,'0');return{ans:a+'-'+b+'-'+c,say:a.split('').join(' ')+', '+b.split('').join(' ')+', '+c.split('').join(' ')}}
  $('#numPlay').onclick=()=>{cur=gen($('#numMode').value);$('#numIn').value='';$('#numFb').style.display='none';speak(cur.say)};
  $('#numAgain').onclick=()=>{if(cur)speak(cur.say,{rate:0.7})};
  const chk=()=>{if(!cur){toast('Press “New number” first');return}const clean=s=>s.replace(/[^0-9]/g,'');const ok=clean($('#numIn').value)===clean(cur.ans);
    const fb=$('#numFb');fb.style.display='block';fb.className='why '+(ok?'ok':'no');fb.innerHTML=ok?'Correct! <b>'+cur.ans+'</b>':'It was <b>'+cur.ans+'</b>. Press Again to hear it slowly.'};
  $('#numCheck').onclick=chk;$('#numIn').onkeydown=e=>{if(e.key==='Enter')chk()};
}

/* ---- router ---- */
function route(){
  const hsh=location.hash||'#/home';const view=$('#view');let lesson=null;REVIEWING=false;view.onclick=null;
  if(recCur){try{recCur.mr.stop()}catch(e){}}
  if(hasTTS)speechSynthesis.cancel();
  if(hsh.startsWith('#/l/')&&byId[hsh.slice(4)]){lesson=byId[hsh.slice(4)];view.innerHTML=viewLesson(lesson);
    $('#crumb').textContent=lesson.unit.title+' › '+strip(lesson.title);bindEx(view,lesson);mountWidgets(view);
    view.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printLesson(lesson,b.dataset.print==='key'));
    $('#notes').oninput=e=>{S.notes[lesson.id]=e.target.value;save()};
    $('#doneBtn').onclick=()=>{S.done[lesson.id]=!S.done[lesson.id];if(!S.done[lesson.id])delete S.done[lesson.id];save();updProg();buildNav();markNav(hsh,lesson);
      const b=$('#doneBtn');b.classList.toggle('is',!!S.done[lesson.id]);b.innerHTML=S.done[lesson.id]?'&#10003; Completed':'Mark lesson complete';if(S.done[lesson.id])toast('Lesson complete. Nice!')};
  }else if(hsh==='#/lab'){view.innerHTML=viewLab();$('#crumb').textContent='Practice lab';bindLab()}
  else if(hsh==='#/review'){REVIEWING=true;view.innerHTML=viewReview();$('#crumb').textContent='Review';bindEx(view,null)}
  else if(hsh==='#/placement'){view.innerHTML=viewPlacement();$('#crumb').textContent='Placement quiz';bindEx(view,PSEUDO.place);view.onclick=()=>setTimeout(placeResult,0);placeResult()}
  else if(hsh.startsWith('#/t/')&&PSEUDO['test'+hsh.slice(4)]){const t=PSEUDO['test'+hsh.slice(4)];view.innerHTML=viewTest(+hsh.slice(4));$('#crumb').textContent=t.title;bindEx(view,t);
    view.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printLesson(t,b.dataset.print==='key'));
    $('#resetTest').onclick=()=>{t.ex.forEach((e,i)=>delete S.ex[t.id+':'+i]);save();route()}}
  else if(hsh==='#/glossary'){view.innerHTML=viewGlossary();$('#crumb').textContent='Canadian English glossary';bindGlossary()}
  else if(hsh==='#/lang'){view.innerHTML=viewLang();$('#crumb').textContent='Tips for your language'}
  else if(hsh==='#/teach'){view.innerHTML=fmt(viewTeach());$('#crumb').textContent='For teachers';mountWidgets(view)}
  else if(hsh==='#/about'){view.innerHTML=fmt(viewAbout());$('#crumb').textContent='About & licence'}
  else{view.innerHTML=viewHome();$('#crumb').textContent='Course home'}
  markNav(hsh,lesson);document.body.classList.remove('nav-open');window.scrollTo(0,0)}

/* ---- global events ---- */
document.addEventListener('click',ev=>{
  const say=ev.target.closest('.say');if(say){speak(say.dataset.say,{el:say});return}
  const go=ev.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return}
  const lvf=ev.target.closest('[data-lvf]');if(lvf){S.settings.level=lvf.dataset.lvf;save();buildNav();markNav(location.hash||'#/home',byId[(location.hash||'').slice(4)]);if(S.settings.level!=='all')document.querySelectorAll('.unit').forEach(u=>{if(u.querySelector('.ls button:not(.hid)'))u.classList.add('open')});return}
  const sl=ev.target.closest('[data-setlang]');if(sl){S.settings.lang=sl.dataset.setlang;save();syncPills();route();return}
  const tog=ev.target.closest('[data-tog]');if(tog){tog.parentElement.classList.toggle('open')}
});
window.addEventListener('hashchange',route);
$('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');
$('#scrim').onclick=()=>document.body.classList.remove('nav-open');
function syncPills(){$('#teachChk').checked=!!S.settings.teacher;$('#slowBtn').classList.toggle('on',!!S.settings.slow);$('#slowBtn').setAttribute('aria-pressed',S.settings.slow?'true':'false');
  document.body.classList.toggle('light',S.settings.theme==='light');document.documentElement.style.setProperty('--zoom',S.settings.size||1);
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.theme===(S.settings.theme||'dark')));
  document.querySelectorAll('#sizeSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.size===+(S.settings.size||1)));
  const sel=$('#langSel');sel.innerHTML='<option value="">EN</option>'+LANGS.map(x=>'<option value="'+x.code+'">'+x.native+'</option>').join('');sel.value=S.settings.lang||'';
  sel.parentElement.classList.toggle('on',!!S.settings.lang);const L=curLang();document.documentElement.setAttribute('data-l1',L?L.code:'')}
$('#slowBtn').onclick=()=>{S.settings.slow=!S.settings.slow;save();syncPills();toast(S.settings.slow?'Slow audio on':'Normal speed')};
$('#langSel').onchange=e=>{S.settings.lang=e.target.value;save();syncPills();route()};
$('#setBtn').onclick=()=>{fillVoices();$('#rate').value=S.settings.rate;$('#rateVal').textContent=S.settings.rate+'×';$('#setModal').classList.add('show')};
$('#setClose').onclick=()=>$('#setModal').classList.remove('show');
$('#setModal').onclick=e=>{if(e.target.id==='setModal')e.currentTarget.classList.remove('show')};
$('#themeSeg').onclick=e=>{const b=e.target.closest('[data-theme]');if(!b)return;S.settings.theme=b.dataset.theme;save();syncPills()};
$('#sizeSeg').onclick=e=>{const b=e.target.closest('[data-size]');if(!b)return;S.settings.size=+b.dataset.size;save();syncPills()};
$('#teachChk').onchange=e=>{S.settings.teacher=e.target.checked;save();syncPills();route()};
$('#voiceSel').onchange=e=>{S.settings.voice=e.target.value;save()};
$('#voiceTest').onclick=()=>speak('Hi there! Welcome to Canada. How’s it going?');
$('#rate').oninput=e=>{S.settings.rate=+e.target.value;$('#rateVal').textContent=S.settings.rate+'×';save()};
$('#expBtn').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='speak-easy-public-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
$('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||typeof d!=='object'||!d.done)throw 0;localStorage.setItem(KEY,JSON.stringify(d));S=load();save();buildNav();updProg();syncPills();route();toast('Progress imported')}catch(x){toast('That file is not a Speak Easy backup')}};rd.readAsText(f);e.target.value=''};
$('#resetBtn').onclick=()=>{if(confirm('Erase all progress, answers and notes? This cannot be undone.')){S=JSON.parse(JSON.stringify(DEF));save();buildNav();updProg();syncPills();route();toast('Progress erased')}};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('say')){e.preventDefault();speak(e.target.dataset.say,{el:e.target});return}if(e.key==='Escape'){$('#setModal').classList.remove('show');document.body.classList.remove('nav-open')}});

buildNav();updProg();syncPills();route();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
